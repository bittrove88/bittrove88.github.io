name: ARCLINE staging safety
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'ARCLINE/environments/**'
      - 'ARCLINE/docs/change-requests/ARCLINE_V2_STAGING_SAFETY_PHASE1.md'
      - '.github/workflows/arcline-staging-safety.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-safety:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Staging-only artifact guard tests
        run: python3 -m unittest discover -s ARCLINE/environments/tests -v
      - name: Syntax check
        run: python3 -m py_compile ARCLINE/environments/tools/verify_staging_site.py
      - name: Memory-only initial conditions
        run: node ARCLINE/environments/tests/staging-session.test.cjs
      - name: Build STG artifact without modifying production
        run: >-
          python3 ARCLINE/environments/tools/build_staging.py
          --output "$RUNNER_TEMP/staging-site" --source-commit "$GITHUB_SHA" --require-clean
      - name: Verify packaged source hashes
        env:
          ARCLINE_STAGING_SITE: ${{ runner.temp }}/staging-site
        run: python3 -m unittest discover -s ARCLINE/environments/tests -v
      - name: Browser dependencies
        working-directory: ARCLINE
        run: |
          npm ci
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ]; then
            npx playwright install --with-deps chromium
          fi
      - name: Browser storage non-interference and STG startup
        working-directory: ARCLINE
        env:
          ARCLINE_STAGING_SITE: ${{ runner.temp }}/staging-site
          ARCLINE_EVIDENCE_DIR: ${{ runner.temp }}/staging-evidence
        run: node environments/tests/staging-browser.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: staging-evidence
          path: ${{ runner.temp }}/staging-evidence
