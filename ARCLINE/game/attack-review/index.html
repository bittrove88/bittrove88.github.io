<title>ARCLINE 攻撃の動作確認</title>
<link rel="stylesheet" href="review.css">
<main><header><a href="../dist/">ARCLINE</a><h1>攻撃の動作確認</h1><p>実戦と同じ弾道・命中判定・描画を使用します。この画面は攻略の保存を読み書きしません。</p></header>
<section class="controls"><label>分類<select id="category"></select></label><label>キャラと技<select id="attack"></select></label><label>確認場面<select id="scene"><option value="arena">基本の射撃場</option><option value="map">実際のマップ</option><option value="wall">遮蔽</option><option value="reflect">反射</option><option value="gap">床の途切れ</option><option value="miss">外れる弾道</option></select></label><label>モーション<select id="timing"><option value="crafted">調整後</option><option value="physical">時間変化なしと比較</option></select></label><label>速さ<select id="speed"><option value="1">通常</option><option value="0.5">半分</option><option value="0.25">4分の1</option></select></label><button id="play">再生</button><button id="pause">一時停止</button><button id="previous">前の技</button><button id="next">次の技</button></section>
<canvas id="canvas" aria-label="実エンジンの攻撃確認"></canvas><label class="timeline">経過時間<input id="time" type="range" min="0" max="1" value="0" step="0.005"><output id="clock"></output></label>
<section class="description"><h2 id="name"></h2><dl><dt>弾道</dt><dd id="trajectory"></dd><dt>着弾</dt><dd id="impact"></dd><dt>敵効果</dt><dd id="effect"></dd><dt>間と速度</dt><dd id="motion"></dd></dl><p id="proof" role="status"></p></section></main>
