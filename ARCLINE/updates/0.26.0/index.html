<h1>ARCLINE 0.26.0</h1>
<p>結晶・開閉橋・磁場・端子の最初の体験を、地形と行動の変化に結び付けました。</p>
<ul><li>31面は、入口の結晶で一度返して洞室へ狙う配置にしました。</li><li>37面は、橋が起きた後に下の固定島から狙い直せます。</li><li>71面は、手前の磁場へ低所と上棚から入射できます。</li><li>73面は、端子で極性を変えた次の手番に、左の洞室へ曲げ落とす経路が開きます。</li></ul>
<p>現在の攻略記録を引き継ぎます。機体・武器・スキル・取得済み記録を維持します。</p>
