<h1>ARCLINE 0.25.0</h1>
<p>歩行・破壊・転移によって射点や弾道が変わるよう、19面の地形を調整しました。</p>
<ul><li>3・4・7・8・9・12・14・16・18・19・20・23・26・27・28・29面の射点と経路を見直しました。</li><li>敵の上にある屋根の余裕を広げ、16面は降りた後に岩肩越しの曲射と中腹への転移を選べるようにしました。</li><li>58・64・92面は開口や着地面を広げました。</li><li>8面の案内を、庇の下面を使う反射に合わせました。</li></ul>
<p>現在の攻略記録を引き継ぎます。機体・武器・スキル・取得済み記録を維持します。</p>
