<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCLINE 0.30.0</title><style>body{margin:40px auto;max-width:760px;padding:0 20px;background:#f5f2e9;color:#183b49;font:17px/1.8 system-ui}a{color:inherit}</style><main><a href="../../">ARCLINEへ</a><h1>HPと行動上限を調整</h1><p>通常面はテーマごとに行動上限を統一。後半の移動や準備に使える手数を増やしました。</p><p>イージーは敵の耐久を下げ、途中で敵HPが下がらない配分に。ノーマルとハードは共通の耐久です。</p><p>最終戦は各機体HP100、担当150ダメージ、20行動。イージーは担当80ダメージです。機体ごとの再挑戦を引き続き利用できます。</p><p><a href="../../game/dist/?v=0.30.0">ゲームを開く</a></p></main></html>
