<h1>ARCLINE 0.28.1</h1><p>iPhoneで下部の操作・メニューが画面の安全領域まで広がる問題を修正しました。</p>
<ul><li>ノッチとホームインジケーターを避けた範囲に、下部の操作を中央寄せします。</li><li>武器だけの状態でも、ボタンを横幅いっぱいに引き伸ばさないようにしました。</li><li>移動・斜角・発射のボタンサイズと、チャージゲージの表示・操作は維持します。</li></ul>
<p>現在の攻略記録を引き継ぎます。HP割合・必殺技残数の引き継ぎ、チャージ操作、戦闘の性能・進行と既存の保存データを維持します。</p>
