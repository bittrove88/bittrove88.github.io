<p>鏡の岸壁、結晶平原、空中庭園。20のテーマに、それぞれの色と風景を描きました。</p>
<ul>
<li>6〜10面「鏡の岸壁」を含む各テーマの背景を更新。土地ごとに岩や建物、植物、空の表情が変わります。</li>
<li>10〜90面の大ボスには、その土地の雰囲気を受け継いだ、少し緊張感のある専用背景を追加しました。</li>
<li>最終戦では、移動に合わせて4つの特別な背景が切り替わります。</li>
</ul>
