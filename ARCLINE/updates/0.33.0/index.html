<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCLINE 0.33.0</title><style>body{margin:0;background:#173b49;color:#ecf2df;font:16px/1.8 system-ui}main{max-width:700px;margin:10vh auto;padding:24px}a{color:#d8efad}</style><main><h1>ARCLINE 0.33.0</h1><ul><li>敵の歩行と転移で、機体約6体分の間合いを保つようにしました。こちらから近づいた場合は、敵がさらに距離を詰めず退避を優先します。</li><li>攻撃しやすさと被弾しにくさを比べ、後半ほど有利な位置を選びます。転移では地形で直射を遮れる場所を優先します。</li><li>通常敵の積極移動は41面から。既存の解禁面、転移回数、装甲・残像・チュートリアルを保持しています。</li></ul><p><a href="../../game/dist/">ゲームへ</a> · <a href="../../">ARCLINE</a></p></main></html>
