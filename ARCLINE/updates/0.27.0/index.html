<h1>ARCLINE 0.27.0</h1>
<p>マップごとに、狙う方向と移動する理由を見直しました。</p>
<ul><li>31面の結晶を岩肩から離して見つけやすくし、坑道では歩行・破壊・反射の役割を分けました。</li><li>後半は、根の内側、水平な岸、船内、高い荷台、整備口で開始位置と射点を変えています。</li><li>97面は機構に合う射点、98面は橋の姿勢に応じた固定の着地先を選べます。</li><li>100面の4戦場を、盆地・分断回廊・縦穴・斜めの裂け目へ整理しました。固定10機の順序と各機の条件は引き継ぎます。</li></ul>
<p>現在の攻略記録を引き継ぎます。機体・武器・スキル・取得済み記録を維持します。</p>
