lor:#fff9e6;border-radius:6px;text-decoration:none;font-weight:700}.back{font-size:14px}@media(max-width:600px){.wrap{padding-top:18px}header{gap:10px}.brand{font-size:23px}nav{gap:14px;font-size:12px}.eyebrow{margin-top:26px;font-size:10px;letter-spacing:2px}.lead{font-size:14px}.toolbar{align-items:flex-start}.downloads{gap:18px}.player{border-radius:7px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<body><main class="wrap">
<header><a class="brand" href="../">ARCLINE</a><nav aria-label="ARCLINE内のページ"><a href="../">公式サイト</a><a href="../game/dist/">ゲームを遊ぶ</a></nav></header>

<h1>その一発で、<br>道をひらけ。</h1>
<p class="lead">角度と力を合わせて、一射。<br>遮蔽を壊し、射つ場所を変える。実際の一射から、ARCLINEの遊びを紹介します。</p>
<div class="player"><video id="movie" controls playsinline preload="metadata" poster="media/poster.jpg" width="1280" height="720" aria-label="ARCLINE プレイムービー、30秒"><source src="media/arcline-play-30-ja-720p.mp4" type="video/mp4"><p>動画を再生できない場合は<a href="media/arcline-play-30-ja-720p.mp4">MP4を直接開いてください</a>。</p></video></div>

</main><script>

'use strict';
const movie=document.getElementById('movie'),quality=document.getElementById('quality'),status=document.getElementById('status'),length=document.getElementById('length'),language=document.getElementById('language');let serial=0;
function source(resolution=quality.value){return 'media/arcline-play-'+length.value+'-'+language.value+'-'+resolution+'p.mp4';}
function links(){for(const [i,a] of [...document.querySelectorAll('a[download]')].entries())a.href=source(i===0?'720':'1080');movie.setAttribute('aria-label','ARCLINE プレイムービー、'+length.value+'秒');document.querySelector('.eyebrow').textContent='PLAY MOVIE / 00:'+length.value;}
function change(keepPosition){const token=++serial,position=keepPosition?movie.currentTime||0:0,playing=keepPosition&&!movie.paused;status.hidden=true;movie.pause();movie.src=source();links();movie.addEventListener('loadedmetadata',async()=>{if(token!==serial)return;movie.currentTime=Math.min(position,Math.max(0,movie.duration-.05));if(playing)try{await movie.play();}catch{status.textContent='再生ボタンを押して続きをご覧ください。';status.hidden=false;}},{once:true});movie.load();}
quality.addEventListener('change',()=>change(true));language.addEventListener('change',()=>change(true));length.addEventListener('change',()=>change(false));
function showError(){status.replaceChildren(document.createTextNode('動画を読み込めませんでした。'));const link=document.createElement('a');link.href=source();link.textContent='MP4を直接開く';status.append(link);status.hidden=false;}
movie.addEventListener('error',showError);movie.querySelector('source').addEventListener('error',showError);links();
</script></body></html>
