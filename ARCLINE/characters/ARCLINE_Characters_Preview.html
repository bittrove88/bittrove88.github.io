l."},"visual":"","scene":"E01","leadIn":0.9,"hold":3.2,"subtitleCues":[{"sceneId":"E01","shotId":"E01-01","textKey":"e01.waiting","text":{"ja":"アークハートは、長い間、十機の帰還の返事を待ち続けていた。","en":"Archeart has waited a long time for the ten machines to report their return."},"title":{"ja":"待ち続けた中枢","en":"The waiting core"},"startAfterMs":600,"minHoldMs":3000,"emphasis":"narration","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"},{"sceneId":"E01","shotId":"E01-02","textKey":"e01.connection","text":{"ja":"安全の知らせも、帰還の返事も届かなかった。ユイは中枢の古い端子へ、直接つなぐ。","en":"Neither safety reports nor return messages arrived. Yui connects directly to the core’s old terminal."},"title":{"ja":"届かなかった、その後","en":"The messages that followed"},"startAfterMs":600,"minHoldMs":3000,"emphasis":"narration","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"},{"sceneId":"E01","shotId":"E01-03","textKey":"e01.sender","text":{"ja":"封蝋と、胸部の同じ紋章。あの便りの差出人は、アークハートだった。","en":"The same emblem on the wax seal and the chest. The letter came from Archeart."},"title":{"ja":"便りの差出人","en":"The sender of the letter"},"startAfterMs":600,"minHoldMs":3600,"emphasis":"revelation","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"}]},{"id":"E02","title":{"ja":"全機、帰投確認","en":"All units home"},"text":{"ja":"一機ずつ帰還が記録される。十機目の灯りがともると、アークハートは小さく「おかえり」と返した。ガンは答える。「ただいま。遅くなって、ごめんね。」","en":"Each return is registered. As the tenth light comes on, Archeart softly says: Welcome home. Gun replies: We are home. Sorry we took so long."},"visual":"","scene":"E02","leadIn":0.9,"hold":3.2,"subtitleCues":[{"sceneId":"E02","shotId":"E02-01","textKey":"e02.register","text":{"ja":"一機ずつ、帰還が記録される。","en":"One by one, their returns are registered."},"title":{"ja":"帰還の灯り","en":"Lights of return"},"startAfterMs":600,"minHoldMs":2200,"emphasis":"narration","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"},{"sceneId":"E02","shotId":"E02-02","textKey":"e02.welcome","text":{"ja":"「おかえり」","en":"“Welcome home.”"},"title":{"ja":"帰ってきた十機","en":"The ten who returned"},"startAfterMs":700,"minHoldMs":3000,"emphasis":"greeting","pauseCamera":true,"pauseEffects":true,"skippable":true,"mode":"full"},{"sceneId":"E02","shotId":"E02-03","textKey":"e02.reply","text":{"ja":"「ただいま。遅くなって、ごめんね。」","en":"“We are home. Sorry we took so long.”"},"title":{"ja":"ただいま","en":"We are home"},"startAfterMs":2200,"minHoldMs":2800,"emphasis":"reply","pauseCamera":true,"pauseEffects":true,"skippable":true,"mode":"full"}]},{"id":"E03","title":{"ja":"心臓の休息","en":"The heart rests"},"text":{"ja":"10機が集めた安全記録を受け取り、アークハートは停止の権限を各地へ返した。「道が、開いたね。」古い中枢の灯りは静かに落ち、世界中の橋と昇降機が動き始める。","en":"Receiving the safety records, Archeart returns stop authority to each region. The road has opened, it says. The old core quietly dims as bridges and lifts move around the world."},"visual":"","scene":"E03","leadIn":0.9,"hold":3.2,"subtitleCues":[{"sceneId":"E03","shotId":"E03-01","textKey":"e03.rest","text":{"ja":"安全記録と帰還を受け取り、アークハートは停止の権限を各地へ返す。「道が、開いたね。」古い中枢は静かに休止した。","en":"With the safety records and returns received, Archeart gives stop authority back to each region. “The road has opened.” The old core quietly rests."},"title":{"ja":"役目を終えた光","en":"A light at rest"},"startAfterMs":1100,"minHoldMs":3200,"emphasis":"narration","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"},{"sceneId":"E03","shotId":"E03-02","textKey":"e03.restart","text":{"ja":"橋と昇降機が動き始める。荷が届き、暮らしの灯りが戻ってくる。","en":"Bridges and lifts begin to move. Cargo arrives, and the lights of everyday life return."},"title":{"ja":"世界が、また動く","en":"The world moves again"},"startAfterMs":600,"minHoldMs":3000,"emphasis":"narration","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"}]},{"id":"E04","title":{"ja":"次の旅人へ","en":"For the next traveller"},"text":{"ja":"ガンは古い便りの裏に、つながった橋と十の灯りを描いた。そして、小さく書き添えた。「ただいま。今度は、ぼくらが道をつくるよ。」十機はそれぞれの仕事へ戻っていく。その道を、新しい旅人が走り出した。","en":"Gun draws a connected bridge and ten lights on the back of the old letter. Then Gun adds a small note: “We are home. This time, we will build the roads.” The ten machines return to their own work. Along that road, a new traveller sets out."},"visual":"","scene":"E04","leadIn":0.9,"hold":3.2,"subtitleCues":[{"sceneId":"E04","shotId":"E04-01","textKey":"e04.drawing","text":{"ja":"ガンは古い便りの裏に、つながった橋と十の灯りを描いた。","en":"Gun draws a connected bridge and ten lights on the back of the old letter."},"title":{"ja":"便りの、その裏に","en":"On the other side"},"startAfterMs":600,"minHoldMs":2000,"emphasis":"narration","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"},{"sceneId":"E04","shotId":"E04-01","textKey":"e04.words","text":{"ja":"そして、小さく書き添えた。「ただいま。今度は、ぼくらが道をつくるよ。」","en":"Then Gun adds a small note: “We are home. This time, we will build the roads.”"},"title":{"ja":"便りの、その裏に","en":"On the other side"},"startAfterMs":6500,"minHoldMs":3000,"emphasis":"promise","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"},{"sceneId":"E04","shotId":"E04-02","textKey":"e04.work","text":{"ja":"十機はそれぞれの仕事へ戻っていく。","en":"The ten machines return to their own work."},"title":{"ja":"明日も、ここで","en":"Work for tomorrow"},"startAfterMs":600,"minHoldMs":3000,"emphasis":"narration","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"},{"sceneId":"E04","shotId":"E04-03","textKey":"e04.future","text":{"ja":"その道を、新しい旅人が走り出した。","en":"Along that road, a new traveller sets out."},"title":{"ja":"その先へ続く道","en":"The road ahead"},"startAfterMs":1000,"minHoldMs":4000,"emphasis":"narration","pauseCamera":false,"pauseEffects":false,"skippable":true,"mode":"type"}]}],"lines":[{"ja":"古い便りの差出人は、アークラインの心臓「アークハート」だった。大分断の日、10機を送り出し、長い間、帰還の返事を待ち続けていた。ユイは中枢の古い端子へ直接つなぐ。","en":"The old letter came from Archeart, the heart of ARCLINE. It sent the ten machines out on the day of the Divide and has waited for their return ever since. Yui connects directly to its old terminal."},{"ja":"一機ずつ帰還が記録される。十機目の灯りがともると、アークハートは小さく「おかえり」と返した。ガンは答える。「ただいま。遅くなって、ごめんね。」","en":"Each return is registered. As the tenth light comes on, Archeart softly says: Welcome home. Gun replies: We are home. Sorry we took so long."},{"ja":"10機が集めた安全記録を受け取り、アークハートは停止の権限を各地へ返した。「道が、開いたね。」古い中枢の灯りは静かに落ち、世界中の橋と昇降機が動き始める。","en":"Receiving the safety records, Archeart returns stop authority to each region. The road has opened, it says. The old core quietly dims as bridges and lifts move around the world."},{"ja":"ガンは古い便りの裏に、つながった橋と十の灯りを描いた。そして、小さく書き添えた。「ただいま。今度は、ぼくらが道をつくるよ。」十機はそれぞれの仕事へ戻っていく。その道を、新しい旅人が走り出した。","en":"Gun draws a connected bridge and ten lights on the back of the old letter. Then Gun adds a small note: “We are home. This time, we will build the roads.” The ten machines return to their own work. Along that road, a new traveller sets out."}]},"chapters":[{"id":1,"start":1,"end":10,"focus":"gun","character":"gun","title":{"ja":"港の便り","en":"The port letter"},"journalTitle":{"ja":"入江から、最初の便り","en":"A letter from the shore"},"opening":{"ja":"止まった港を動かそう。最初の一歩だ。","en":"Let us restart the harbour. One first step."},"journalOpening":{"ja":"港には荷が届かない。便りを拾ったガンは作業路を直し、花の路線印を直すハナと出会う。港が再開すると、コロが次の町への便を申し出る。","en":"No cargo reaches the harbour. Gun meets Hana restoring a flower route mark. Once the port opens, Koro offers a delivery to the next town."},"question":{"ja":"道を動かすことは、なぜ妨げられるのか。","en":"Why is our work to reopen the road being stopped?"},"reflection":{"ja":"小さな港に荷が届いた。アークラインは、もう一度動かせる。","en":"Cargo reaches the small harbour. ARCLINE can move again."},"themes":"はじまりの入江 → 鏡の岸壁","clue":"路線印","payoff":"港で便りの路線印が確認でき、出会った仲間たちとその先の輸送路をたどる。","themesEn":"Starting Inlet → Mirror Quay"},{"id":2,"start":11,"end":20,"focus":"koro","character":"koro","title":{"ja":"閉ざした門","en":"The sealed gate"},"journalTitle":{"ja":"門の向こうの仕事","en":"Work beyond the gate"},"opening":{"ja":"進むために、帰りの橋も残そう。","en":"Keep a bridge home as we move forward."},"journalOpening":{"ja":"コロの便を通す橋で、バンは壊した足場を支え直していた。帰り道を残して門を開くと、ソラが消えた空の誘導灯を示す。","en":"At the bridge, Ban is rebuilding a platform it once broke. An open gate and a preserved way home lead to Sora’s missing skyway lights."},"question":{"ja":"開けた道を、あとから来る者も通れるか。","en":"Can those coming later use the road we open?"},"reflection":{"ja":"橋の向こうから初めて輸送車が来た。帰り道まで残してこそ、開通だ。","en":"A cargo vehicle arrives from across the bridge. A road is open only when the way home remains."},"themes":"吊り橋の水路 → 遺跡の入口","clue":"補修図の裏道","payoff":"帰路を含めた補修計画を完成させ、門を開く。","themesEn":"Suspended Waterway → Ruin Entrance"},{"id":3,"start":21,"end":30,"focus":"sora","character":"sora","title":{"ja":"消えた返事","en":"The missing reply"},"journalTitle":{"ja":"霧の向こうの返事","en":"An answer beyond the mist"},"opening":{"ja":"返事のない空へ、こちらから呼びかけよう。","en":"Send our call toward the silent sky."},"journalOpening":{"ja":"ソラは地上から空の灯りをつなぐ。霧の信号機で出会うヒバリは、聞こえない町を無人と決めない。返事が戻ると、リコが次の経路を記した地図を開く。","en":"Sora links sky lights from the ground. Hibari listens beyond the mist. When a town replies, Rico unfolds a map of the roads ahead."},"question":{"ja":"返事がない場所には、本当に誰もいないのか。","en":"Does no reply really mean nobody is there?"},"reflection":{"ja":"無人と記された高地に灯りが戻った。途切れたのは、暮らしではなく声だった。","en":"Lights return to the highland town. It was the voices, not everyday life, that had been lost."},"themes":"霧の谷 → 雲の空港","clue":"返事のない呼出し","payoff":"呼出しの送り先を直すと、町が応答した。","themesEn":"Misty Valley → Cloud Airport"},{"id":4,"start":31,"end":40,"focus":"rico","character":"rico","title":{"ja":"重なった色","en":"Overlapping colours"},"journalTitle":{"ja":"色の違う道標","en":"Signposts of different colours"},"opening":{"ja":"道標に残った、違う色の意味を探そう。","en":"Find what the different colours are telling us."},"journalOpening":{"ja":"リコの地図は失敗も残す。鏡と道標を確かめ、違う工房の色を消さずに道を開く。その下を支える坑道を確かめるため、モグが加わる。","en":"Rico’s map includes its failed routes. The party restores differently coloured signposts. Mogu joins to check the tunnels supporting them."},"question":{"ja":"同じ色でないものは、間違いなのか。","en":"Is a different colour a mistake?"},"reflection":{"ja":"複数の工房の光がつながり、山越えの道が戻った。違う色があるから、道は続く。","en":"The workshops reconnect the mountain road. Their different colours keep it going."},"themes":"水晶の反射路 → プリズム城壁","clue":"重なった色","payoff":"規格違反だと思われた複数の色が安全な道を示していた。","themesEn":"Crystal Road → Prism Wall"},{"id":5,"start":41,"end":50,"focus":"mogu","character":"mogu","title":{"ja":"掘らない線","en":"The line left undug"},"journalTitle":{"ja":"残すために掘る","en":"Digging to preserve"},"opening":{"ja":"近道だけじゃない。残すべきものを探そう。","en":"Find what to preserve as well as where to dig."},"journalOpening":{"ja":"モグは掘る距離ではなく、残せた仕事を見る。止まった坑道にも生きた通気路がある。壊す順番と残す支えを仲間で選ぶ。","en":"Mogu learns to count preserved work, not just metres excavated. Together they choose which supports to leave standing."},"question":{"ja":"道を開く力で、何を壊さずに残せるか。","en":"What can the power to open roads leave standing?"},"reflection":{"ja":"旧工房に風が戻った。壊さないと決めた一本も、新しい道の一部になった。","en":"Air returns to the workshop. One line left undug becomes part of the new road."},"themes":"上昇の坑道 → 琥珀の機関","clue":"更新された通気図","payoff":"一本だけ更新された線は、今も稼働している工房の命綱だった。","themesEn":"Rising Mine → Amber Engine"},{"id":6,"start":51,"end":60,"focus":"hibari","character":"hibari","title":{"ja":"不確かな予報","en":"The uncertain forecast"},"journalTitle":{"ja":"不確かな風へ","en":"Into uncertain winds"},"opening":{"ja":"確かじゃなくても、伝えられることがある。","en":"Even without certainty, there is something to share."},"journalOpening":{"ja":"観測台には送られなかった予報が残る。ヒバリは確かさも迷いも聞き取り、リンへ知らせる。不完全な迂回路が役立ち、リンは予報を抱えて旅へ加わる。","en":"Hibari carries both observations and uncertainty to Rin. An imperfect detour helps, and Rin joins to share useful forecasts."},"question":{"ja":"完全に分かるまで、黙っているべきか。","en":"Must we stay silent until everything is certain?"},"reflection":{"ja":"「分からない」を添えた案内が、新しい通行を生んだ。完璧でなくても届く情報がある。","en":"Guidance that admits uncertainty creates a way through. Useful information need not be perfect."},"themes":"風の観測台 → 凍てつく峡谷","clue":"未送信の迂回路","payoff":"送れなかった情報は、安全な選択肢を含んでいた。","themesEn":"Weather Station → Frozen Canyon"},{"id":7,"start":61,"end":70,"focus":"rin","character":"rin","title":{"ja":"全車到着","en":"Everyone arrives"},"journalTitle":{"ja":"みんなで到着","en":"Everyone arrives"},"opening":{"ja":"一番乗りじゃなく、最後尾まで運ぼう。","en":"Bring the last vehicle through, not just the first."},"journalOpening":{"ja":"リンの精密弾で遮蔽を開き、一行は火山の炉へ。最後尾を待つ車列をコロが確かめる。古い帰還表には、まだ誰のものとも知れない十の空欄がある。","en":"Rin opens long firing lanes. At the furnace, Koro counts the convoy’s last vehicle. An old register holds ten empty entries."},"question":{"ja":"速く着いた一機だけで、輸送は終わりなのか。","en":"Is transport finished when the fastest vehicle arrives?"},"reflection":{"ja":"すべての車両の到着が確かめられ、炉が静かに温度を落とした。","en":"Every vehicle is counted. The furnace finally lowers its temperature."},"themes":"火山の外縁 → 鍛冶の回廊","clue":"最後尾の記録と十の空欄","payoff":"今の車列は全車到着。しかし大分断の日の古い未帰還記録は残る。","themesEn":"Volcanic Rim → Forge Passage"},{"id":8,"start":71,"end":80,"focus":"koro","character":"koro","title":{"ja":"停止信号の記憶","en":"The all-stop memory"},"journalTitle":{"ja":"つなぐ手、離す手","en":"Holding on, letting go"},"opening":{"ja":"あの日の停止信号には、続きがあった。","en":"There was more after that stop signal."},"journalOpening":{"ja":"コロたちは鉱石に残された信号の続きを運ぶ。ユイが伝えた停止のあと、安全を知らせる返事が出ていた。届かなかった往復をつなぐため、ユイが旅へ加わる。","en":"Koro carries recovered signals. Safety replies followed the stop Yui once relayed. Yui joins to restore that broken two-way link."},"question":{"ja":"止めたことと、止まり続けたことは同じか。","en":"Are stopping once and remaining stopped the same thing?"},"reflection":{"ja":"止めて救えた命がある。戻せなかったのは、各地からの返事だった。","en":"The stop saved lives. It was the replies that could not return."},"themes":"磁石の採掘場 → 極性の実験棟","clue":"停止信号の続き","payoff":"停止が必要だったこと、応答経路が途切れたことを確認。中央からの現行命令ではない。","themesEn":"Magnetic Mine → Polarity Laboratory"},{"id":9,"start":81,"end":90,"focus":"yui","character":"yui","title":{"ja":"帰り道の灯り","en":"Lights for the way home"},"journalTitle":{"ja":"空へ送る帰り道","en":"Sending a way home into the sky"},"opening":{"ja":"空へ届く合図を、地上からつなごう。","en":"Link a signal to the sky from the ground."},"journalOpening":{"ja":"10機がそろった。ユイが地上の声を結び、ソラが空母への帰投灯をともす。積荷の記録は、古い帰還未確認の名を示す。","en":"All ten have come together. Yui links the ground while Sora lights the carrier’s return. Its cargo records name the unconfirmed returnees."},"question":{"ja":"遠くへ飛べなくても、帰り道を作れるか。","en":"Can we make a way home without flying far?"},"reflection":{"ja":"空母は帰ってきた。だが積荷の記録は、10機に思いがけない事実を告げた。","en":"The carrier returns. Its cargo record reveals something the ten machines never expected."},"themes":"空中庭園 → 嵐の空母","clue":"地上からの誘導線／未帰還10機","payoff":"地上の灯で空母が帰還。その貨物に、大分断当日の未帰還登録が残る。","themesEn":"Sky Garden → Storm Carrier"},{"id":10,"start":91,"end":100,"focus":"rico","character":"rico","title":{"ja":"次の旅人へ","en":"For the next traveller"},"journalTitle":{"ja":"また、道をつくる","en":"Building the road again"},"opening":{"ja":"帰還を伝えよう。もう誰も置いていかない。","en":"Report our return. Leave nobody waiting."},"journalOpening":{"ja":"大分断の日、10機は別々の復旧現場へ向かい、帰還を報告できなかった。リコは最後の便りが指す道を示す。今度は全員の返事を届ける。","en":"The ten went to separate repair sites on Divide day and could not report their return. Rico charts the letter’s last road. This time, every reply will arrive."},"question":{"ja":"危険を知ったうえで、道を自分たちで選べるか。","en":"Can we choose our own road with its risks in view?"},"reflection":{"ja":"十の「ただいま」が届いた。誰か一機が握るのではなく、みんなで道を動かしていく。","en":"Ten voices say we are home. Together, rather than under one machine, we will keep the roads moving."},"themes":"要塞の重層門 → 夜明けの核","clue":"便りの差出人／世界を止めた心臓","payoff":"差出人はアークハート。十の帰還が伝わり、旧停止機構の全線ロックが解除される。","themesEn":"Fortress Gates → Dawn Core"}],"guardians":[{"id":"midboss:harbor-knot","stage":5,"chapter":1,"kind":"midboss","name":{"ja":"ハーバー・ノット","en":"Harbor Knot"},"feature":{"ja":"巻上げドラムを狙うと攻撃が弱まる","en":"Break the winch drum to weaken attacks."},"entrance":{"ja":"接近を検知。係留域を確保する。","en":"Approach detected. Securing the mooring zone."},"aftermath":{"ja":"巻上げ機に、便りと同じ古い路線印が残っていた。","en":"The winch bears the same old route mark as the letter."},"response":{"ja":"「同じ印……この便りは、この道を通ってきたんだ。」","en":"“The same mark... This letter travelled along this road.”"},"clue":{"ja":"便りと同じ路線印","en":"The route mark"},"payoffStage":10,"work":{"ja":"係留・巻上げ","en":"Mooring and recovery"},"background":{"ja":"帰投確認が途切れた日から、空の係留索を巻き続けた。復旧作業の接近も危険と判定する。","en":"It has reeled in an empty mooring line since return confirmations stopped, classifying repair crews as a danger."},"relatedMachines":["gun"],"pairedGuardianStage":10,"stagingNote":"最初は正体不明の妨害。待っていた事情は旅の記録で読む。","focus":"gun"},{"id":"boss:tideclaw","stage":10,"chapter":1,"kind":"boss","name":{"ja":"タイドクロー","en":"Tideclaw"},"feature":{"ja":"爪と装甲を崩し、港への道を開く","en":"Break the claw and shell to open the harbour."},"entrance":{"ja":"再稼働を検知。水路を封鎖する。","en":"Restart detected. Sealing the waterway."},"aftermath":{"ja":"沈んだ荷を退け、港の運搬設備が再び動き出した。","en":"The lost cargo is cleared and the harbour conveyors move again."},"response":{"ja":"「動いた……！　次の町にも、荷を届けよう。」","en":"“It moved! Let us carry cargo to the next town.”"},"work":{"ja":"港の浚渫と護岸","en":"Harbour dredging and seawalls"},"background":{"ja":"沈んだ荷が再び流れ込むのを防ごうと、潮路を塞いだ。大分断当日の封鎖規則を保持している。","en":"It blocked the tidal route to stop lost cargo washing back in, preserving the closure rules from the Great Divide."},"relatedMachines":["gun"],"pairedGuardianStage":5,"stagingNote":"戦闘で防御機構を停止→安全確保→区間限定で再開。","focus":"gun"},{"id":"midboss:bridge-mender","stage":15,"chapter":2,"kind":"midboss","name":{"ja":"ブリッジ・メンダー","en":"Bridge Mender"},"feature":{"ja":"補修フレームを狙うと攻撃が弱まる","en":"Break the repair frame to weaken attacks."},"entrance":{"ja":"補修未完了。通行させない。","en":"Repairs incomplete. Passage denied."},"aftermath":{"ja":"古い補修図に、門の内側へ続く帰り道があった。","en":"An old repair plan shows a way home through the gate."},"response":{"ja":"「先に支えを直そう。帰りの便も、ここを通るんだ。」","en":"“Let us repair the supports first. The return delivery needs them too.”"},"clue":{"ja":"補修図の裏道","en":"The repair drawing"},"payoffStage":20,"work":{"ja":"橋の補修","en":"Bridge repair"},"background":{"ja":"崩落した橋を支えたまま、補修完了の記録を渡せずにいる。","en":"It holds a collapsed bridge in place but cannot deliver its repair-complete record."},"relatedMachines":["ban"],"pairedGuardianStage":20,"stagingNote":"","focus":"koro"},{"id":"boss:gatekeeper","stage":20,"chapter":2,"kind":"boss","name":{"ja":"ゲートキーパー","en":"Gatekeeper"},"feature":{"ja":"二つの砲を止めて門を開く","en":"Disable the two cannons to open the gate."},"entrance":{"ja":"構造確認、未完了。門は開かない。","en":"Structure unconfirmed. The gate stays closed."},"aftermath":{"ja":"補修図を使って橋を支え直すと、輸送門が開いた。","en":"Using the plan to brace the bridge opens the cargo gate."},"response":{"ja":"「橋を渡れた！　次は、空の灯りも運ぼう。」","en":"“Across the bridge! Let us carry the sky lights next.”"},"work":{"ja":"橋門の保存","en":"Bridge and gate preservation"},"background":{"ja":"崩れた橋への立ち入りを止めたまま、復旧後の状態を認識できない保存機。","en":"It still blocks the damaged bridge and cannot recognise its repaired condition."},"relatedMachines":["ban"],"pairedGuardianStage":15,"stagingNote":"橋の再開は補修確認が先。","focus":"koro"},{"id":"midboss:mist-bell","stage":25,"chapter":3,"kind":"midboss","name":{"ja":"ミスト・ベル","en":"Mist Bell"},"feature":{"ja":"送信ホーンを狙うと攻撃が弱まる","en":"Break the signal horn to weaken attacks."},"entrance":{"ja":"霧信号、送信中。応答、なし。","en":"Fog signal transmitting. No reply."},"aftermath":{"ja":"呼出しは止まっていない。受信側が違う空を向いていた。","en":"The call never stopped. Its receiver faced the wrong sky."},"response":{"ja":"「呼出しは続いていた。ヒバリ、今度はこっちから返そう。」","en":"“The call never stopped. Hibari, let us send an answer.”"},"clue":{"ja":"返事のない呼出し","en":"The unanswered call"},"payoffStage":30,"work":{"ja":"霧の航路案内","en":"Fog-route signals"},"background":{"ja":"誰にも届かない霧信号を、毎朝同じ時刻に送り続けた。","en":"It sends the same unheard fog signal every morning."},"relatedMachines":["hibari"],"pairedGuardianStage":30,"stagingNote":"","focus":"sora"},{"id":"boss:cloudray","stage":30,"chapter":3,"kind":"boss","name":{"ja":"クラウドレイ","en":"Cloudray"},"feature":{"ja":"翼を止めると雲の通り道が変わる","en":"Broken wings change the cloud route."},"entrance":{"ja":"誘導先、不明。進入を阻止する。","en":"Guidance destination unknown. Blocking entry."},"aftermath":{"ja":"呼出しと返事がつながり、無人とされた町に灯りがともった。","en":"Call and reply connect. A supposedly empty town lights up."},"response":{"ja":"「町の返事だ。リコの地図にも、この灯りを残そう。」","en":"“The town has answered. Let us mark its light on Rico’s map.”"},"work":{"ja":"空路のビーコン","en":"Airway beacon"},"background":{"ja":"応答を失った空路への進入を封じていた。霧の下の生活を確認できずにいる。","en":"It bars an unresponsive airway, unable to confirm the lives beneath the mist."},"relatedMachines":["hibari"],"pairedGuardianStage":25,"stagingNote":"","focus":"sora"},{"id":"midboss:reflect-ram","stage":35,"chapter":4,"kind":"midboss","name":{"ja":"リフレクト・ラム","en":"Reflect Ram"},"feature":{"ja":"反射フレームを狙うと攻撃が弱まる","en":"Break the reflector frame to weaken attacks."},"entrance":{"ja":"登録色と不一致。通行を止める。","en":"Registered colours do not match. Stopping passage."},"aftermath":{"ja":"色の違いは、いくつもの工房が残した補修の印だった。","en":"The different colours mark repairs made by several workshops."},"response":{"ja":"「重ねた色には、それぞれ理由があるんだね。」","en":"“Every colour they added had a reason.”"},"clue":{"ja":"重なった色","en":"The layered colours"},"payoffStage":40,"work":{"ja":"道標の検品","en":"Signpost inspection"},"background":{"ja":"反射板を一色にそろえる検品機。大分断後の応急補修を規格違反と判断する。","en":"It forces reflectors into one colour, rejecting emergency repairs made after the Divide."},"relatedMachines":["hana"],"pairedGuardianStage":40,"stagingNote":"","focus":"rico"},{"id":"boss:prism-guardian","stage":40,"chapter":4,"kind":"boss","name":{"ja":"プリズム・ガーディアン","en":"Prism Guardian"},"feature":{"ja":"鏡面の枠を壊して核を狙う","en":"Break the mirror rims to expose the core."},"entrance":{"ja":"規格外の光を検知。進入不可。","en":"Nonstandard light detected. Entry denied."},"aftermath":{"ja":"違う色の道標をつなぐと、途切れた反射路が開いた。","en":"Joining the differently coloured markers reopens the reflector road."},"response":{"ja":"「あなたの色も、残したまま直そう。」","en":"“Let us repair this, and keep your colour too.”"},"work":{"ja":"光学道標","en":"Optical route markers"},"background":{"ja":"光の道を旧規格だけで検査し、助け合いの記録を認識できない。","en":"It tests the light road by old standards and cannot read the record of shared work."} termath":{"ja":"未送信の予報に、危険を避ける迂回路があった。","en":"An unsent forecast includes a detour around the danger."},"response":{"ja":"「リンの予報は消さない。確かな範囲も、一緒に届ける。」","en":"“We will keep Rin’s forecast, and send how certain each part is.”"},"clue":{"ja":"未送信の迂回路","en":"The unsent detour"},"payoffStage":60,"work":{"ja":"風の観測","en":"Wind observation"},"background":{"ja":"確度の低い観測を送れず、使える迂回路まで隠した観測機。","en":"It cannot send uncertain readings, withholding useful detours with them."},"relatedMachines":["rin"],"pairedGuardianStage":60,"stagingNote":"","focus":"hibari"},{"id":"boss:whitehowl","stage":60,"chapter":6,"kind":"boss","name":{"ja":"ホワイトハウル","en":"Whitehowl"},"feature":{"ja":"送風機を止めると風が弱まる","en":"Disable the fans to weaken the wind."},"entrance":{"ja":"危険判定、未完了。通行停止。","en":"Danger assessment incomplete. Passage stopped."},"aftermath":{"ja":"予報の確度と迂回路を渡し、峡谷に通れる道が生まれた。","en":"Sharing forecast confidence and detours creates a way through the canyon."},"response":{"ja":"「役に立ったよ、リン。次の道も、一緒に確かめよう。」","en":"“It helped, Rin. Let us check the next road together.”"},"work":{"ja":"除雪と風の誘導","en":"Snow clearing and wind guidance"},"background":{"ja":"確実な予報がない限り全路線を閉じる除雪機。古い危険判定を保持する。","en":"It closes every route without a certain forecast, holding an old danger assessment."},"relatedMachines":["rin"],"pairedGuardianStage":55,"stagingNote":"","focus":"hibari"},{"id":"midboss:cinder-chef","stage":65,"chapter":7,"kind":"midboss","name":{"ja":"シンダー・シェフ","en":"Cinder Chef"},"feature":{"ja":"圧力バルブを狙うと攻撃が弱まる","en":"Break the pressure valve to weaken attacks."},"entrance":{"ja":"最後尾、未確認。保温を続ける。","en":"Last vehicle unconfirmed. Maintaining heat."},"aftermath":{"ja":"待機欄には時刻ではなく、車両の数が並んでいた。","en":"The waiting list counts vehicles instead of arrival times."},"response":{"ja":"「一番速いより、みんなが着く方が大事だ！」","en":"“Everyone arriving matters more than being fastest!”"},"clue":{"ja":"最後尾の記録","en":"The last convoy entry"},"payoffStage":70,"work":{"ja":"炉の保温と整備","en":"Furnace tending"},"background":{"ja":"寒い夜に帰る車列のため、ずっと炉を守り続けた。","en":"It has kept the furnace ready through long cold nights for a returning convoy."},"relatedMachines":["koro"],"pairedGuardianStage":70,"stagingNote":"","focus":"rin"},{"id":"boss:forge-titan","stage":70,"chapter":7,"kind":"boss","name":{"ja":"フォージ・タイタン","en":"Forge Titan"},"feature":{"ja":"腕を止め、加熱の予告を避ける","en":"Stop the arms and avoid the heat warning."},"entrance":{"ja":"車列の帰還、未確認。炉を維持する。","en":"Convoy return unconfirmed. Maintaining the furnace."},"aftermath":{"ja":"全車到着を確かめた。古い帰還表には十の空欄があった。","en":"The convoy is complete. An old return register contains ten empty entries."},"response":{"ja":"「十の空欄。誰かの帰りを、まだ待っているんだね。」","en":"“Ten empty entries. Someone is still waiting for them to return.”"},"work":{"ja":"幹線炉の維持","en":"Trunk-route furnace maintenance"},"background":{"ja":"後続を待ち続け炉を止められない。大分断の日の帰還表も保管していた。","en":"It cannot rest while waiting for the convoy, and preserves a register from the day of the Divide."},"relatedMachines":["koro"],"pairedGuardianStage":65,"stagingNote":"十の空欄は固有名を見せない。第9章で回収。","focus":"rin"},{"id":"midboss:ore-shepherd","stage":75,"chapter":8,"kind":"midboss","name":{"ja":"オア・シェパード","en":"Ore Shepherd"},"feature":{"ja":"マグネットアームを狙うと攻撃が弱まる","en":"Break the magnet arm to weaken attacks."},"entrance":{"ja":"回収指示を保持。記録は渡せない。","en":"Recovery order retained. Records cannot be released."},"aftermath":{"ja":"停止信号のすぐ後ろに、各地から短い返答があった。","en":"Short local replies follow immediately after the stop signal."},"response":{"ja":"「停止の後に、返事があった。ユイにも届けよう。」","en":"“There were replies after the stop. We must tell Yui.”"},"clue":{"ja":"停止信号の続き","en":"After the all-stop signal"},"payoffStage":80,"work":{"ja":"鉱石の回収と選別","en":"Ore recovery and sorting"},"background":{"ja":"荷を手放せないまま、回収した信号記録を保管していた。","en":"Unable to release recovered cargo, it also keeps signal records it collected."},"relatedMachines":["yui"],"pairedGuardianStage":80,"stagingNote":"","focus":"koro"},{"id":"boss:polaris-core","stage":80,"chapter":8,"kind":"boss","name":{"ja":"ポラリス・コア","en":"Polaris Core"},"feature":{"ja":"発生器を止めると磁場が弱まる","en":"Disable generators to weaken the field."},"entrance":{"ja":"停止状態を保持。応答、照合不能。","en":"Holding stopped state. Replies cannot be reconciled."},"aftermath":{"ja":"停止は届いていた。届かなかったのは、安全を告げる返事だ。","en":"The stop arrived. The replies confirming safety did not."},"response":{"ja":"「ユイのせいじゃない。届かなかった返事を、今度こそ運ぼう。」","en":"“It was not Yui’s fault. This time we will deliver those missing replies.”"},"work":{"ja":"極性研究と保全信号","en":"Polarity research and maintenance signals"},"background":{"ja":"停止記録と各地の応答を照合する研究核。断線により往復の照合を失った。","en":"It reconciles stop records and local replies, but a broken two-way link prevents matching them."},"relatedMachines":["yui"],"pairedGuardianStage":75,"stagingNote":"この章で「停止命令の記録が現場に残留する」仕組みを明かすが中枢の名前は出さない。","focus":"koro"},{"id":"midboss:bloom-tender","stage":85,"chapter":9,"kind":"midboss","name":{"ja":"ブルーム・テンダー","en":"Bloom Tender"},"feature":{"ja":"給水ユニットを狙うと攻撃が弱まる","en":"Break the watering unit to weaken attacks."},"entrance":{"ja":"給水継続。航路再開を待つ。","en":"Watering continues. Waiting for the airway."},"aftermath":{"ja":"庭園に、地上から空へ続く古い誘導線が残っていた。","en":"An old guidance line runs from the ground up to the garden."},"response":{"ja":"「ソラの灯りと、わたしの回線で。帰り道をつなごう。」","en":"“With Sora’s lights and my links, we can bring the way home together.”"},"clue":{"ja":"地上からの誘導線","en":"Guidance from the ground"},"payoffStage":90,"work":{"ja":"空中庭園の給水","en":"Sky-garden watering"},"background":{"ja":"航路が止まっても庭を守り、同じ時刻に遠い帰投灯を見上げ続けた。","en":"It protects the garden while the airway is stopped, watching for distant return lights at the same time each day."},"relatedMachines":["sora"],"pairedGuardianStage":90,"stagingNote":"","focus":"yui"},{"id":"boss:skycarrier","stage":90,"chapter":9,"kind":"boss","name":{"ja":"スカイキャリア","en":"Skycarrier"},"feature":{"ja":"砲と推進器を止め、空の航路を開く","en":"Stop cannons and thrusters to open the skyway."},"entrance":{"ja":"着陸灯、未確認。帰投を待つ。","en":"Landing lights unconfirmed. Waiting to return."},"aftermath":{"ja":"積荷の帰還未確認記録に、10機全員の名が並んでいた。","en":"The unconfirmed-return record lists all ten of their own names."},"response":{"ja":"「……帰還未確認の名は、わたしたち10機だった。」","en":"“The unconfirmed returnees... are all ten of us.”"},"work":{"ja":"空中貨物輸送","en":"Aerial cargo transport"},"background":{"ja":"帰投灯が見えないまま、古い積荷と帰還記録を抱えて待機した。","en":"It holds old cargo and return records while waiting for landing lights it cannot see."},"relatedMachines":["sora"],"pairedGuardianStage":85,"stagingNote":"核心の一段目。本文は簡潔に、詳細は章の記録に。","focus":"yui"},{"id":"midboss:line-warden","stage":95,"chapter":10,"kind":"midboss","name":{"ja":"ライン・ワーデン","en":"Line Warden"},"feature":{"ja":"シールドドライブを狙うと攻撃が弱まる","en":"Break the shield drive to weaken attacks."},"entrance":{"ja":"最終検査。通行記録、未照合。","en":"Final inspection. Passage records unmatched."},"aftermath":{"ja":"最深部からの便りの宛先は、帰還未確認の10機だった。","en":"The letter from the deepest station was addressed to the ten missing returnees."},"response":{"ja":"「……この便り、ぼくたちに届くはずだったんだ。」","en":"“This letter... It was meant to reach us.”"},"clue":{"ja":"便りの発送記録と宛先","en":"The dispatch record and the letter’s recipients"},"payoffStage":100,"work":{"ja":"通行記録と最終検査","en":"Passage records and final inspection"},"background":{"ja":"通行を許せない最終検査機。かつて中枢から送られた便りの発送履歴を保持する。","en":"It cannot allow passage, and keeps the dispatch history of a letter sent from the old core."},"relatedMachines":["rico"],"pairedGuardianStage":100,"stagingNote":"第二段の謎を回収。差出人名はまだ見せない。","focus":"rico"},{"id":"boss:archeart","stage":100,"chapter":10,"kind":"boss","name":{"ja":"アークハート","en":"Archeart"},"feature":{"ja":"外殻・内殻・核の3段階を突破","en":"Break outer shell, inner shell and core."},"entrance":{"ja":"再稼働を検知。危険区域への進入を阻止する。","en":"Restart detected. Blocking entry to the danger zone."},"aftermath":{"ja":"古い便りの差出人は、アークハートだった。十機の返事を、今度こそ直接届けよう。","en":"The old letter came from Archeart. This time, the ten can deliver their reply directly."},"response":{"ja":"「ユイ、つないで。みんなの返事を届けよう。」","en":"“Connect us, Yui. Let us deliver everyone’s reply.”"},"work":{"ja":"アークラインの保全中枢","en":"Trunk-network preservation"},"background":{"ja":"大分断当日に連鎖事故を防ぐため全路線を停止させた。双方向通信が失われ、安全の返事と10機の帰還を受け取れず、古い危険状態を守り続けた。","en":"It stopped all routes to prevent cascading accidents. Broken two-way links kept safety reports and the ten returns from reaching it."},"relatedMachines":["rico"],"pairedGuardianStage":95,"stagingNote":"ここで初めて「アークハート」を表示。3段階戦闘後に結果→エピローグ。","focus":"rico"}],"acts":[{"id":1,"start":1,"title":{"ja":"道を動かそう","en":"Let us move the roads"},"body":{"ja":"世界の暮らしを支えるアークラインは止まった。ガンと出会った仲間は港と橋の限定運行を再開する。だが、直した道を守り手が襲う。","en":"ARCLINE sustained everyday life, then stopped. Gun and new companions restore limited harbour and bridge operations, but guardians resist the repairs."}},{"id":2,"start":21,"title":{"ja":"守り手の理由","en":"Why the guardians wait"},"body":{"ja":"霧と光の道で、守り手は無秩序に暴れているのではないと知る。何かを守り、届かない返事を待っている。","en":"The mist and light roads reveal that the guardians are protecting something and waiting for replies."}},{"id":3,"start":41,"title":{"ja":"止まった日の記録","en":"Records of the stopped day"},"body":{"ja":"工房を支える風、送れなかった予報。壊れたのは道だけではなく、情報を届ける仕組みだった。","en":"Workshop air and unsent forecasts reveal that the information routes broke along with the roads."}},{"id":4,"start":61,"title":{"ja":"最後尾の空欄","en":"The last empty entries"},"body":{"ja":"十個の帰還空欄、停止の後に続く返事。緊急停止は正しかったが、解除に必要な知らせが届かなかった。","en":"Ten return entries remain blank. The emergency stop was right at the time, but the news needed to release it never arrived."},"revealAt":80,"publicBody":{"ja":"炉で待つ車列と、実験棟に残された記録をたどる。最後尾まで確かめ、止まった日の知らせをつなごう。","en":"Follow the waiting convoy and the records left at the laboratory. Check the last vehicle and reconnect the news of the day the world stopped."}},{"id":5,"start":81,"title":{"ja":"最後の返事","en":"The final reply"},"body":{"ja":"古い記録にある未帰還10機は自分たちだった。便りの宛先を確かめ、待つ相手へ、今度は全員の返事を届ける。","en":"The ten unreturned machines in the old records were the ten themselves. They follow the letter’s address to carry everyone’s reply to the one still waiting."},"revealAt":90,"publicBody":{"ja":"古い記録と帰り道の灯りをたどり、最後の返事を届ける。","en":"Follow old records and homeward lights to deliver the final reply."}}],"machines":[{"id":"gun","name":{"ja":"ガン","en":"GUN"},"chapter":1,"desire":{"ja":"港の作業路を直し、荷物が行き交う音を取り戻す。","en":"Gun wants to repair the port’s work roads and hear cargo moving again."},"past":{"ja":"大分断の夜、崩れる防波堤を装甲で支えた。以後、道を止めておくほうが安全だと信じた。自分の帰還も中枢へ報告できなかった。","en":"On the night of the Great Divide, Gun braced a failing seawall with its armour. Since then, keeping things still has felt safer. Its return report never reached the core."},"flaw":{"ja":"慎重すぎて、目の前の一歩を逃す。","en":"Kind and careful, Gun sometimes checks so long that the chance to move passes."},"choice":{"ja":"守るために前へ出て、支えを仲間と分ける。","en":"Gun moves forward to protect others, directing strength where it is needed and sharing the load."},"ending":{"ja":"新しい路線の補修班をつくり、仕事を一機で抱え込まない。","en":"Gun starts a road-repair team where no machine has to hold everything up alone."},"line":{"ja":"急がなくていい。ちゃんと、向こうへ行こう。","en":"No need to rush. Let us get there properly."},"publicPast":{"ja":"大分断の夜、崩れる防波堤を装甲で支えた。以後、道を止めておくほうが安全だと信じた。","en":"On the night of the Great Divide, Gun braced a failing seawall with its armour. Since then, keeping things still has felt safer."},"returnRevealAt":90,"joinStage":0,"growthStage":10},{"id":"ban","name":{"ja":"バン","en":"BAN"},"chapter":2,"desire":{"ja":"閉ざされた道を開き、役に立つ力を使う。","en":"Ban wants to open closed roads and put its strength to use for someone."},"past":{"ja":"大分断直後の救援で、障害物とともに修理用の足場まで壊した。自分の現場からは帰れたが、帰還報告は届かなかった。","en":"During a rescue, Ban destroyed a repair platform along with an obstruction. Jokes still cover the memory. Its return report never reached the core."},"flaw":{"ja":"明るい軽口で失敗を隠し、突破だけを急ぎがち。","en":"Bright and dependable, Ban can focus on the obstacle more than the people who must cross afterward."},"choice":{"ja":"先に支えを確かめ、帰りに通る者の道も残す。","en":"Ban checks the supports first, uses only the force needed, and stays to see whether others can pass."},"ending":{"ja":"先陣係から開通確認係へ。後続が通れるかを先に聞く。","en":"Ban becomes the one who checks the route, asking whether those behind can cross before racing ahead."},"line":{"ja":"道をあけるぞ。今度は、帰り道もな！","en":"I will clear the way. The way back too, this time!"},"publicPast":{"ja":"大分断直後の救援で、障害物とともに修理用の足場まで壊した。","en":"During a rescue, Ban destroyed a repair platform along with an obstruction. Jokes still cover the memory."},"returnRevealAt":90,"joinStage":15,"growthStage":20},{"id":"hibari","name":{"ja":"ヒバリ","en":"HIBARI"},"chapter":3,"desire":{"ja":"遠くから届く古い呼出信号の送り主を見つける。","en":"Hibari wants to find the sender of an old call arriving from far away."},"past":{"ja":"大分断のあいだも、無数の音を聞いてきた。返事のない呼出しにも応じ続けた。","en":"As an observation machine, Hibari has listened to countless sounds and answered calls even when no reply came."},"flaw":{"ja":"十分に調べれば答えは一つになると思いがち。","en":"Curious and considerate, Hibari sometimes expects enough information to produce one certain answer."},"choice":{"ja":"こちらの場所も知らせ、分からないところを確かめに行く。","en":"Hibari shares its own location as well as listening, leaving unknowns marked until they can be checked."},"ending":{"ja":"各地の声を結ぶ観測網をつくる。沈黙を不在と決めない。","en":"Hibari builds a listening network that never mistakes an unheard place for an empty one."},"line":{"ja":"聞こえたよ。今度は、こっちから届ける。","en":"I heard you. This time, I will send something back."},"joinStage":25,"growthStage":30,"joinLine":{"ja":"返事がなくても、誰もいないとは限らない。もう一度、呼んでみよう。","en":"No answer does not mean nobody is there. Let us call once more."}},{"id":"hana","name":{"ja":"ハナ","en":"HANA"},"chapter":1,"desire":{"ja":"道標を直し、後から来る誰かを迷わせない。","en":"Hana wants to repaint the signposts so the next traveller will not lose the way."},"past":{"ja":"工房の塗装と検品を担当。大分断後も返事のない土地へ花の印を送り続けた。","en":"Hana once painted and inspected workshop machines, then kept sending flower-marked signs to places that never replied."},"flaw":{"ja":"整った見た目を優先し、異なる事情を聞きそびれる。","en":"Gentle in speech and exacting at work, Hana c function showCharacter(){const previousHero=ArcCharacterHero.snapshot($('characterFeature'));const data=readViewerSave(),lang=english?'en':'ja';$('characterFeature').innerHTML=ArcCharacterHero.markup(id,{data,lang,assetBase:'../'});ArcCharacterHero.hydrate($('characterFeature'));ArcCharacterHero.crossfade($('characterFeature'),previousHero);$('viewerIntro').textContent=english?'Ten machines: their roles, wishes and your actual collection.':'10機の名前、役割、想い。ゲームの所有状況とともに。';$('labTitle').textContent=english?'Inspect the in-game movement':'ゲーム内の動きを確認';const commit=$('characterFeature').querySelector('[data-confirm-character]');if(commit)commit.onclick=async()=>{const store=ArcSave.create({load:()=>localStorage.getItem(ArcSave.key),save:value=>localStorage.setItem(ArcSave.key,value)});await store.load();if(!store.ready||!ArcCrew.owned(store.data,id)){showCharacter();return;}store.data.equippedCharacterId=id;const ok=await store.save();$('viewerCommitStatus').textContent=english?(ok?'Formation saved for the game.':'Could not save. Please retry.'):(ok?'ゲームで使う編成を保存しました。':'保存できませんでした。もう一度試してください。');if(ok)cards();};}
function cards(){const holder=$('cards'),data=readViewerSave(),lang=english?'en':'ja';holder.replaceChildren();for(const c of ArcCharacters.characters){const b=document.createElement('button');b.className='machine'+(c.id===id?' active':'');b.setAttribute('aria-pressed',String(c.id===id));b.dataset.machine=c.id;const name=document.createElement('strong');name.style.color=c.light;name.textContent=english?c.name:c.nameJa;const role=document.createElement('span');role.className='roster-role';role.textContent=english?c.role:c.roleJa;const status=document.createElement('span');status.className='viewer-state';const st=ArcCharacterHero.state(c.id,data,lang);status.textContent=(st.equipped?'✓ ':st.owned?'':'▣ ')+st.label;const canvas=document.createElement('canvas');canvas.setAttribute('role','img');canvas.setAttribute('aria-label',c.name);b.append(name,role,canvas,status);b.onclick=()=>{id=c.id;$('angle').value=id==='sora'?58:32;labels();cards();};holder.append(b);ArcCharacters.paint(canvas,c.id);}showCharacter();}

$('angle').oninput=labels;$('slope').oninput=labels;$('direction').onclick=()=>{dir*=-1};$('walking').onclick=()=>{walk=!walk;$('walking').setAttribute('aria-pressed',String(walk));$('walking').classList.toggle('active',walk);};$('fire').onclick=()=>{kick=.22};$('language').onclick=()=>{english=!english;labels();cards();};addEventListener('storage',e=>{if(e.key===ArcSave.key)cards();});
function frame(t){const dt=previous?Math.min(.05,(t-previous)/1000):0;previous=t;ArcCharacterHero.updateAll(dt,$('characterFeature'));if(walk)travel+=dt*70;kick=Math.max(0,kick-dt);if($('hero').getClientRects().length)ArcCharacters.paint($('hero'),id,{angle:+$('angle').value,dir,slope:+$('slope').value*Math.PI/180,travel,kick:kick?Math.sin(kick/.22*Math.PI)*3:0});requestAnimationFrame(frame);}
addEventListener('resize',cards);try{id=readViewerSave().equippedCharacterId||'gun';}catch{}labels();cards();requestAnimationFrame(frame);
</script><script>
const viewerLinks=document.querySelectorAll('.viewer-nav a');
function syncViewerNavigation(){const en=document.getElementById('language').textContent==='日本語';const ja=['← ARCLINE 紹介サイト','ゲームで遊ぶ ↗','HTMLをダウンロード ↓'],eng=['← About ARCLINE','Play the game ↗','Download HTML ↓'];viewerLinks.forEach((a,i)=>a.textContent=(en?eng:ja)[i]);document.querySelector('.image-download').textContent=en?'Download all 10 as an image ↓':'10機の画像をダウンロード ↓';document.documentElement.lang=en?'en':'ja';try{localStorage.setItem('arcline-language',en?'en':'ja');}catch{}}
try{if(localStorage.getItem('arcline-language')==='en')document.getElementById('language').click();}catch{}
document.getElementById('language').addEventListener('click',syncViewerNavigation);syncViewerNavigation();
</script></html>
