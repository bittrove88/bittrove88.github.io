<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCLINE — 10機のキャラ確認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#12384c;color:#eef3db;font:15px/1.6 system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #bad7c544;padding-bottom:20px}h1{font-size:30px;letter-spacing:3px;margin:0}header p{color:#bbd0c5;margin:4px 0}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#224c5c;border:1px solid #a6c8b765;border-radius:7px;min-height:44px;padding:7px 16px}button.active{border-color:#e4f8bf;background:#3b6063}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:24px 0}.machine{text-align:left;padding:14px}.machine strong{font-size:20px}.machine small{display:block;color:#c8d8c9;font-size:11px}.machine canvas{display:block;width:100%;height:126px}.stage{background:#1b4556;border:1px solid #abcbb844;border-radius:10px;padding:20px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px}.hero{width:100%;height:300px}.detail h2{font-size:32px;margin:0}.detail p{color:#d3dfc8;margin:5px 0}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}.controls label{display:flex;align-items:center;gap:9px}.controls input{width:160px;accent-color:#c7e7a4}.note{margin:22px 0 0;font-size:12px;color:#b5cfc3}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.machine canvas{height:110px}}@media(max-width:600px){main{padding:16px}header{display:block}h1{font-size:25px}header .row{margin-top:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.machine{padding:10px}.machine canvas{height:95px}.stage{grid-template-columns:1fr;padding:14px}.hero{height:230px}.detail h2{font-size:27px}.detail p{font-size:13px}.controls{gap:8px}.controls input{width:120px}}
.viewer-nav{display:flex;gap:12px 22px;align-items:center;flex-wrap:wrap;margin-bottom:23px;font-size:12px;color:#c5dbca}.viewer-nav a{color:inherit;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;border-bottom:1px solid #c5dbca55}.viewer-nav a:last-child{margin-left:auto}.image-download{display:inline-flex;min-height:44px;align-items:center;color:#dbe6c9;text-underline-offset:5px}.viewer-nav a:focus-visible{outline:2px solid #f0cb7d;outline-offset:5px}@media(max-width:600px){.viewer-nav{gap:3px 20px;font-size:11px}.viewer-nav a:last-child{margin-left:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style><main><nav class="viewer-nav" aria-label="ARCLINEのページ"><a href="../">← ARCLINE 紹介サイト</a><a href="../game/dist/?v=0.11.0">ゲームで遊ぶ ↗</a><a href="ARCLINE_Characters_Preview.html" download="ARCLINE_Characters_Preview.html">HTMLをダウンロード ↓</a></nav><header><div><h1>ARCLINE / MACHINES</h1><p>光沢を抑えた、10機のコード描画。</p></div><div class="row"><button id="language">English</button></div></header><div id="cards" class="grid"></div><section class="stage"><canvas class="hero" id="hero" role="img" aria-label="選択した機体"></canvas><div class="detail"><h2 id="name"></h2><p id="role"></p><p id="motto"></p><div class="controls"><label><span id="angleLabel">照準</span><input id="angle" type="range" min="-12" max="85" value="32"><output id="degrees">32°</output></label><label><span id="slopeLabel">傾斜</span><input id="slope" type="range" min="-25" max="25" value="0"></label><button id="direction">向き反転</button><button id="walking" aria-pressed="false">走行</button><button id="fire">発射動作</button></div></div></section><p class="note" id="note">ゲーム内と同じCanvas 2Dのコードで描画しています。このページは外観の確認用です。武器・耐久の違いはゲームの機体選択で確認できます。</p><p class="note"><a class="image-download" href="ARCLINE_Characters_Preview.png" download="ARCLINE_Characters_Preview.png">10機の画像をダウンロード ↓</a></p></main><script src="../game/dist/visual-style.js?v=0.11.0"></script><script src="../game/dist/characters.js?v=0.11.0"></script><script>
let id='gun',dir=1,walk=false,travel=0,kick=0,previous=0,english=false;
const $=x=>document.getElementById(x);
function labels(){const c=ArcCharacters.get(id);$('name').textContent=english?c.name:c.nameJa;$('role').textContent=english?c.role:c.roleJa;$('motto').textContent=english?c.motto:c.mottoJa;$('degrees').value=$('angle').value+'°';$('language').textContent=english?'日本語':'English';$('angleLabel').textContent=english?'Aim':'照準';$('slopeLabel').textContent=english?'Slope':'傾斜';$('direction').textContent=english?'Flip':'向き反転';$('walking').textContent=english?'Move':'走行';$('fire').textContent=english?'Recoil':'発射動作';$('note').textContent=english?'The same Canvas 2D code draws these machines in the game. This page previews appearance; see machine selection in the game for weapons and durability.':'ゲーム内と同じCanvas 2Dのコードで描画しています。このページは外観の確認用です。武器・耐久の違いはゲームの機体選択で確認できます。';}
function cards(){const root=$('cards');root.replaceChildren();for(const c of ArcCharacters.characters){const b=document.createElement('button');b.className='machine'+(c.id===id?' active':'');b.setAttribute('aria-pressed',String(c.id===id));const name=document.createElement('strong');name.style.color=c.light;name.textContent=english?c.name:c.nameJa;const role=document.createElement('small');role.textContent=english?c.role:c.roleJa;const canvas=document.createElement('canvas');canvas.setAttribute('role','img');canvas.setAttribute('aria-label',c.name);b.append(name,role,canvas);b.onclick=()=>{id=c.id;$('angle').value=id==='sora'?58:32;labels();cards();};root.append(b);ArcCharacters.paint(canvas,c.id);}}
$('angle').oninput=labels;$('slope').oninput=labels;$('direction').onclick=()=>{dir*=-1};$('walking').onclick=()=>{walk=!walk;$('walking').setAttribute('aria-pressed',String(walk));$('walking').classList.toggle('active',walk);};$('fire').onclick=()=>{kick=.22};$('language').onclick=()=>{english=!english;labels();cards();};
function frame(t){const dt=previous?Math.min(.05,(t-previous)/1000):0;previous=t;if(walk)travel+=dt*70;kick=Math.max(0,kick-dt);ArcCharacters.paint($('hero'),id,{angle:+$('angle').value,dir,slope:+$('slope').value*Math.PI/180,travel,kick:kick?Math.sin(kick/.22*Math.PI)*3:0});requestAnimationFrame(frame);}
addEventListener('resize',cards);labels();cards();requestAnimationFrame(frame);
</script><script>
const viewerLinks=document.querySelectorAll('.viewer-nav a');
function syncViewerNavigation(){const en=document.getElementById('language').textContent==='日本語';const ja=['← ARCLINE 紹介サイト','ゲームで遊ぶ ↗','HTMLをダウンロード ↓'],eng=['← About ARCLINE','Play the game ↗','Download HTML ↓'];viewerLinks.forEach((a,i)=>a.textContent=(en?eng:ja)[i]);document.querySelector('.image-download').textContent=en?'Download all 10 as an image ↓':'10機の画像をダウンロード ↓';document.documentElement.lang=en?'en':'ja';try{localStorage.setItem('arcline-language',en?'en':'ja');}catch{}}
try{if(localStorage.getItem('arcline-language')==='en')document.getElementById('language').click();}catch{}
document.getElementById('language').addEventListener('click',syncViewerNavigation);syncViewerNavigation();
</script></html>
