<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARCLINE — 10機のキャラ確認</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#12384c;color:#eef3db;font:15px/1.6 system-ui,sans-serif}main{max-width:1380px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;gap:20px;align-items:center;border-bottom:1px solid #bad7c544;padding-bottom:20px}h1{font-size:30px;letter-spacing:3px;margin:0}header p{color:#bbd0c5;margin:4px 0}button,input{font:inherit}button{cursor:pointer;color:inherit;background:#224c5c;border:1px solid #a6c8b765;border-radius:7px;min-height:44px;padding:7px 16px}button.active{border-color:#e4f8bf;background:#3b6063}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:24px 0}.machine{text-align:left;padding:14px}.machine strong{font-size:20px}.machine small{display:block;color:#c8d8c9;font-size:11px}.machine canvas{display:block;width:100%;height:126px}.stage{background:#1b4556;border:1px solid #abcbb844;border-radius:10px;padding:20px;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:20px}.hero{width:100%;height:300px}.detail h2{font-size:32px;margin:0}.detail p{color:#d3dfc8;margin:5px 0}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}.controls label{display:flex;align-items:center;gap:9px}.controls input{width:160px;accent-color:#c7e7a4}.note{margin:22px 0 0;font-size:12px;color:#b5cfc3}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.machine canvas{height:110px}}@media(max-width:600px){main{padding:16px}header{display:block}h1{font-size:25px}header .row{margin-top:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.machine{padding:10px}.machine canvas{height:95px}.stage{grid-template-columns:1fr;padding:14px}.hero{height:230px}.detail h2{font-size:27px}.detail p{font-size:13px}.controls{gap:8px}.controls input{width:120px}}
.viewer-nav{display:flex;gap:12px 22px;align-items:center;flex-wrap:wrap;margin-bottom:23px;font-size:12px;color:#c5dbca}.viewer-nav a{color:inherit;text-decoration:none;min-height:44px;display:inline-flex;align-items:center;border-bottom:1px solid #c5dbca55}.viewer-nav a:last-child{margin-left:auto}.image-download{display:inline-flex;min-height:44px;align-items:center;color:#dbe6c9;text-underline-offset:5px}.viewer-nav a:focus-visible{outline:2px solid #f0cb7d;outline-offset:5px}@media(max-width:600px){.viewer-nav{gap:3px 20px;font-size:11px}.viewer-nav a:last-child{margin-left:0}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style><link rel="stylesheet" href="../game/dist/cinematics.css?v=0.17.2-preview1"><style>.grid{grid-template-columns:repeat(5,minmax(0,1fr))!important}.machine .roster-role{display:block;font-size:11px;line-height:1.45}.machine .viewer-state{display:block;font-size:11px;line-height:1.6;margin-top:6px}.character-feature{height:520px;margin:24px 0}.viewer-commit-status{font-size:13px;color:#d8e5cb}.code-lab{margin-top:25px}.code-lab summary{font-size:14px;min-height:44px}.code-lab .stage{margin-top:12px}@media(max-width:600px){.machine{padding:8px 4px}.machine strong{font-size:12px}.machine canvas{height:40px}.machine .roster-role{font-size:8px;line-height:12px}.machine .viewer-state{font-size:8px}.character-feature{height:auto;min-height:760px}.character-feature .character-hero{grid-template-rows:minmax(260px,52vh) auto}.character-feature .ch-copy{padding:22px}}</style><main><nav class="viewer-nav" aria-label="ARCLINEのページ"><a href="../">← ARCLINE 紹介サイト</a><a href="../game/dist/?v=0.17.2-preview1">ゲームで遊ぶ ↗</a><a href="ARCLINE_Characters_Preview.html" download="ARCLINE_Characters_Preview.html">HTMLをダウンロード ↓</a></nav><header><div><h1>ARCLINE / MACHINES</h1><p id="viewerIntro">10機の名前、役割、想い。ゲームの所有状況とともに。</p></div><div class="row"><button id="language">English</button></div></header><div id="cards" class="grid"></div><div id="characterFeature" class="character-feature" aria-live="polite"></div><p id="viewerCommitStatus" class="viewer-commit-status" role="status"></p><details class="code-lab"><summary id="labTitle">ゲーム内の動きを確認</summary><section class="stage"><canvas class="hero" id="hero" role="img" aria-label="選択した機体"></canvas><div class="detail"><h2 id="name"></h2><p id="role"></p><p id="motto"></p><div class="controls"><label><span id="angleLabel">照準</span><input id="angle" type="range" min="-12" max="85" value="32"><output id="degrees">32°</output></label><label><span id="slopeLabel">傾斜</span><input id="slope" type="range" min="-25" max="25" value="0"></label><button id="direction">向き反転</button><button id="walking" aria-pressed="false">走行</button><button id="fire">発射動作</button></div></div></section></details><p class="note" id="note">ゲーム内と同じCanvas 2Dのコードで描画しています。このページは外観の確認用です。武器・耐久の違いはゲームの機体選択で確認できます。</p><p class="note"><a class="image-download" href="ARCLINE_Characters_Preview.png" download="ARCLINE_Characters_Preview.png">10機の画像をダウンロード ↓</a></p></main><script src="../game/dist/i18n.js?v=0.17.2-preview1"></script><script src="../game/dist/levels.js?v=0.17.2-preview1"></script><script src="../game/dist/combat.js?v=0.17.2-preview1"></script><script src="../game/dist/skills.js?v=0.17.2-preview1"></script><script src="../game/dist/weapons.js?v=0.17.2-preview1"></script><script src="../game/dist/inventory.js?v=0.17.2-preview1"></script><script src="../game/dist/crew.js?v=0.17.2-preview1"></script><script src="../game/dist/campaign-run.js?v=0.17.2-preview1"></script><script src="../game/dist/story.js?v=0.17.2-preview1"></script><script src="../game/dist/journal.js?v=0.17.2-preview1"></script><script src="../game/dist/save.js?v=0.17.2-preview1"></script><script src="../game/dist/visual-style.js?v=0.17.2-preview1"></script><script src="../game/dist/characters.js?v=0.17.2-preview1"></script><script src="../game/dist/cinematic-data.js?v=0.17.2-preview1"></script><script src="../game/dist/asset-loader.js?v=0.17.2-preview1"></script><script src="../game/dist/cinematic-player.js?v=0.17.2-preview1"></script><script src="../game/dist/character-hero.js?v=0.17.2-preview1"></script><script>
let id='gun',dir=1,walk=false,travel=0,kick=0,previous=0,english=false;
const $=x=>document.getElementById(x);
function labels(){ArcI18n.setLanguage(english?'en':'ja');const c=ArcCharacters.get(id);$('name').textContent=english?c.name:c.nameJa;$('role').textContent=english?c.role:c.roleJa;$('motto').textContent=english?c.motto:c.mottoJa;$('degrees').value=$('angle').value+'°';$('language').textContent=english?'日本語':'English';$('angleLabel').textContent=english?'Aim':'照準';$('slopeLabel').textContent=english?'Slope':'傾斜';$('direction').textContent=english?'Flip':'向き反転';$('walking').textContent=english?'Move':'走行';$('fire').textContent=english?'Recoil':'発射動作';$('note').textContent=english?'The same Canvas 2D code draws these machines in the game. This page previews appearance; see machine selection in the game for weapons and durability.':'ゲーム内と同じCanvas 2Dのコードで描画しています。このページは外観の確認用です。武器・耐久の違いはゲームの機体選択で確認できます。';}
function readViewerSave(){try{return ArcSave.decode(localStorage.getItem(ArcSave.key));}catch{return {unlockedCharacterIds:[],equippedCharacterId:null,unavailable:true};}}
function showCharacter(){const previousHero=ArcCharacterHero.snapshot($('characterFeature'));const data=readViewerSave(),lang=english?'en':'ja';$('characterFeature').innerHTML=ArcCharacterHero.markup(id,{data,lang,assetBase:'../'});ArcCharacterHero.hydrate($('characterFeature'));ArcCharacterHero.crossfade($('characterFeature'),previousHero);$('viewerIntro').textContent=english?'Ten machines: their roles, wishes and your actual collection.':'10機の名前、役割、想い。ゲームの所有状況とともに。';$('labTitle').textContent=english?'Inspect the in-game movement':'ゲーム内の動きを確認';const commit=$('characterFeature').querySelector('[data-confirm-character]');if(commit)commit.onclick=async()=>{const store=ArcSave.create({load:()=>localStorage.getItem(ArcSave.key),save:value=>localStorage.setItem(ArcSave.key,value)});await store.load();if(!store.ready||!ArcCrew.owned(store.data,id)){showCharacter();return;}store.data.equippedCharacterId=id;const ok=await store.save();$('viewerCommitStatus').textContent=english?(ok?'Formation saved for the game.':'Could not save. Please retry.'):(ok?'ゲームで使う編成を保存しました。':'保存できませんでした。もう一度試してください。');if(ok)cards();};}
function cards(){const holder=$('cards'),data=readViewerSave(),lang=english?'en':'ja';holder.replaceChildren();for(const c of ArcCharacters.characters){const b=document.createElement('button');b.className='machine'+(c.id===id?' active':'');b.setAttribute('aria-pressed',String(c.id===id));b.dataset.machine=c.id;const name=document.createElement('strong');name.style.color=c.light;name.textContent=english?c.name:c.nameJa;const role=document.createElement('span');role.className='roster-role';role.textContent=english?c.role:c.roleJa;const status=document.createElement('span');status.className='viewer-state';const st=ArcCharacterHero.state(c.id,data,lang);status.textContent=(st.equipped?'✓ ':st.owned?'':'▣ ')+st.label;const canvas=document.createElement('canvas');canvas.setAttribute('role','img');canvas.setAttribute('aria-label',c.name);b.append(name,role,canvas,status);b.onclick=()=>{id=c.id;$('angle').value=id==='sora'?58:32;labels();cards();};holder.append(b);ArcCharacters.paint(canvas,c.id);}showCharacter();}

$('angle').oninput=labels;$('slope').oninput=labels;$('direction').onclick=()=>{dir*=-1};$('walking').onclick=()=>{walk=!walk;$('walking').setAttribute('aria-pressed',String(walk));$('walking').classList.toggle('active',walk);};$('fire').onclick=()=>{kick=.22};$('language').onclick=()=>{english=!english;labels();cards();};addEventListener('storage',e=>{if(e.key===ArcSave.key)cards();});
function frame(t){const dt=previous?Math.min(.05,(t-previous)/1000):0;previous=t;ArcCharacterHero.updateAll(dt,$('characterFeature'));if(walk)travel+=dt*70;kick=Math.max(0,kick-dt);if($('hero').getClientRects().length)ArcCharacters.paint($('hero'),id,{angle:+$('angle').value,dir,slope:+$('slope').value*Math.PI/180,travel,kick:kick?Math.sin(kick/.22*Math.PI)*3:0});requestAnimationFrame(frame);}
addEventListener('resize',cards);try{id=readViewerSave().equippedCharacterId||'gun';}catch{}labels();cards();requestAnimationFrame(frame);
</script><script>
const viewerLinks=document.querySelectorAll('.viewer-nav a');
function syncViewerNavigation(){const en=document.getElementById('language').textContent==='日本語';const ja=['← ARCLINE 紹介サイト','ゲームで遊ぶ ↗','HTMLをダウンロード ↓'],eng=['← About ARCLINE','Play the game ↗','Download HTML ↓'];viewerLinks.forEach((a,i)=>a.textContent=(en?eng:ja)[i]);document.querySelector('.image-download').textContent=en?'Download all 10 as an image ↓':'10機の画像をダウンロード ↓';document.documentElement.lang=en?'en':'ja';try{localStorage.setItem('arcline-language',en?'en':'ja');}catch{}}
try{if(localStorage.getItem('arcline-language')==='en')document.getElementById('language').click();}catch{}
document.getElementById('language').addEventListener('click',syncViewerNavigation);syncViewerNavigation();
</script></html>
