const el=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';
const X=x=>x*10,Y=h=>500-h*10;
function show(index){
const m=MAPS[index],a=AUDITS[index];[...el('nav').children].forEach((b,i)=>b.className=i===index?'active':'');
el('ttl').textContent='STAGE '+m.stage+'｜'+m.prototypeTitle;el('desc').textContent=m.name+'／'+m.band+'／骨格'+m.pattern.topology+' × 輪郭'+m.pattern.contour;
el('facts').innerHTML='<span>自機：'+a.playerEnvironment+'</span><span>敵：'+a.enemyEnvironment+'</span><span>初期有効打 '+a.initialHitCount+'/144</span><span>ギミック経由 '+a.gimmickHitCount+'</span><span>テレポート後有効 '+(a.teleportLandingUseful||0)+'試行</span>';
el('route').textContent=m.routes.primary;el('alternative').textContent=m.routes.alternate;el('lesson').textContent=m.lesson;
const f=m.floorSegments||[m.floor],draw=['<svg xmlns="'+ns+'" viewBox="0 -150 1000 710" role="img" aria-label="Stage '+m.stage+' 地形断面と実弾道">','<rect x="0" y="-150" width="1000" height="710" fill="#102330"/>'];
for(let h=0;h<=60;h+=10)draw.push('<line x1="0" y1="'+Y(h)+'" x2="1000" y2="'+Y(h)+'" stroke="#fff" stroke-opacity=".12"/>');
for(const floor of f){draw.push('<polygon points="'+[...floor.map(q=>X(q[0])+','+Y(q[1])),X(floor.at(-1)[0])+',560',X(floor[0][0])+',560'].join(' ')+'" fill="#3b625d" stroke="#9bc4b5" stroke-width="3"/>')}
for(const p of m.parts)draw.push('<polygon points="'+p.poly.map(q=>X(q[0])+','+Y(q[1])).join(' ')+'" fill="'+(p.kind==='roof'?'#637991':p.kind==='island'?'#75a99d':'#987665')+'" fill-opacity=".9" stroke="'+(p.breakable?'#eac57b':'#dbefe5')+'" stroke-width="2.6" '+(p.breakable?'stroke-dasharray="6 5"':'')+'/>');
for(const fx of m.features){const v=fx.v;if('CFUV'.includes(fx.type)){draw.push('<rect x="'+X(v[0])+'" y="'+Y(v[3])+'" width="'+X(v[1]-v[0])+'" height="'+X(v[3]-v[2])+'" rx="8" fill="'+(fx.type==='C'?'#bedbea':'#d8e5a7')+'" fill-opacity=".16" stroke="#eee6b8" stroke-dasharray="8 5"/>')}else if(fx.type==='M'){draw.push('<circle cx="'+X(v[0])+'" cy="'+Y(v[1])+'" r="'+X(v[2])+'" fill="#b7a9ed" fill-opacity=".13" stroke="#c7b5ff" stroke-dasharray="7 6"/>')}else if(fx.type==='K'||fx.type==='T'){draw.push('<circle cx="'+X(v[0])+'" cy="'+Y(v[1])+'" r="11" fill="#f6d78a" stroke="#eef2e0" stroke-width="2"/>')}else if(fx.type==='W'){for(const e of m.renderReflectors||[])draw.push('<line x1="'+e.a[0]+'" y1="'+e.a[1]+'" x2="'+e.b[0]+'" y2="'+e.b[1]+'" stroke="#91cbec" stroke-width="5" stroke-dasharray="9 5"/>')}}
for(const [side,label,color] of [['player','P','#b2f4d2'],['enemy','E','#f4baaa']]){let a=m.spawns[side];draw.push('<circle cx="'+X(a.x)+'" cy="'+(Y(a.h)-23)+'" r="15" fill="'+color+'" stroke="#0c2733" stroke-width="3"/><text x="'+(X(a.x)+19)+'" y="'+(Y(a.h)-30)+'" font-size="21" font-weight="bold" fill="#fff">'+label+'</text>')}
for(const t of a.teleportSamples.slice(0,2)){draw.push('<text x="'+X(t.landingX)+'" y="'+(Y(t.landingHeight)-19)+'" font-size="28" fill="#e6dd8a">★</text>')}
draw.push('<g id="shotlayer"></g></svg>');
el('draw').innerHTML=draw.join('');
const choices=[];if(a.sampleInitialHits.length){choices.push(a.sampleInitialHits[0]);let g=a.sampleInitialHits.find(h=>h.effectTypes.some(t=>['cloud','wind','magnet','terminal','bounce','updraft'].includes(t)));if(g&&g!==choices[0])choices.push(g);else if(a.sampleInitialHits.length>1)choices.push(a.sampleInitialHits.at(-1))}
el('shootControls').innerHTML='';
choices.forEach((h,i)=>{const b=document.createElement('button');b.textContent=(i===0?'射線A':'射線B')+' : 角'+h.angle+'° 出力'+h.power;b.onclick=()=>renderShot(h,i);el('shootControls').appendChild(b)});
function renderShot(hit,which){
[...el('shootControls').children].forEach((b,i)=>b.className=i===which?'active':'');const pts=PATHS[m.stage+'_'+hit.angle+'_'+hit.power]||[];
el('draw').querySelector('#shotlayer').innerHTML=pts.length>1?'<polyline points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#ffdc88" stroke-width="5" stroke-dasharray="10 6" stroke-linejoin="round"/>':'';
el('trajInfo').textContent='有効打のサンプル：角'+hit.angle+'°・出力'+hit.power+'。作用：'+(hit.effectTypes.length?[...new Set(hit.effectTypes)].join(' / '):'ギミックを使わない弧');
}
if(choices[0])renderShot(choices[0],0);
}
MAPS.forEach((m,i)=>{const b=document.createElement('button');b.textContent=String(m.stage).padStart(3,'0');b.onclick=()=>show(i);el('nav').appendChild(b)});show(0);
</script></body></html>
