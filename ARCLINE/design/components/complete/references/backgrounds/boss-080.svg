<title id="title">ポラリス・コア — 極性試験室</title>
<desc id="desc">実験棟の白い陶器と青紫の鋼材を引き継ぐ、大型の極性試験室。左の壁沿いの誘導環、右の太い絶縁柱、天井の支持軸で空間を近づける。中央に偽の核や磁力線を描かない。</desc>
