<title id="title">アークハート核防護 — 岩盤の保全洞</title>
<desc id="desc">空の搬送層から、古い中枢の土台にある保全洞へ。横に連なる岩盤天井と、地中に埋まった青緑の配管。暖かな石の土色と小さな保全灯で、深部へ進む静かな緊張を描く。</desc>
