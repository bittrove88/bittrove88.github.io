<title id="title">プリズム・ガーディアン — 多面の守護廊</title>
<desc id="desc">葡萄色の城壁の内側へ。多面体の張り出しと琥珀色の継ぎ目が、青い鉱石板を囲む。丸い門や自然の水晶柱は使わず、加工された鉱物の広い面で守護廊を描く。</desc>
