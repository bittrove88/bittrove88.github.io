<title id="title">鍛冶の回廊</title>
<desc id="desc">赤い煉瓦と冷えた鉄骨の鍛冶回廊。左の大きな炉口、上部の排気ダクト、右の金床と吊り具。熱は小さな炉の内面に留め、巨大な設備と静かな作業場を描く。</desc>
