<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc">
<title id="title">磁石の採掘場</title>
<desc id="desc">赤錆色の露天採掘場。黒い鉄鉱石の段丘、片持ちの運搬架台、奥に吊られた大きな馬蹄形磁石。自然石の黒と酸化した鉄の赤、青緑の古い機械を描き分ける。</desc>
