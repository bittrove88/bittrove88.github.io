<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc">
<title id="title">アークハート内殻 — 空の搬送層</title>
<desc id="desc">外殻の奥で、搬送層が大きく空へ開く。見上げる楕円の搬送環、天井から下がる保全構造、はるか下の雲。浮遊戦場のために床を描かず、空隙と高さを主役にする。</desc>
