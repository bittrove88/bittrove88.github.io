<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc">
<title id="title">タイドクロー — 青い潮門</title>
<desc id="desc">鏡の岸壁と同じ青い板状岩の港口。左に沈んだ旧桟橋、右に大きな潮門の巻上げ部。銀紫の水面は少し深い藍色になり、狭い港口を守るタイドクローの場へ変わる。</desc>
