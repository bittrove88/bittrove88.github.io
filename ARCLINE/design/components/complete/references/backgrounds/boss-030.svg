<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc">
<title id="title">クラウドレイ — 雲港の閉鎖空域</title>
<desc id="desc">雲の空港の青空と赤い格納庫を継承し、係留塔の近くから閉鎖空域を望む。厚い白雲が奥の空を囲み、左に迫る港の設備が普段より狭い空間をつくる。</desc>
