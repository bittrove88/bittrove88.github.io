<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc">
<title id="title">要塞の重層門</title>
<desc id="desc">黒青の石と鈍い真鍮の要塞。右手前の巨大な角門から左奥へ、閉鎖された扉が段階的に重なる。丸い遺跡の門ではなく、鋭い切断面と厚い引き戸で防護機構の重さを描く。</desc>
