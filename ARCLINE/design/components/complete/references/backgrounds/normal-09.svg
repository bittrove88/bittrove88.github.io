<title id="title">琥珀の機関</title>
<desc id="desc">琥珀色の採光窓を持つ古い動力室。左の大きな青銅のはずみ車、横へ伸びる伝動軸、右の丸い圧力槽。暖かな金属と深い青緑の影で、静止した機関の質量を描く。</desc>
