<title id="title">ゲートキーパー — 赤土の封鎖門</title>
<desc id="desc">遺跡の入口の赤土と砂岩を引き継ぎ、右側へ大きく寄せた閉鎖門へ近づく。厚い石の縁と青緑の古い装飾、低く下りた扉が、開いた遺跡より少し重い空気をつくる。</desc>
