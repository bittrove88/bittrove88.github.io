<title id="title">風の観測台</title>
<desc id="desc">金色の草がなびく高原の観測所。低い白い観測棟と、空を測る三杯式の風速計。空を広く、地形を横長に取り、風を線や矢印ではなく草原と雲の大きな面で示す。</desc>
