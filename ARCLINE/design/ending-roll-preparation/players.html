<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自機10機・エンドロール透過素材</title><style>*{box-sizing:border-box}body{margin:24px;background:#102c3d;color:#ecedda;font:16px/1.6 system-ui}a{color:#a8d9e8}button{font:inherit;min-height:44px;margin:6px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}figure{margin:0;padding:12px;border:1px solid #678;background:#173447}figure img{display:block;max-width:100%;max-height:260px;margin:auto}.art{height:280px;display:grid;place-items:center;background-color:var(--bg,#102c3d);background-image:linear-gradient(45deg,#9992 25%,transparent 25%,transparent 75%,#9992 75%),linear-gradient(45deg,#9992 25%,transparent 25%,transparent 75%,#9992 75%);background-size:20px 20px;background-position:0 0,10px 10px}</style><h1>自機10機・透過素材</h1><p>承認原画のRGBを保持した派生PNG。背景と輪郭のアルファのみ変更。<a href="../../assets/ending/player-cutouts.json">出典・原寸・マスク台帳</a> ／ <a href="../../ending-preview/">本編と共通のエンディング確認</a> ／ <a href="index.html">敵32体</a></p><nav><button onclick="document.body.style.setProperty('--bg','#102c3d')">暗色</button><button onclick="document.body.style.setProperty('--bg','#eee')">明色・市松</button><button onclick="document.body.style.setProperty('--bg','#000')">黒・市松</button></nav><main id="grid"></main><script>fetch('../../assets/ending/player-cutouts.json').then(r=>r.json()).then(d=>{for(const a of d.actors){const f=document.createElement('figure'),art=document.createElement('div'),im=new Image(),cap=document.createElement('figcaption');art.className='art';im.src='../../'+a.src;im.alt=a.name.ja;art.append(im);cap.textContent=a.name.ja+' / '+a.width+'×'+a.height+' ';for(const [text,url]of[['透過PNG',a.src],['承認原画',a.source]]){const link=document.createElement('a');link.textContent=text+' ';link.href='../../'+url;cap.append(link);}f.append(art,cap);grid.append(f);}});</script></html>
