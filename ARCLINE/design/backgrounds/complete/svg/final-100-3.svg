<title id="title">アークハート中枢 — 最後の照合室</title>
<desc id="desc">十機の帰還と安全記録を待つ保全中枢の照合室。巨大な支持環は画面端へ逃がし、中央を静かな一射の余白にする。帰還灯は未点灯のまま。 不透明な単色色面のみ。背景デザイン資料。</desc>
