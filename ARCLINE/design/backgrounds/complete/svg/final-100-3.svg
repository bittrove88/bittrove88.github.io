<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc">
<title id="title">アークハート中枢 — 帰還照合室</title>
<desc id="desc">古い保全中枢の最後の照合室。頭上の巨大な支持環、斜めのクリーム色の補強材、十個の未点灯の照合口。暖かな採光と静かな中央の余白で、最後の一射の向こうにある帰還を待つ場所を描く。</desc>
