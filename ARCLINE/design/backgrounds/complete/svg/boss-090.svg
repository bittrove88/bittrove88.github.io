<title id="title">スカイキャリア — 嵐の係留域</title>
<desc id="desc">嵐の空母の空気色を受け継ぎ、係留柱と密な雲壁が迫る。背景にもう一隻の戦闘空母を置かず、戦うスカイキャリアの輪郭を守る。 不透明な単色色面のみ。背景デザイン資料。</desc>
