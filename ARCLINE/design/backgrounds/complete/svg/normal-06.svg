<title id="title">水晶の反射路</title>
<desc id="desc">薄紫の石盆地を走る、静かな水晶の道。左へ傾いた大きな鉱晶、奥の低い晶洞、右岸の扇状結晶。自然の不規則な面と青磁色の透き通るような単色色面で描く。</desc>
