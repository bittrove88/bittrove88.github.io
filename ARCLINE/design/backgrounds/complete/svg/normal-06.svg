<title id="title">水晶の反射路</title>
<desc id="desc">低い山裾から伸びる大きな鉱晶。角ばった自然石と淡い水面を重ね、城壁とは異なる自然の反射路。 不透明な単色色面のみ。背景デザイン資料。</desc>
