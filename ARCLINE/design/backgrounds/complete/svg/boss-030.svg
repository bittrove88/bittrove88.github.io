<title id="title">クラウドレイ — 雲上の閉鎖空域</title>
<desc id="desc">雲の空港と同じ港の建材を維持。雲が中央へ寄り、左右の係留塔を大きくして空域の圧力を高める。 不透明な単色色面のみ。背景デザイン資料。</desc>
