<title id="title">火山の外縁</title>
<desc id="desc">地平に重なる火口縁と噴煙。夕映えの薄い光と巨大な岩体で熱と圧力を表現する。霧の谷とは逆に、直線的な切断面と暖色・暗色の質量感を主役にする。</desc>
