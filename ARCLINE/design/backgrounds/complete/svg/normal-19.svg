<title id="title">夜明けの核</title>
<desc id="desc">夜明けの光が差す、古い中枢施設の外周。左の縦長の送気設備、遠い保全棟、奥へ曲がる連絡路。桃色の空と鈍い青緑の金属が、最後の室内へ入る前の静けさをつくる。</desc>
