<title id="title">夜明けの核</title>
<desc id="desc">中枢へ至る夜明けの連絡区。閉じた保全棟を左右に置き、暖かな空の開口へ向かう。正式名や帰還の灯りはまだ示さない。 不透明な単色色面のみ。背景デザイン資料。</desc>
