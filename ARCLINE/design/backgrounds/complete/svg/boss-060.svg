<title id="title">ホワイトハウル — 吹雪の狭門</title>
<desc id="desc">凍てつく峡谷の氷と雪を残し、風除けの大きな壁と斜めの吹雪色面で圧迫感を出す。粒子や細い風線は使わない。 不透明な単色色面のみ。背景デザイン資料。</desc>
