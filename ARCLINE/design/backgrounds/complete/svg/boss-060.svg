<title id="title">ホワイトハウル — 吹雪の風除け</title>
<desc id="desc">凍てつく峡谷の白と青緑の氷を受け継ぐ吹雪の吹き溜まり。右上から迫る雪雲、左の厚い雪庇、雪に埋もれた風除け。細い風線や粒子を使わず、広い雪の面で圧力を描く。</desc>
