<title id="title">タイドクロー — 潮門の影</title>
<desc id="desc">鏡の岸壁の白い石と静水を受け継ぐ。手前の潮門と水圧のある狭い港口により、開けた入江から緊張へ。 不透明な単色色面のみ。背景デザイン資料。</desc>
