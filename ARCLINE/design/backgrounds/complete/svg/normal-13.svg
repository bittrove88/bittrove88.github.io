<title id="title">鍛冶の回廊</title>
<desc id="desc">炉からの残光が通る静かな鍛冶場。斜めの配管、奥行きのある煉瓦開口、冷えた大きな梁。 不透明な単色色面のみ。背景デザイン資料。</desc>
