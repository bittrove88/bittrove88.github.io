<title id="title">ダスト・ドリラー — 琥珀の掘削室</title>
<desc id="desc">琥珀の機関から続く主掘削室。右の大きな掘削孔、左の保守架台、土の層に埋もれた動力管。青銅と琥珀色の残光を継ぎ、機械室から岩盤の仕事場へ入る。</desc>
