<title id="title">ダスト・ドリラー — 主掘削竪坑</title>
<desc id="desc">琥珀の機関の灯りを残し、坑道の土色と巨大な支保工を組む。天井が低く迫るが、中央の戦闘領域は静かに保つ。 不透明な単色色面のみ。背景デザイン資料。</desc>
