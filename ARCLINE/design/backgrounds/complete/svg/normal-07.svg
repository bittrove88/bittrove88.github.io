<title id="title">プリズム城壁</title>
<desc id="desc">淡い鉱石を組んだ段状の城壁。斜めに折れる壁面と空の開口で、鉱晶の野から人工の防壁へ移る。 不透明な単色色面のみ。背景デザイン資料。</desc>
