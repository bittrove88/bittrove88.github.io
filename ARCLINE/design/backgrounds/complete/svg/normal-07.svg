<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc">
<title id="title">プリズム城壁</title>
<desc id="desc">夕空を受けた、菱形の面を持つ葡萄色の城壁。斜めに伸びる壁、琥珀の縁取り、青い鉱石のはめ込み。自然の水晶原とは異なる、鉱物を加工した幾何学の防壁。</desc>
