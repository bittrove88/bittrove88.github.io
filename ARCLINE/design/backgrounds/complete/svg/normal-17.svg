<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="604" viewBox="0 0 1120 604" role="img" aria-labelledby="title desc">
<title id="title">嵐の空母</title>
<desc id="desc">雨雲の切れ間を背に、巨大な空母の船腹が雲海へ沈む。青い鋼材、重い灰色の雲、左奥に残る鈍い琥珀の空。空港の晴れた風景とは異なる、嵐の中の質量と距離。</desc>
