<title id="title">嵐の空母</title>
<desc id="desc">青灰の嵐雲を背にした遠い停泊空母。小さな艦橋と大きな船腹で質量を示し、手前は明るい雲海。 不透明な単色色面のみ。背景デザイン資料。</desc>
