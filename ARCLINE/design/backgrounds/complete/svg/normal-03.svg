<title id="title">遺跡の入口</title>
<desc id="desc">砂色の空の下、焼けた赤土の段丘に残る石の入口。崩れた角形の門、欠けた階段、わずかに残る青緑の石装飾。森の水路から乾いた古代の風景へ移る。</desc>
