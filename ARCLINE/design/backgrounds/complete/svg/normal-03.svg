<title id="title">遺跡の入口</title>
<desc id="desc">草をかぶった石の門。欠けた柱と門の向こうの明るい盆地で、閉鎖ではなく発見の入口を描く。 不透明な単色色面のみ。背景デザイン資料。</desc>
