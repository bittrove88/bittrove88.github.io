<title id="title">アークハート核防護 — 岩盤の保全洞</title>
<desc id="desc">古い中枢を支える自然岩盤の保全洞。連続する洞窟の天井と埋設配管。外殻と同じ建材を洞窟へつなぎ、核防護へ近づく。 不透明な単色色面のみ。背景デザイン資料。</desc>
