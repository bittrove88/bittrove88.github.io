<title id="title">アークハート外殻 — 保全設備壁</title>
<desc id="desc">古い保全中枢の外殻。左端へ続く巨大な支持環、厚いクリーム色の補強材、右の集合配管。青緑の設備壁を正面に見て、長く閉じた施設の重さを描く。</desc>
