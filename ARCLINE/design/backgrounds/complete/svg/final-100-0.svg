<title id="title">アークハート外殻 — 停止した保全門</title>
<desc id="desc">古い保全中枢の外周。太い配管、クリーム色の補強材、青緑の扉。まだ閉じた採光部と少数の真鍮色で、静かに待つ巨大施設を示す。 不透明な単色色面のみ。背景デザイン資料。</desc>
