<title id="title">フォージ・タイタン — 大炉の前庭</title>
<desc id="desc">鍛冶の回廊の煉瓦と残熱を継承し、両側の大炉と天井梁を太くする。熱は背景の広い単色面にとどめる。 不透明な単色色面のみ。背景デザイン資料。</desc>
