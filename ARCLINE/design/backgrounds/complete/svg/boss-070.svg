<title id="title">フォージ・タイタン — 大炉の足元</title>
<desc id="desc">鍛冶の回廊と同じ赤煉瓦と冷えた鉄骨で描く大炉の区画。左に迫る炉壁、右の天井につながる重い鍛圧設備、低い鋳型。炉の熱は側方へ寄せ、中央の作業空間を残す。</desc>
