<title id="title">琥珀の機関</title>
<desc id="desc">止まった昇降動力室。左の大きな機関輪と右上の琥珀色の採光窓を、穏やかな暗部がつなぐ。 不透明な単色色面のみ。背景デザイン資料。</desc>
