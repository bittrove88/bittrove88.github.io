<title id="title">プリズム・ガーディアン — 屈折の門廊</title>
<desc id="desc">プリズム城壁の切断面を受け継ぐ。左右の結晶建築と張り出す天井で、開いた城壁より密度のある門廊へ。 不透明な単色色面のみ。背景デザイン資料。</desc>
