<title id="title">アークハート内殻 — 空へ開いた搬送層</title>
<desc id="desc">保全棟の内殻が空へ開く搬送層。高い支持塔と空隙、遠い吊り構造、雲海。浮遊足場の実地形とは別の、空間そのものの広さを描く。 不透明な単色色面のみ。背景デザイン資料。</desc>
