 res.push({label:'初期射撃 ('+v.initialHitCount+'通り)',kind:'init',key:shotKey(m.stage,'init',plain),hit:plain});
 if(effect)res.push({label:'ギミック経由の初期射撃',kind:'init',key:shotKey(m.stage,'init',effect),hit:effect});
 }else res.push({label:'初期射撃：この走査では0件',kind:'none'});
 for(let i=0;i<v.movementTests.length;i++){const t=v.movementTests[i],phase=m.stage===50?'walk':t.totalWalkedPx===40?'walk40':'walk80',hit=t.sample.find(h=>h.effects.length>0)||t.sample[0];res.push({label: t.sequencePx.join('→')+'px後 ('+t.postHitCount+'通り)',kind:'move',t,key:shotKey(m.stage,phase,hit),hit})}
 if(v.teleportTrajectory){const t=v.teleportTrajectory;res.push({label:'テレポート後の射撃',kind:'teleport',t,key:t.pathKey,hit:{angle:t.followupAngle,power:t.followupPower,effects:[]}})}
 return res;}
function stage(i){
 const m=MAPS[i],v=CHECKS[i],routeList=routesFor(m,v);[...$('stages').children].forEach((b,j)=>b.className=i===j?'active':'');
 $('heading').textContent='STAGE '+m.stage+'｜'+m.prototypeTitle;
 $('subtitle').textContent=m.name+'／'+label[m.engagementMode]+'／主骨格'+m.pattern.topology+' × 輪郭'+m.pattern.contour;
 $('stats').innerHTML='<span>初期有効打 '+v.initialHitCount+'/144</span><span>移動先 '+v.movementTests.length+'パターン</span><span>有効転移試行 '+(v.teleportSuccessCount||0)+'</span><span>自機開始角 '+v.playerStartSlopeDeg+'°</span>';
 $('primary').textContent=m.routes.primary;$('secondary').textContent=m.routes.alternate;
 $('hint').textContent=m.discoveryHint||m.lesson;
 $('routes').replaceChildren();
 routeList.forEach((r,j)=>{const b=document.createElement('button');b.textContent=r.label;b.onclick=()=>draw(m,v,r,j);$('routes').appendChild(b);});
 function draw(m,v,option,selected){
  [...$('routes').children].forEach((b,j)=>b.className=j===selected?'active':'');
  const svg=['<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -190 1000 750" role="img" aria-label="マップ断面図と有効射線">',
    '<rect x="0" y="-190" width="1000" height="750" fill="#112734"/>'];
  for(let h=0;h<=60;h+=10)svg.push('<line x1="0" y1="'+Y(h)+'" x2="1000" y2="'+Y(h)+'" stroke="#ffffff" stroke-opacity=".10"/>');
  for(const f of m.floorSegments||[m.floor])svg.push('<polygon points="'+[...f.map(q=>X(q[0])+','+Y(q[1])),X(f.at(-1)[0])+',560',X(f[0][0])+',560'].join(' ')+'" fill="#3d635e" stroke="#9bc7b7" stroke-width="3"/>');
  for(const p of m.parts){const fill=p.kind==='roof'?'#667e94':p.kind==='island'?'#85b8a4':'#9e796a';
    svg.push('<polygon points="'+p.poly.map(q=>X(q[0])+','+Y(q[1])).join(' ')+'" fill="'+fill+'" stroke="'+(p.breakable?'#f0c98a':'#d4e8dd')+'" stroke-width="2.5" '+(p.breakable?'stroke-dasharray="8 5"':'')+'/>')}
  for(const f of m.features){let q=f.v;
   if('CFUV'.includes(f.type)){svg.push('<rect x="'+X(q[0])+'" y="'+Y(q[3])+'" width="'+X(q[1]-q[0])+'" height="'+X(q[3]-q[2])+'" rx="6" fill="'+(f.type==='C'?'#bbdff6':'#d7efab')+'" fill-opacity=".15" stroke="#d8e9c0" stroke-dasharray="7 7"/>');}
   else if(f.type==='M')svg.push('<circle cx="'+X(q[0])+'" cy="'+Y(q[1])+'" r="'+X(q[2])+'" fill="#b0abed" fill-opacity=".14" stroke="#c7b1f1" stroke-dasharray="8 5"/>');
   else if(f.type==='T'||f.type==='K')svg.push('<circle cx="'+X(q[0])+'" cy="'+Y(q[1])+'" r="11" fill="#f8dc86"/>');
   else if(f.type==='W')for(const edge of m.renderReflectors||[])svg.push('<line x1="'+edge.a[0]+'" y1="'+edge.a[1]+'" x2="'+edge.b[0]+'" y2="'+edge.b[1]+'" stroke="#89caf4" stroke-width="5" stroke-dasharray="7 5"/>');
  }
  for(const [side,letter,color] of [['player','P','#a2f3cf'],['enemy','E','#e8b4a3']]){
   const p=m.spawns[side];svg.push('<circle cx="'+X(p.x)+'" cy="'+(Y(p.h)-23)+'" r="15" fill="'+color+'" stroke="#182735" stroke-width="3"/><text x="'+(X(p.x)+19)+'" y="'+(Y(p.h)-29)+'" fill="#f8fffa" font-size="21" font-weight="700">'+letter+'</text>');
  }
  let point=null;
  if(option.kind==='move')point={x:option.t.endX,h:option.t.endH};
  if(option.kind==='teleport')point={x:option.t.landingX,h:option.t.landingHeight};
  if(point){
   const start=m.spawns.player;
   svg.push('<path d="M '+X(start.x)+' '+Y(start.h)+' L '+X(point.x)+' '+Y(point.h)+'" fill="none" stroke="#88def7" stroke-width="3" stroke-dasharray="7 7"/>');
   svg.push('<circle cx="'+X(point.x)+'" cy="'+(Y(point.h)-20)+'" r="13" fill="#6bddf2" stroke="#173844" stroke-width="3"/>');
   svg.push('<text x="'+(X(point.x)+16)+'" y="'+(Y(point.h)-29)+'" fill="#baf4ff" font-size="21" font-weight="700">P’</text>');
  }
  const pts=PATHS[option.key]||[];
  if(pts.length>1)svg.push('<polyline points="'+pts.map(q=>q.join(',')).join(' ')+'" stroke="#ffda83" stroke-width="5" stroke-linejoin="round" stroke-dasharray="9 5" fill="none"/>');
  svg.push('</svg>');$('graphic').innerHTML=svg.join('');
  if(option.kind==='none')$('selection').textContent='射点開拓型：この位置からの通常弾は粗探索で0/144。移動先かテレポート先を選んでください。';
  else $('selection').textContent='この経路で有効打を確認：角'+option.hit.angle+'°・出力'+option.hit.power+'。'+(option.hit.effects?.length?'作用ギミック：'+option.hit.effects.join('／'):'ギミック作用のない経路、または転移後の追撃。');
 }
 draw(m,v,routeList.find(x=>x.kind==='move')||routeList.find(x=>x.kind==='init')||routeList[0],Math.max(0,routeList.findIndex(x=>x.kind==='move')));
}
MAPS.forEach((m,i)=>{let b=document.createElement('button');b.textContent=String(m.stage).padStart(3,'0');b.onclick=()=>stage(i);$('stages').appendChild(b)});stage(0);
</script></body></html>
