<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760" font-family="Noto Sans CJK JP, sans-serif"><title>ARCLINE 75 地形骨格ラフ 2案</title><desc>Phase 1。Aは吊荷足場の保持と喪失、Bは吊荷ゲートの保持と開路。縮尺と座標はラフの作図用。点線は攻略構想であり、実弾道や着地の記録ではない。</desc><defs><marker id="arrow-7fe0c4" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10" fill="#7fe0c4"/></marker><marker id="arrow-f1c574" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10" fill="#f1c574"/></marker><marker id="arrow-aab9ff" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto-start-reverse"><path d="M0,0 L9,5 L0,10" fill="#aab9ff"/></marker></defs><rect width="100%" height="100%" fill="#101e2a"/><text x="52" y="61" font-size="37" fill="#edf2e9" font-weight="700" text-anchor="start">ARCLINE 75   地形と攻略のラフ 2案</text><text x="54" y="102" font-size="20" fill="#aec0c5" font-weight="400" text-anchor="start">2026年11月6日  •  破壊仕様の前提を訂正・両案再検討  •  ゲーム互換データ化前</text><rect x="28" y="136" width="1544" height="760" rx="16" fill="#142735" stroke="#425861"/><text x="56" y="182" font-size="30" fill="#edf2e9" font-weight="700" text-anchor="start">A   吊荷を足場にする裂谷</text><text x="56" y="218" font-size="20" fill="#aec0c5" font-weight="400" text-anchor="start">壊せば射界は開く。しかし、接近するための足場は戻らない。</text><g transform="translate(58,248) scale(.68)"><polygon points="0,490 160,490 240,475 315,492 375,528 435,560 530,575 630,570 670,590 690,760 690,800 0,800" fill="#3f5754" stroke="#b4c6ad" stroke-width="3" stroke-linejoin="round" /><polygon points="1090,800 1090,685 1140,615 1210,555 1260,530 1350,530 1450,545 1540,540 1600,550 1600,800" fill="#3f5754" stroke="#b4c6ad" stroke-width="3" stroke-linejoin="round" /><polygon points="435,560 450,230 495,230 535,575" fill="#688795" stroke="#c4d5da" stroke-width="3" stroke-linejoin="round" /><polygon points="335,220 497,195 1080,281 1075,321 495,250 335,270" fill="#688795" stroke="#c4d5da" stroke-width="3" stroke-linejoin="round" /><path d="M 1060 319 L 1060 365" fill="none" stroke="#c4d5da" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 490 194 L 490 145 L 1075 281" fill="none" stroke="#c4d5da" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="850,410 885,365 1210,365 1210,500 1150,550 970,580 870,530" fill="#a87847" stroke="#f2c985" stroke-width="3" stroke-linejoin="round" /><path d="M 888 455 L 958 431 L 1041 449 M 990 525 L 1118 487" fill="none" stroke="#f2c985" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1090" cy="365" r="80" fill="#aab9ff" fill-opacity=".055" stroke="#aab9ff" stroke-width="2.5" stroke-dasharray="8 10"/><text x="1090" y="360" font-size="32" fill="#aab9ff" font-weight="700" text-anchor="middle">M</text><text x="1090" y="394" font-size="21" fill="#aab9ff" font-weight="400" text-anchor="middle">既存磁場</text><path d="M 180 448 C 385 18 1275 0 1180 325" fill="none" stroke="#7fe0c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 13" marker-end="url(#arrow-7fe0c4)"/><path d="M 1196 325 Q 1255 364 1314 482" fill="none" stroke="#f1c574" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 12" marker-end="url(#arrow-f1c574)"/><path d="M 620 530 C 800 500 940 450 1090 365 Q 1210 430 1312 486" fill="none" stroke="#aab9ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 12" marker-end="url(#arrow-aab9ff)"/><path d="M 790 529 L 849 518" fill="none" stroke="#f2c985" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="775" y="575" font-size="23" fill="#aab9ff" font-weight="700" text-anchor="end">破壊後の射撃帯</text><circle cx="180" cy="455" r="13" fill="#101e2a" stroke="#7fe0c4" stroke-width="4"/><path d="M 166 490 H 194" fill="none" stroke="#7fe0c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="200" y="439" font-size="25" fill="#7fe0c4" font-weight="700" text-anchor="start">P0</text><circle cx="620" cy="539" r="13" fill="#101e2a" stroke="#7fe0c4" stroke-width="4"/><path d="M 606 574 H 634" fill="none" stroke="#7fe0c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="523" font-size="25" fill="#7fe0c4" font-weight="700" text-anchor="end">恒久縁</text><circle cx="1180" cy="330" r="13" fill="#101e2a" stroke="#f2c985" stroke-width="4"/><path d="M 1166 365 H 1194" fill="none" stroke="#f2c985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1200" y="314" font-size="25" fill="#f2c985" font-weight="700" text-anchor="start">接近足場</text><ellipse cx="1360" cy="506" rx="35" ry="26" fill="#ed9b8b" opacity=".85"/><circle cx="1326" cy="490" r="18" fill="#101e2a" stroke="#ed9b8b" stroke-width="4"/><path d="M 1326 490 L 1405 420" fill="none" stroke="#ed9b8b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1405" y="405" font-size="24" fill="#ed9b8b" font-weight="700" text-anchor="middle">マグネットアーム</text><text x="1410" y="505" font-size="25" fill="#ed9b8b" font-weight="700" text-anchor="start">中ボス</text><text x="340" y="110" font-size="25" fill="#c4d5da" font-weight="700" text-anchor="start">左岸に根を持つ単一デリック</text><path d="M 470 122 L 482 188" fill="none" stroke="#c4d5da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="990" y="651" font-size="25" fill="#f2c985" font-weight="700" text-anchor="middle">D 破壊単位は要再設計</text><text x="990" y="688" font-size="23" fill="#f2c985" font-weight="400" text-anchor="middle">壊すと接近足場も失う</text><path d="M 990 617 L 990 577" fill="none" stroke="#f2c985" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="430" y="730" font-size="23" fill="#aec0c5" font-weight="400" text-anchor="start">恒久足場は裂谷を渡らない</text><text x="1220" y="735" font-size="23" fill="#aec0c5" font-weight="400" text-anchor="start">右岸は別の採掘段丘</text></g><path d="M 1168 244 V 839" fill="none" stroke="#425861" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1193" y="261" font-size="20" fill="#f2c985" font-weight="700" text-anchor="start">発見</text><text x="1193" y="295" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">吊荷は障害物であり、</text><text x="1193" y="324" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">同時にボスへ近づく足場。</text><text x="1193" y="383" font-size="20" fill="#7fe0c4" font-weight="700" text-anchor="start">主攻略  温存して接近</text><text x="1193" y="417" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">吊荷上へ転移して腕を狙う。</text><text x="1193" y="446" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">短い射撃距離を得る。</text><text x="1193" y="475" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">荷の上では退避幅が限られる。</text><text x="1193" y="534" font-size="20" fill="#aab9ff" font-weight="700" text-anchor="start">別解  破壊して遠射</text><text x="1193" y="568" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">恒久縁から吊荷を壊す。</text><text x="1193" y="597" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">Mを通す射撃帯を広げる。</text><text x="1193" y="626" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">接近足場を手放し、遠射を選ぶ。</text><text x="1193" y="685" font-size="20" fill="#f2c985" font-weight="700" text-anchor="start">Aの核</text><text x="1193" y="719" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">破壊が移動の選択肢を減らす。</text><text x="1193" y="748" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">高さより、不可逆の判断が主題。</text><text x="58" y="849" font-size="18" fill="#c4d5da" font-weight="700" text-anchor="start">固定支持体</text><text x="210" y="849" font-size="18" fill="#f2c985" font-weight="700" text-anchor="start">D 独立破壊</text><text x="380" y="849" font-size="18" fill="#7fe0c4" font-weight="400" text-anchor="start">破線：移動の構想</text><text x="625" y="849" font-size="18" fill="#f1c574" font-weight="400" text-anchor="start">点線：射撃方向の構想</text><text x="58" y="879" font-size="17" fill="#aec0c5" font-weight="400" text-anchor="start">ラフの模式図。支持・空間を目視確認。転移・砲身・弾道・磁場・反撃の成立は未検証。</text><rect x="28" y="934" width="1544" height="760" rx="16" fill="#142735" stroke="#425861"/><text x="56" y="980" font-size="30" fill="#edf2e9" font-weight="700" text-anchor="start">B   低い吊荷で閉じる搬出路</text><text x="56" y="1016" font-size="20" fill="#aec0c5" font-weight="400" text-anchor="start">荷を残して上空から狙うか、壊して斜坑への歩行路を開けるか。</text><g transform="translate(58,1046) scale(.68)"><polygon points="0,250 150,250 240,240 320,255 430,320 520,300 600,280 680,315 760,365 840,420 940,485 1080,560 1180,595 1390,595 1480,580 1600,590 1600,800 0,800" fill="#3f5754" stroke="#b4c6ad" stroke-width="3" stroke-linejoin="round" /><polygon points="601,280 615,105 657,105 676,314" fill="#688795" stroke="#c4d5da" stroke-width="3" stroke-linejoin="round" /><polygon points="580,90 656,80 910,110 907,145 651,125 580,130" fill="#688795" stroke="#c4d5da" stroke-width="3" stroke-linejoin="round" /><path d="M 850 139 L 850 290" fill="none" stroke="#c4d5da" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 647 80 L 647 46 L 906 110" fill="none" stroke="#c4d5da" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="795,315 850,290 935,330 935,463 897,445 851,414 805,385" fill="#a87847" stroke="#f2c985" stroke-width="3" stroke-linejoin="round" /><path d="M 825 350 L 877 333 L 912 365 M 857 388 L 906 405" fill="none" stroke="#f2c985" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="1060" cy="175" r="107" fill="#aab9ff" fill-opacity=".055" stroke="#aab9ff" stroke-width="2.5" stroke-dasharray="8 10"/><text x="1060" y="170" font-size="32" fill="#aab9ff" font-weight="700" text-anchor="middle">M</text><text x="1060" y="204" font-size="21" fill="#aab9ff" font-weight="400" text-anchor="middle">既存磁場</text><path d="M 530 260 C 553 -12 831 -30 996 126 Q 1153 237 1289 544" fill="none" stroke="#f1c574" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 12" marker-end="url(#arrow-f1c574)"/><path d="M 815 397 L 853 421 L 900 453 L 970 495 L 1090 552 L 1180 582" fill="none" stroke="#7fe0c4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 13" marker-end="url(#arrow-7fe0c4)"/><path d="M 1197 550 L 1289 554" fill="none" stroke="#f1c574" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 12" marker-end="url(#arrow-f1c574)"/><text x="1065" y="689" font-size="25" fill="#7fe0c4" font-weight="700" text-anchor="middle">破壊後は搬出路を徒歩で下る</text><path d="M 1035 653 L 1048 554" fill="none" stroke="#7fe0c4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="415" cy="276" r="13" fill="#101e2a" stroke="#7fe0c4" stroke-width="4"/><path d="M 401 311 H 429" fill="none" stroke="#7fe0c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="395" y="260" font-size="25" fill="#7fe0c4" font-weight="700" text-anchor="end">P0</text><circle cx="530" cy="262" r="13" fill="#101e2a" stroke="#7fe0c4" stroke-width="4"/><path d="M 516 297 H 544" fill="none" stroke="#7fe0c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="510" y="246" font-size="25" fill="#7fe0c4" font-weight="700" text-anchor="end">外側の肩</text><circle cx="1180" cy="560" r="13" fill="#101e2a" stroke="#7fe0c4" stroke-width="4"/><path d="M 1166 595 H 1194" fill="none" stroke="#7fe0c4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1160" y="544" font-size="25" fill="#7fe0c4" font-weight="700" text-anchor="end">接近先</text><ellipse cx="1335" cy="571" rx="35" ry="26" fill="#ed9b8b" opacity=".85"/><circle cx="1301" cy="555" r="18" fill="#101e2a" stroke="#ed9b8b" stroke-width="4"/><path d="M 1301 555 L 1380 485" fill="none" stroke="#ed9b8b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="1380" y="470" font-size="24" fill="#ed9b8b" font-weight="700" text-anchor="middle">マグネットアーム</text><text x="1385" y="570" font-size="25" fill="#ed9b8b" font-weight="700" text-anchor="start">中ボス</text><text x="242" y="64" font-size="25" fill="#c4d5da" font-weight="700" text-anchor="start">固定巻上げ機</text><path d="M 460 72 L 614 111" fill="none" stroke="#c4d5da" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="920" y="39" font-size="24" fill="#f1c574" font-weight="700" text-anchor="start">上空を回す射撃</text><text x="986" y="365" font-size="25" fill="#f2c985" font-weight="700" text-anchor="start">D 低く吊った鉱石</text><text x="986" y="402" font-size="23" fill="#f2c985" font-weight="400" text-anchor="start">残す：搬出路の遮蔽</text><text x="986" y="439" font-size="23" fill="#7fe0c4" font-weight="400" text-anchor="start">壊す：歩く空間を開ける</text><path d="M 977 379 L 940 380" fill="none" stroke="#f2c985" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="260" y="660" font-size="25" fill="#aec0c5" font-weight="400" text-anchor="start">岩盤の肩から切羽へ下る一本の搬出路</text><text x="260" y="701" font-size="23" fill="#aec0c5" font-weight="400" text-anchor="start">柱を越える準備転移は別途必要</text></g><path d="M 1168 1042 V 1637" fill="none" stroke="#425861" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="1193" y="1059" font-size="20" fill="#f2c985" font-weight="700" text-anchor="start">発見</text><text x="1193" y="1093" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">吊荷を壊すと射界だけでなく、</text><text x="1193" y="1122" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">切羽へ下る歩く空間が増える。</text><text x="1193" y="1181" font-size="20" fill="#f1c574" font-weight="700" text-anchor="start">主攻略  温存して曲射</text><text x="1193" y="1215" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">外側の肩から設備の上を越し、</text><text x="1193" y="1244" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">Mを通して腕を狙う。</text><text x="1193" y="1273" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">荷による遮蔽を残す。</text><text x="1193" y="1332" font-size="20" fill="#7fe0c4" font-weight="700" text-anchor="start">別解  破壊して降下</text><text x="1193" y="1366" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">柱の向こうへ準備転移し、</text><text x="1193" y="1395" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">開けた搬出路を歩いて接近。</text><text x="1193" y="1424" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">遮蔽を失い、反撃を受けやすい。</text><text x="1193" y="1483" font-size="20" fill="#f2c985" font-weight="700" text-anchor="start">Bの核</text><text x="1193" y="1517" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">破壊が移動の選択肢を増やす。</text><text x="1193" y="1546" font-size="18" fill="#edf2e9" font-weight="400" text-anchor="start">曲射の調整か、開路と前進か。</text><text x="58" y="1647" font-size="18" fill="#c4d5da" font-weight="700" text-anchor="start">固定支持体</text><text x="210" y="1647" font-size="18" fill="#f2c985" font-weight="700" text-anchor="start">D 独立破壊</text><text x="380" y="1647" font-size="18" fill="#7fe0c4" font-weight="400" text-anchor="start">破線：移動の構想</text><text x="625" y="1647" font-size="18" fill="#f1c574" font-weight="400" text-anchor="start">点線：射撃方向の構想</text><text x="58" y="1677" font-size="17" fill="#aec0c5" font-weight="400" text-anchor="start">ラフの模式図。支持・空間を目視確認。転移・砲身・弾道・磁場・反撃の成立は未検証。</text><text x="54" y="1731" font-size="20" fill="#aec0c5" font-weight="400" text-anchor="start">前提訂正：広い荷の1撃全体消去は未成立。両案は再検討。吊荷の移動・落下・連鎖崩壊は追加しない。</text></svg>