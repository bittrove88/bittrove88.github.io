<rect width="100%" height="100%" fill="#0c1424"/><g font-family='"Noto Sans CJK JP", "Noto Sans JP", sans-serif'><text x="37.00" y="43.00" font-size="29" fill="#e8eef9" font-weight="700">75面A：元ラフと、修正版のDあり／Dなし</text><text x="38.00" y="77.00" font-size="17" fill="#a6b5cf" font-weight="400">すべて同じ縮尺。Dを除去しても床・天井・P0・敵・Mの位置は同一。赤点線は弾道ではなく比較用の直線。</text><rect x="24" y="105" width="1552" height="601" rx="15" fill="#121f33" stroke="#2e415d"/><text x="47.00" y="141.00" font-size="25" fill="#e8eef9" font-weight="700">元ラフA r2｜履歴</text><polygon points="270.00,458.40 334.80,463.80 388.80,469.20 442.80,480.00 507.60,490.80 577.80,501.60 642.60,512.40 702.00,517.80 793.80,517.80 901.80,517.80 1004.40,517.80 1036.80,517.80 1058.40,496.20 1107.00,469.20 1134.00,458.40 1134.00,647.40 270.00,647.40" fill="#343e5b" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="270.00,458.40 334.80,463.80 388.80,469.20 442.80,480.00 507.60,490.80 577.80,501.60 642.60,512.40 702.00,517.80 793.80,517.80 901.80,517.80 1004.40,517.80 1036.80,517.80 1058.40,496.20 1107.00,469.20 1134.00,458.40" fill="none" stroke="#b7b7df" stroke-width="1.5"/><circle cx="610.20" cy="361.20" r="86.40" fill="#b69bea" fill-opacity=".10" stroke="#bba3ec" stroke-width="1.4" stroke-dasharray="6 5"/><text x="602.20" y="367.20" font-size="18" fill="#c7b0ef" font-weight="700">M</text><polygon points="680.40,264.00 729.00,237.00 810.00,220.80 912.60,226.20 1009.80,253.20 1085.40,285.60 1134.00,312.60 1134.00,458.40 1107.00,469.20 1058.40,496.20 1036.80,517.80 1026.00,426.00 999.00,350.40 934.20,323.40 847.80,307.20 761.40,312.60 707.40,318.00 680.40,323.40" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="804.60,517.80 847.80,517.80 847.80,436.80 831.60,415.20 810.00,426.00" fill="url(#ore)" stroke="#f7c388" stroke-width="1.5" stroke-linejoin="round"/><polyline points="367.20,461.64 507.60,485.40 642.60,507.00 756.00,512.40" fill="none" stroke="#c1cedf" stroke-width