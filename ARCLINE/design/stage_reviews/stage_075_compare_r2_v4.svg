ts="367.20,1072.84 932.04,1118.20" fill="none" stroke="#ee8f9c" stroke-width="1.8" stroke-dasharray="3 5" opacity=".78"/><rect x="25" y="1277" width="1550" height="40" fill="#121f33"/><text x="48.00" y="1306.00" font-size="18" fill="#e8eef9" font-weight="400">固定岩肩が坑外の直射を遮る。DはCの前方にある一時防御。破壊は不要。</text><rect x="24" y="1349" width="1552" height="601" rx="15" fill="#121f33" stroke="#2e415d"/><text x="47.00" y="1385.00" font-size="25" fill="#e8eef9" font-weight="700">修正版A v4｜Dをすべて除去</text><polygon points="270.00,1702.40 334.80,1707.80 388.80,1713.20 453.60,1702.40 518.40,1680.80 588.60,1653.80 653.40,1632.20 712.80,1664.60 777.60,1707.80 842.40,1751.00 880.20,1761.80 1004.40,1761.80 1036.80,1761.80 1058.40,1740.20 1107.00,1713.20 1134.00,1702.40 1134.00,1891.40 270.00,1891.40" fill="#343e5b" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="270.00,1702.40 334.80,1707.80 388.80,1713.20 453.60,1702.40 518.40,1680.80 588.60,1653.80 653.40,1632.20 712.80,1664.60 777.60,1707.80 842.40,1751.00 880.20,1761.80 1004.40,1761.80 1036.80,1761.80 1058.40,1740.20 1107.00,1713.20 1134.00,1702.40" fill="none" stroke="#b7b7df" stroke-width="1.5"/><circle cx="610.20" cy="1562.00" r="86.40" fill="#b69bea" fill-opacity=".10" stroke="#bba3ec" stroke-width="1.4" stroke-dasharray="6 5"/><text x="602.20" y="1568.00" font-size="18" fill="#c7b0ef" font-weight="700">M</text><polygon points="680.40,1481.00 729.00,1454.00 810.00,1437.80 912.60,1454.00 1009.80,1491.80 1085.40,1529.60 1134.00,1556.60 1134.00,1702.40 1107.00,1713.20 1058.40,1740.20 1036.80,1761.80 1026.00,1670.00 999.00,1594.40 934.20,1567.40 847.80,1540.40 761.40,1535.00 707.40,1535.00 680.40,1540.40" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polyline points="367.20,1705.64 453.60,1697.00 518.40,1675.40 588.60,1648.40 653.40,1626.80 712.80,1659.20 788.40,1709.60" fill="none" stroke="#c1cedf" stroke-width="1.6" stroke-dasharray="2 7"/><polyline points="788.40,1698.80 837.00,1632.20 885.60,1659.20 932.04,1740.20" fill="none" stroke="#83e9c7" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#mainArrow)" stroke-linejoin="round"/><polyline points="529.20,1660.45 577.80,1562.00 626.40,1529.60 680.40,1556.60 745.20,1594.40 820.80,1648.40 880.20,1691.60 932.04,1740.20" fill="none" stroke="#a5bcff" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#altArrow)" stroke-linejoin="round"/><rect x="355.32" y="1692.14" width="23.76" height="14.58" rx="3" fill="#28564f" stroke="#75e0c4" stroke-width="1.7"/><polyline points="354.78,1708.88 379.62,1708.88" stroke="#75e0c4" stroke-width="3"/><ellipse cx="950.40" cy="1748.84" rx="18.90" ry="14.04" fill="#623c50" stroke="#ff8e94" stroke-width="2"/><line x1="950.4000000000001" y1="1751.0" x2="932.0400000000001" y2="1740.2" stroke="#ff8e94" stroke-width="3"/><circle cx="932.0400000000001" cy="1740.2" r="9.72" fill="#ffdb99" stroke="#f29a79" stroke-width="1.4"/><polyline points="367.20,1694.84 932.04,1740.20" fill="none" stroke="#ee8f9c" stroke-width="1.8" stroke-dasharray="3 5" opacity=".78"/><rect x="25" y="1899" width="1550" height="40" fill="#121f33"/><text x="48.00" y="1928.00" font-size="18" fill="#e8eef9" font-weight="400">岩肩・天井・坑口は残る。Dがなくても、P0/Rから敵への代表直線は固定床が遮る。</text><text x="40.00" y="2018.00" font-size="18" fill="#e8eef9" font-weight="400">Dの有無は防御の持続を変える。坑外から攻める際の固定地形の課題と、坑内への接近判断は消えない。</text></g></svg>
