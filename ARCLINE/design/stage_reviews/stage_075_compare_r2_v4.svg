<title id="title">75面A 元ラフと詳細設計DありDなしの同縮尺比較</title><desc id="desc">75面A案の詳細設計図。固定地形と一時防御ブロックの役割を示す。破線は模式線で、実弾道・通行・勝利の検証結果ではない。</desc>
