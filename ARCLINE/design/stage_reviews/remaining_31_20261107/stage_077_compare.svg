<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">77：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1090"><title>制御回廊と砲座の裏側</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 77｜制御回廊と砲座の裏側</text><text x="38" y="83" font-size="19" fill="#afc2d2">低い制御室でWとMを使うか、砲座の右裏へ渡って左向きに攻める。</text><polygon points="70,724.0963855421686 791.2048192771084,724.0963855421686 967.1084337349397,680.1204819277108 1125.421686746988,636.144578313253 1283.734939759036,636.144578313253 1283.734939759036,864.8192771084337 70,864.8192771084337" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,724.0963855421686 791.2048192771084,724.0963855421686 967.1084337349397,680.1204819277108 1125.421686746988,636.144578313253 1283.734939759036,636.144578313253" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,398.6746987951807 272.28915662650604,389.8795180722891 483.37349397590356,407.4698795180722 483.37349397590356,460.2409638554216 369.0361445783132,504.21686746987945 245.9036144578313,530.6024096385541 70,513.0120481927711" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="483.37349397590356,724.0963855421686 676.867469879518,724.0963855421686 676.867469879518,460.2409638554216 483.37349397590356,460.2409638554216" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><polyline points="547.871485943775,724.0963855421686 547.871485943775,460.2409638554216" fill="none" stroke="#dec7a2" stroke-width="1" stroke-dasharray="3 3"/><polyline points="612.3694779116465,724.0963855421686 612.3694779116465,460.2409638554216" fill="none" stroke="#dec7a2" stroke-width="1" stroke-dasharray="3 3"/><text x="551.1204819277108" y="592.