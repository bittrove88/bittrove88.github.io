e points="738.433734939759,724.0963855421686 843.9759036144578,697.7108433734938" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="281.0843373493976" cy="704.7469879518071" rx="21.987951807228914" ry="21.10843373493976" fill="#74dec4"/><text x="271.0843373493976" y="673.6385542168674" font-size="18" fill="#74dec4">P0</text><ellipse cx="1169.3975903614457" cy="300.16867469879514" rx="27.26506024096385" ry="25.506024096385538" fill="#ff9bad"/><text x="1159.3975903614457" y="264.6626506024096" font-size="18" fill="#ff9bad">E</text><text x="38" y="906.8192771084337" font-size="17" fill="#dae5ed">上棚からの高弧だけの別解をやめ、敵砲座の反対側に開放した裏手を作った。</text><text x="38" y="943.8192771084337" font-size="17" fill="#dae5ed">反射準備を残して低所に留まるか、敵の反対側まで転移するかを比較。74面の鉱床上面へ上る別解は繰り返さない。</text><text x="38" y="980.8192771084337" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1017.8192771084337" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1090"><title>制御回廊と砲座の裏側</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 77｜制御回廊と砲座の裏側</text><text x="38" y="83" font-size="19" fill="#afc2d2">低い制御室でWとMを使うか、砲座の右裏へ渡って左向きに攻める。</text><polygon points="70,724.0963855421686 738.433734939759,724.0963855421686 843.9759036144578,697.7108433734938 967.1084337349397,680.1204819277108 1125.421686746988,636.144578313253 1529.9999999999998,636.144578313253 1529.9999999999998,864.8192771084337 70,864.8192771084337" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,724.0963855421686 738.433734939759,724.0963855421686 843.9759036144578,697.7108433734938 967.1084337349397,680.1204819277108 1125.421686746988,636.144578313253 1529.9999999999998,636.144578313253" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dash