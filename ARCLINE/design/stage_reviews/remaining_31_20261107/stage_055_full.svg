<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1151" viewBox="0 0 1600 1151" role="img"><title>観測センサーを見上げる三段要塞</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 55｜観測センサーを見上げる三段要塞</text><text x="38" y="83" font-size="19" fill="#afc2d2">上段から高いセンサー、中段から装甲の縁、下段から側方の開口を狙う。</text><polygon points="70,573.6470588235295 190.23529411764707,530.7058823529412 327.6470588235294,530.7058823529412 396.35294117647055,462 447.88235294117646,401.8823529411765 516.5882352941176,401.8823529411765 628.2352941176471,504.9411764705883 731.2941176470588,642.3529411764706 825.7647058823529,719.6470588235294 946,719.6470588235294 1049.0588235294117,702.4705882352941 1152.1176470588234,702.4705882352941 1255.1764705882354,668.1176470588235 1401.1764705882351,642.3529411764706 1530,642.3529411764706 1530,925.7647058823529 70,925.7647058823529" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,573.6470588235295 190.23529411764707,530.7058823529412 327.6470588235294,530.7058823529412 396.35294117647055,462 447.88235294117646,401.8823529411765 516.5882352941176,401.8823529411765 628.2352941176471,504.9411764705883 731.2941176470588,642.3529411764706 825.7647058823529,719.6470588235294 946,719.6470588235294 1049.0588235294117,702.4705882352941 1152.1176470588234,702.4705882352941 1255.1764705882354,668.1176470588235 1401.1764705882351,642.3529411764706 1530,642.3529411764706" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="808.5882352941176,565.0588235294117 877.2941176470588,513.5294117647059 1023.2941176470588,513.5294117647059 1066.235294117647,556.4705882352941 1014.7058823529411,599.4117647058824 885.8823529411765,608" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1169.2941176470588,384.7058823529412 1220.8235294117646,341.7647058823529 1366.8235294117646,341.7647058823529 1426.9411764705