05882354" fill="#74dec4"/><text x="472.2352941176471" y="352.37647058823535" font-size="18" fill="#74dec4">P0</text><ellipse cx="1280.9411764705883" cy="321.15294117647056" rx="30.05882352941176" ry="22.32941176470588" fill="#ff9bad"/><circle cx="1299.8352941176472" cy="273.9176470588235" r="13.741176470588234" fill="#f1c7d5" stroke="#fff0f3" stroke-width="1.5"/><text x="1270.9411764705883" y="288.8235294117647" font-size="18" fill="#ff9bad">E</text><text x="38" y="967.7647058823529" font-size="17" fill="#dae5ed">開始を山肩へ移して不要な左大庇を削除。中段観測塔の遮風板と、基盤横の射出口を分けた。</text><text x="38" y="1004.7647058823529" font-size="17" fill="#dae5ed">一つの既存観測センサーと前面装甲への角度選択。架空の複数部位を足さない。</text><text x="38" y="1041.764705882353" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1078.764705882353" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>