<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">68：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1192"><title>噴出の横穴と短い反射蓋</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 68｜噴出の横穴と短い反射蓋</text><text x="38" y="83" font-size="19" fill="#afc2d2">常設の下側横穴を進んで噴出口から送るか、上の一片を開いてWで短く返す。</text><polygon points="70,814.6753246753248 809.4805194805195,814.6753246753248 932.7272727272727,691.4285714285714 1131.818181818182,511.29870129870136 1435.1948051948052,511.29870129870136 1435.1948051948052,966.3636363636365 70,966.3636363636365" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,814.6753246753248 809.4805194805195,814.6753246753248 932.7272727272727,691.4285714285714 1131.818181818182,511.29870129870136 1435.1948051948052,511.29870129870136" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,501.81818181818187 401.81818181818187,473.3766233766234 619.8701298701299,530.2597402597403 619.8701298701299,625.0649350649351 325.974025974026,644.025974025974 70,634.5454545454546" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="619.8701298701299,814.6753246753248 695.7142857142858,814.6753246753248 695.7142857142858,615.5844155844156 619.8701298701299,625.0649350649351" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="628.7922077922078" y="715.1298701298701" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="762.0779220779222,435.4545454545455 923.2467532467533,435.4545454545455 923.2467532467533,492.3376623376624 762.0779220779222,492.3376623376624" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="923.2467532467533,435.4545454545455 1018.0519480519481,435.4545454545455 1018.0519480519481,492.3376623376624 923.2467532467533,492.3376623376624" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="941.6493506493507" y="463.8961038961039" font-size="15" fill="#ffe0ac">D04 1片</text><polygon points="1018.0519480519481,435.4545454545455 1084.4155844155844,435.4545454545455 1084.4155844155844,492.3376623376624 1018.0519480519481,492.3376623376624" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="762.0779220779222,814.6753246753248 856.8831168831169,795.7142857142858 856.8831168831169,824.1558441558442 762.0779220779222,824.1558441558442" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><rect x="771.5584415584416" y="501.81818181818187" width="132.72727272727275" height="170.64935064935065" fill="#e3a276" fill-opacity=".04" stroke="#88909c" stroke-dasharray="6 5"/><text x="777.5584415584416" y="524.8181818181819" font-size="18" fill="#e3a276">V OFF</text><polyline points="724.1558441558442,814.6753246753248 809.4805194805195,814.6753246753248" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="809.4805194805195,814.6753246753248 856.8831168831169,767.2727272727274" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="762.0779220779222,435.4545454545455 856.8831168831169,435.4545454545455" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="762.0779220779222,814.6753246753248 856.8831168831169,795.7142857142858" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="297.53246753246754" cy="793.8181818181819" rx="23.701298701298704" ry="22.753246753246753" fill="#74dec4"/><text x="287.53246753246754" y="761.0649350649352" font-size="18" fill="#74dec4">P0</text><ellipse cx="1283.5064935064936" cy="490.4415584415585" rx="29.38961038961039" ry="27.493506493506494" fill="#ff9bad"/><text x="1273.5064935064936" y="452.948051948052" font-size="18" fill="#ff9bad">E</text><text x="38" y="1008.3636363636365" font-size="17" fill="#dae5ed">加熱壁を常設横穴へ変更。Wを地盤自身の斜面にまとめ、反射蓋の破壊を任意の短縮にした。</text><text x="38" y="1045.3636363636365" font-size="17" fill="#dae5ed">一つの噴出周期と、準備を省く反射蓋の選択。二枚隔壁や並行トンネルの反復にしない。</text><text x="38" y="1082.3636363636365" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1119.3636363636365" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1192"><title>噴出の横穴と短い反射蓋</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 68｜噴出の横穴と短い反射蓋</text><text x="38" y="83" font-size="19" fill="#afc2d2">常設の下側横穴を進んで噴出口から送るか、上の一片を開いてWで短く返す。</text><polygon points="70,814.6753246753248 762.0779220779222,814.6753246753248 856.8831168831169,757.7922077922078 951.6883116883117,738.831168831169 1188.7012987012988,738.831168831169 1264.5454545454547,511.29870129870136 1530,511.29870129870136 1530,966.3636363636365 70,966.3636363636365" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,814.6753246753248 762.0779220779222,814.6753246753248 856.8831168831169,757.7922077922078 951.6883116883117,738.831168831169 1188.7012987012988,738.831168831169 1264.5454545454547,511.29870129870136 1530,511.29870129870136" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,501.81818181818187 259.61038961038963,473.3766233766234 411.2987012987013,530.2597402597403 411.2987012987013,625.0649350649351 259.61038961038963,644.025974025974 70,634.5454545454546" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="885.3246753246754,331.16883116883116 961.1688311688313,331.16883116883116 961.1688311688313,444.935064935065 885.3246753246754,444.935064935065" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="961.1688311688313,331.168