<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">64：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1271"><title>崖下盆地の裏へ回る</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 64｜崖下盆地の裏へ回る</text><text x="38" y="83" font-size="19" fill="#afc2d2">上から開口へ落とすか、盆地の右裏へ回って左向きに低く送る。</text><polygon points="70,170 424.57142857142856,170 528.8571428571429,232.57142857142856 539.2857142857142,837.4285714285714 758.2857142857143,858.2857142857143 925.1428571428571,806.1428571428571 1112.857142857143,806.1428571428571 1238,754 1238,1046 70,1046" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,170 424.57142857142856,170 528.8571428571429,232.57142857142856 539.2857142857142,837.4285714285714 758.2857142857143,858.2857142857143 925.1428571428571,806.1428571428571 1112.857142857143,806.1428571428571 1238,754" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="591.4285714285714,566.2857142857142 643.5714285714286,514.1428571428571 789.5714285714286,514.1428571428571 831.2857142857143,555.8571428571429 758.2857142857143,608 654,608" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="987.7142857142858,493.2857142857143 1102.4285714285716,451.57142857142856 1238,482.8571428571429 1238,618.4285714285714 1144.142857142857,618.4285714285714 1092,587.1428571428571 987.7142857142858,566.2857142857142" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><ellipse cx="320.2857142857143" cy="147.05714285714285" rx="26.071428571428573" ry="25.02857142857143" fill="#74dec4"/><text x="310.2857142857143" y="112.02857142857142" font-size="18" fill="#74dec4">P0</text><ellipse cx="1029.4285714285716" cy="783.1999999999999" rx="32.32857142857143" ry="30.242857142857144" fill="#ff9bad"/><text x="1019.4285714285716" y="742.9571428571428" font-size="18" fill="#ff9bad">E</text><text x="38" y="1088" font-size="17" fill="#dae5ed">側棚を崖へ接続し、盆地の前稜と背面口を分ける。両射点の頭上は開放。</text><text x="38" y="1125" font-size="17" fill="#dae5ed">垂直崖の反対側へ回り、射撃方向を反転する盆地。62面の同側の山肩往復と区別。</text><text x="38" y="1162" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1199" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1271"><title>崖下盆地の裏へ回る</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 64｜崖下盆地の裏へ回る</text><text x="38" y="83" font-size="19" fill="#afc2d2">上から開口へ落とすか、盆地の右裏へ回って左向きに低く送る。</text><polygon points="70,170 424.57142857142856,170 528.8571428571429,232.57142857142856 539.2857142857142,837.4285714285714 695.7142857142858,858.2857142857143 800,858.2857142857143 893.8571428571429,587.1428571428571 956.4285714285714,587.1428571428571 1050.2857142857142,806.1428571428571 1123.2857142857142,806.1428571428571 1144.142857142857,712.2857142857142 1175.4285714285716,712.2857142857142 1206.7142857142858,806.1428571428571 1425.7142857142858,806.1428571428571 1530,764.4285714285714 1530,1046 70,1046" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,170 424.57142857142856,170 528.8571428571429,232.57142857142856 539.2857142857142,837.4285714285714 695.7142857142858,858.2857142857143 800,858.2857142857143 893.8571428571429,587.1428571428571 956.4285714285714,587.1428571428571 1050.2857142857142,806.1428571428571 1123.2857142857142,806.1428571428571 1144.142857142857,712.2857142857142 1175.4285714285716,712.2857142857142 1206.7142857142858,806.1428571428571 1425.7142857142858,806.1428571428571 1530,764.4285714285714" fill="none" stroke="#a8c8d7" s