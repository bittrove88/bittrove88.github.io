<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1490" viewBox="0 0 1600 1490" role="img"><title>風の上端と結晶の入口</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 53｜風の上端と結晶の入口</text><text x="38" y="83" font-size="19" fill="#afc2d2">高棚で風を避けるか、低棚からKと風を使う。</text><polygon points="70,890.6410256410256 201.02564102564102,806.4102564102564 303.974358974359,722.1794871794871 388.20512820512823,722.1794871794871 463.0769230769231,806.4102564102564 463.0769230769231,1265 70,1265" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,890.6410256410256 201.02564102564102,806.4102564102564 303.974358974359,722.1794871794871 388.20512820512823,722.1794871794871 463.0769230769231,806.4102564102564" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1118.2051282051282,862.5641025641025 1202.4358974358975,740.8974358974358 1258.5897435897436,609.8717948717948 1389.6153846153848,609.8717948717948 1464.4871794871797,694.1025641025641 1530,750.2564102564102 1530,1265 1118.2051282051282,1265" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1118.2051282051282,862.5641025641025 1202.4358974358975,740.8974358974358 1258.5897435897436,609.8717948717948 1389.6153846153848,609.8717948717948 1464.4871794871797,694.1025641025641 1530,750.2564102564102" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="547.3076923076924,1049.7435897435896 584.7435897435897,1002.9487179487179 715.7692307692308,1002.9487179487179 828.0769230769231,928.0769230769231 865.5128205128206,984.2307692307692 725.1282051282052,1096.5384615384614 603.4615384615385,1096.5384615384614" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="837.4358974358975,544.3589743589743 884.2307692307693,497.56410256410254 968.4615384615386,497.56410256410254 1024.6153846153848,385.25641025641016 1080.769230769231,422.6923076923076 1127.5641025641025,572.4358974358973 1080.769230769231,694.1025641025641 1015.2564102564103,628.5897435897435 949.7435897435898,581.7948717948717 893.5897435897436,581.7948717948717" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><rect x="762.5641025641027" y="628.5897435897435" width="346.2820512820513" height="327.5641025641026" fill="#7cc9db" fill-opacity=".13" stroke="#7cc9db" stroke-dasharray="6 5"/><text x="768.5641025641027" y="651.5897435897435" font-size="18" fill="#7cc9db">F</text><polyline points="777.4351262261777,899.4699755883481 822.5648737738225,806.9402808219081" fill="none" stroke="#c5e8fb" stroke-width="5" stroke-dasharray=""/><polyline points="650.2564102564103,974.8717948717948 800,853.2051282051282 809.3589743589744,291.66666666666663 1127.5641025641025,170 1342.820512820513,581.7948717948717" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="921.6666666666667,469.48717948717945 1015.2564102564103,216.7948717948717 1193.076923076923,282.30769230769226 1342.820512820513,581.7948717948717" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="650.2564102564103" cy="997.9487179487179" r="5" fill="#a4e7ee"/><text x="642.2564102564103" y="1031.9487179487178" font-size="18" fill="#a4e7ee">A</text><circle cx="921.6666666666667" cy="492.56410256410254" r="5" fill="#a4e7ee"/><text x="913.6666666666667" y="526.5641025641025" font-size="18" fill="#a4e7ee">B</text><ellipse cx="350.7692307692308" cy="701.5897435897434" rx="23.397435897435898" ry="22.461538461538463" fill="#74dec4"/><text x="340.7692307692308" y="669.128205128205" font-size="18" fill="#74dec4">P0</text><ellipse cx="1342.820512820513" cy="589.2820512820513" rx="29.012820512820515" ry="27.141025641025642" fill="#ff9bad"/><text x="1332.820512820513" y="552.1410256410255" font-size="18" fill="#ff9bad">E</text><text x="38" y="1307" font-size="17" fill="#dae5ed">敵側の尖った稜線をやめ、高棚自身の前縁とKの向きで退出空間を整理。</text><text x="38" y="1344" font-size="17" fill="#dae5ed">Kへの入射位置が主題。谷底のW反射や多島の周回ではない。</text><text x="38" y="1381" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1418" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>