roke-width="1.5"/><circle cx="1366.4096385542168" cy="488.3855421686746" r="20.2289156626506" fill="#f1c7d5" stroke="#fff0f3" stroke-width="1.5"/><text x="1317.7108433734938" y="441.44578313253004" font-size="18" fill="#ff9bad">E</text><text x="38" y="1100.313253012048" font-size="17" fill="#dae5ed">炉蓋を二片に整理し、噴出内の射点と、その外の頭上が開いた出口を分けた。</text><text x="38" y="1137.313253012048" font-size="17" fill="#dae5ed">Vの縦の通過帯と既存の左右二腕を結ぶ炉。観測センサーや磁場発生器の面とは役割を分ける。</text><text x="38" y="1174.313253012048" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1211.313253012048" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1284"><title>炉蓋の一片と二本の腕</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 70｜炉蓋の一片と二本の腕</text><text x="38" y="83" font-size="19" fill="#afc2d2">炉上から奥の腕、噴出の出口から手前の腕へ入れる角度を選ぶ。</text><polygon points="70,495.4216867469879 140.36144578313252,469.03614457831316 201.9277108433735,451.4457831325301 237.10843373493975,460.2409638554217 289.8795180722891,460.2409638554217 351.4457831325301,486.62650602409633 413.01204819277103,521.8072289156626 474.578313253012,565.7831325301204 624.0963855421686,812.0481927710842 756.0240963855421,899.9999999999999 1107.8313253012047,899.9999999999999 1178.1927710843372,715.301204819277 1230.9638554216867,521.8072289156626 1529.9999999999998,521.8072289156626 1529.9999999999998,1058.313253012048 70,1058.313253012048" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,495.4216867469879 140.36144578313252,469.03614457831316 201.9277108433735,451.4457831325301 237.10843373493975,460.2409638554217 289.8795180722891,460.2409638554217 351.4457831325301,486.62650602409633 413.01204819277103,521.8072289156626 474.578313253012,565.7831325301204 624.0963855421686,812.04819