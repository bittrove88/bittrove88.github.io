<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1192" viewBox="0 0 1600 1192" role="img"><title>噴出の横穴と短い反射蓋</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 68｜噴出の横穴と短い反射蓋</text><text x="38" y="83" font-size="19" fill="#afc2d2">常設の下側横穴を進んで噴出口から送るか、上の一片を開いてWで短く返す。</text><polygon points="70,814.6753246753248 762.0779220779222,814.6753246753248 856.8831168831169,757.7922077922078 951.6883116883117,738.831168831169 1188.7012987012988,738.831168831169 1264.5454545454547,511.29870129870136 1530,511.29870129870136 1530,966.3636363636365 70,966.3636363636365" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,814.6753246753248 762.0779220779222,814.6753246753248 856.8831168831169,757.7922077922078 951.6883116883117,738.831168831169 1188.7012987012988,738.831168831169 1264.5454545454547,511.29870129870136 1530,511.29870129870136" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,501.81818181818187 259.61038961038963,473.3766233766234 411.2987012987013,530.2597402597403 411.2987012987013,625.0649350649351 259.61038961038963,644.025974025974 70,634.5454545454546" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="885.3246753246754,331.16883116883116 961.1688311688313,331.16883116883116 961.1688311688313,444.935064935065 885.3246753246754,444.935064935065" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="961.1688311688313,331.16883116883116 1055.974025974026,331.16883116883116 1055.974025974026,444.935064935065 961.1688311688313,444.935064935065" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="979.5714285714287" y="388.0519480519481" font-size="15" fill="#ffe0ac">D03 1片</text><polygon points="1245.5844155844156,188.96103896103898 1387.7922077922078,170 1530,198.4415584415584 1530,312.2077922077922 1245.5844155844156,312.2077922077922" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><rect x="1103.3766233766235" y="340.6493506493507" width="113.76623376623377" height="360.2597402597403" fill="#e3a276" fill-opacity=".04" stroke="#88909c" stroke-dasharray="6 5"/><text x="1109.3766233766235" y="363.6493506493507" font-size="18" fill="#e3a276">V OFF</text><polyline points="762.0779220779222,814.6753246753248 856.8831168831169,757.7922077922078" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="1150.7792207792209,710.3896103896104 1207.6623376623377,378.57142857142856 1264.5454545454547,369.0909090909091 1378.3116883116884,482.8571428571429" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="695.7142857142858,786.2337662337663 809.4805194805195,786.2337662337663 980.1298701298701,473.3766233766234 1084.4155844155844,302.72727272727275 1236.1038961038962,340.6493506493507 1378.3116883116884,482.8571428571429" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="695.7142857142858" cy="809.6753246753248" r="5" fill="#a4e7ee"/><text x="687.7142857142858" y="843.6753246753248" font-size="18" fill="#a4e7ee">A</text><circle cx="1150.7792207792209" cy="733.831168831169" r="5" fill="#a4e7ee"/><text x="1142.7792207792209" y="767.831168831169" font-size="18" fill="#a4e7ee">B</text><ellipse cx="525.0649350649351" cy="793.8181818181819" rx="23.701298701298704" ry="22.753246753246753" fill="#74dec4"/><text x="515.0649350649351" y="761.0649350649352" font-size="18" fill="#74dec4">P0</text><ellipse cx="1378.3116883116884" cy="490.4415584415585" rx="29.38961038961039" ry="27.493506493506494" fill="#ff9bad"/><text x="1368.3116883116884" y="452.948051948052" font-size="18" fill="#ff9bad">E</text><text x="38" y="1008.3636363636365" font-size="17" fill="#dae5ed">加熱壁を常設横穴へ変更。Wを地盤自身の斜面にまとめ、反射蓋の破壊を任意の短縮にした。</text><text x="38" y="1045.3636363636365" font-size="17" fill="#dae5ed">一つの噴出周期と、準備を省く反射蓋の選択。二枚隔壁や並行トンネルの反復にしない。</text><text x="38" y="1082.3636363636365" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1119.3636363636365" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>