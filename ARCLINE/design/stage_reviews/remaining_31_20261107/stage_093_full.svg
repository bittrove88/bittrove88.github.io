<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1107" viewBox="0 0 1600 1107" role="img"><title>床と天井を選ぶ検査反射室</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 93｜床と天井を選ぶ検査反射室</text><text x="38" y="83" font-size="19" fill="#afc2d2">左から右へ、天井→床の二反射か、床→天井→床の三反射を構想する。</text><polygon points="70,731.5384615384617 575.3846153846155,731.5384615384617 622.1794871794872,656.6666666666667 687.6923076923077,656.6666666666667 753.2051282051283,731.5384615384617 1530,731.5384615384617 1530,881.2820512820514 70,881.2820512820514" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,731.5384615384617 575.3846153846155,731.5384615384617 622.1794871794872,656.6666666666667 687.6923076923077,656.6666666666667 753.2051282051283,731.5384615384617 1530,731.5384615384617" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,413.33333333333337 1530,413.33333333333337 1530,525.6410256410256 1118.2051282051282,525.6410256410256 1043.3333333333335,591.1538461538462 931.0256410256411,591.1538461538462 856.1538461538462,525.6410256410256 70,525.6410256410256" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polyline points="70,525.6410256410256 856.1538461538462,525.6410256410256 931.0256410256411,591.1538461538462 1043.3333333333335,591.1538461538462 1118.2051282051282,525.6410256410256 1530,525.6410256410256" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="70,525.6410256410256 856.1538461538462,525.6410256410256" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="856.1538461538462,525.6410256410256 931.0256410256411,591.1538461538462" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="931.0256410256411,591.1538461538462 1043.3333333333335,591.1538461538462" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="1043.3333333333335,591.1538461538462 1118.2051282051282,525.6410256410256" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="1118.2051282051282,525.6410256410256 1530,525.6410256410256" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="70,731.5384615384617 575.3846153846155,731.5384615384617" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="575.3846153846155,731.5384615384617 622.1794871794872,656.6666666666667" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="622.1794871794872,656.6666666666667 687.6923076923077,656.6666666666667" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="687.6923076923077,656.6666666666667 753.2051282051283,731.5384615384617" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="753.2051282051283,731.5384615384617 1530,731.5384615384617" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="70,413.33333333333337 1530,413.33333333333337" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><text x="107.43589743589743" y="469.48717948717956" font-size="17" fill="#f2db9a">固定天井／室内の下面が反射</text><text x="874.8717948717949" y="797.0512820512821" font-size="17" fill="#f2db9a">床：全幅W。隆起も同じ衝突面</text><polyline points="322.69230769230774,703.4615384615386 537.948717948718,525.6410256410256 818.7179487179487,731.5384615384617 1062.0512820512822,609.8717948717949 1398.9743589743591,703.4615384615386" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="444.35897435897436,703.4615384615386 519.2307692307693,731.5384615384617 725.1282051282052,525.6410256410256 949.7435897435898,731.5384615384617 1193.076923076923,619.2307692307693 1398.9743589743591,703.4615384615386" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="322.69230769230774" cy="726.5384615384617" r="5" fill="#a4e7ee"/><text x="314.69230769230774" y="760.5384615384617" font-size="18" fill="#a4e7ee">A</text><circle cx="444.35897435897436" cy="726.5384615384617" r="5" fill="#a4e7ee"/><text x="436.35897435897436" y="760.5384615384617" font-size="18" fill="#a4e7ee">B</text><ellipse cx="219.74358974358975" cy="710.948717948718" rx="23.397435897435898" ry="22.461538461538463" fill="#74dec4"/><text x="209.74358974358975" y="678.4871794871796" font-size="18" fill="#74dec4">P0</text><ellipse cx="1398.9743589743591" cy="710.948717948718" rx="29.012820512820515" ry="27.141025641025642" fill="#ff9bad"/><text x="1388.9743589743591" y="673.8076923076924" font-size="18" fill="#ff9bad">E</text><text x="38" y="923.2820512820514" font-size="17" fill="#dae5ed">高所から窓を開く旧案を全面刷新。少数の床隆起と天井の下向き段差を持つ、上下全面反射の細長い室にした。</text><text x="38" y="960.2820512820514" font-size="17" fill="#dae5ed">上下反射の順序と接触位置が主題。屋外二峰の99面、多島と橋の98面とは分ける。</text><text x="38" y="997.2820512820514" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1034.2820512820513" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>