3529" font-size="17" fill="#dae5ed">開始を山肩へ移して不要な左大庇を削除。中段観測塔の遮風板と、基盤横の射出口を分けた。</text><text x="38" y="1004.7647058823529" font-size="17" fill="#dae5ed">一つの既存観測センサーと前面装甲への角度選択。架空の複数部位を足さない。</text><text x="38" y="1041.764705882353" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1078.764705882353" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1151"><title>観測センサーを見上げる三段要塞</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 55｜観測センサーを見上げる三段要塞</text><text x="38" y="83" font-size="19" fill="#afc2d2">上段から高いセンサー、中段から装甲の縁、下段から側方の開口を狙う。</text><polygon points="70,573.6470588235295 190.23529411764707,530.7058823529412 327.6470588235294,530.7058823529412 396.35294117647055,462 447.88235294117646,401.8823529411765 516.5882352941176,401.8823529411765 628.2352941176471,504.9411764705883 731.2941176470588,642.3529411764706 825.7647058823529,719.6470588235294 946,719.6470588235294 1049.0588235294117,702.4705882352941 1152.1176470588234,702.4705882352941 1255.1764705882354,668.1176470588235 1401.1764705882351,642.3529411764706 1530,642.3529411764706 1530,925.7647058823529 70,925.7647058823529" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,573.6470588235295 190.23529411764707,530.7058823529412 327.6470588235294,530.7058823529412 396.35294117647055,462 447.88235294117646,401.8823529411765 516.5882352941176,401.8823529411765 628.2352941176471,504.9411764705883 731.2941176470588,642.3529411764706 825.7647058823529,719.6470588235294 946,719.6470588235294 1049.0588235294117,702.4705882352941 1152.1176470588234,702.4705882352941 1255.1764705882354,668.1176470588235 1401.1764705882351,642.3529411764706 1530,642.3529411764706" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon poi