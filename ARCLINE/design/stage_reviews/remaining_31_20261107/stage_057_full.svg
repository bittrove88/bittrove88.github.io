fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="800,924.3333333333333 946,948.6666666666666" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="556.6666666666666,182.16666666666663 617.5,267.33333333333326 690.5,535 812.1666666666666,926.3615166666666 994.6666666666666,668.8333333333333 1140.6666666666665,729.6666666666666 1335.3333333333333,912.1666666666666" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="848.6666666666666,895.9448499999999 994.6666666666666,778.3333333333333 1165,802.6666666666666 1335.3333333333333,912.1666666666666" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="556.6666666666666" cy="213.66666666666663" r="5" fill="#a4e7ee"/><text x="548.6666666666666" y="247.66666666666663" font-size="18" fill="#a4e7ee">A</text><circle cx="848.6666666666666" cy="927.4444484999999" r="5" fill="#a4e7ee"/><text x="840.6666666666666" y="961.4444484999999" font-size="18" fill="#a4e7ee">B</text><ellipse cx="386.3333333333333" cy="155.39999999999998" rx="30.416666666666664" ry="29.2" fill="#74dec4"/><text x="376.3333333333333" y="116.19999999999996" font-size="18" fill="#74dec4">P0</text><ellipse cx="1335.3333333333333" cy="921.9" rx="37.71666666666666" ry="35.28333333333333" fill="#ff9bad"/><text x="1325.3333333333333" y="876.6166666666667" font-size="18" fill="#ff9bad">E</text><text x="38" y="1221.8333333333333" font-size="17" fill="#dae5ed">不採用v4を使わず、崖肩と入口を新規作図。両経路が同じ入口端の一片を開く条件を明記。</text><text x="38" y="1258.8333333333333" font-size="17" fill="#dae5ed">垂直落差による下向きの入射と床反射が核。64面の裏回りには反射を使わない。</text><text x="38" y="1295.8333333333333" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1332.8333333333333" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>