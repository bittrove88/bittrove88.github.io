<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1442" viewBox="0 0 1600 1442" role="img"><title>崖肩から落とす反射洞</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 57｜崖肩から落とす反射洞</text><text x="38" y="83" font-size="19" fill="#afc2d2">崖肩の落差から既存Wへ入れ、洞内の天井・床の反射板を使い分ける。</text><polygon points="70,206.5 240.33333333333331,218.66666666666663 483.66666666666663,218.66666666666663 532.3333333333333,316 581,413.33333333333326 593.1666666666666,449.83333333333326 593.1666666666666,802.6666666666666 666.1666666666666,875.6666666666666 800,960.8333333333333 946,985.1666666666666 1384,985.1666666666666 1530,936.5 1530,1216.3333333333333 70,1216.3333333333333" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,206.5 240.33333333333331,218.66666666666663 483.66666666666663,218.66666666666663 532.3333333333333,316 581,413.33333333333326 593.1666666666666,449.83333333333326 593.1666666666666,802.6666666666666 666.1666666666666,875.6666666666666 800,960.8333333333333 946,985.1666666666666 1384,985.1666666666666 1530,936.5" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1067.6666666666665,389 1262.3333333333333,413.33333333333326 1530,437.66666666666663 1530,729.6666666666666 1359.6666666666665,754 1213.6666666666665,729.6666666666666 1140.6666666666665,699.25 1067.6666666666665,583.6666666666666" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polyline points="1140.6666666666665,699.25 1213.6666666666665,729.6666666666666 1286.6666666666665,741.8333333333333" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polygon points="970.3333333333333,985.1666666666666 1055.5,985.1666666666666 1055.5,656.6666666666666 1006.8333333333333,620.1666666666666 970.3333333333333,644.5" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="983.9166666666666" y="802.6666666666666" font-size="15" fill