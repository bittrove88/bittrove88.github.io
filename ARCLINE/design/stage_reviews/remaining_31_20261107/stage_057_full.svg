fill="#a4e7ee"/><text x="840.6666666666666" y="997.9444484999999" font-size="18" fill="#a4e7ee">B</text><ellipse cx="386.3333333333333" cy="191.89999999999998" rx="30.416666666666664" ry="29.2" fill="#74dec4"/><text x="376.3333333333333" y="152.69999999999996" font-size="18" fill="#74dec4">P0</text><ellipse cx="1335.3333333333333" cy="958.4" rx="37.71666666666666" ry="35.28333333333333" fill="#ff9bad"/><text x="1325.3333333333333" y="913.1166666666667" font-size="18" fill="#ff9bad">E</text><text x="38" y="1258.3333333333333" font-size="17" fill="#dae5ed">画像指定の崖肩の角と屋根左下を削り、床と天井下面の青線位置へ反射面を追加。崖肩の候補Aは削った部分の手前へ移した。</text><text x="38" y="1295.3333333333333" font-size="17" fill="#dae5ed">垂直落差による下向きの入射と床反射が核。64面の裏回りには反射を使わない。</text><text x="38" y="1332.3333333333333" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1369.3333333333333" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>