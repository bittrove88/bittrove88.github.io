<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1188" viewBox="0 0 1600 1188" role="img"><title>鉱床の下を通す鏡路</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 74｜鉱床の下を通す鏡路</text><text x="38" y="83" font-size="19" fill="#afc2d2">床の鏡から鉱床の下へ通すか、鉱床上から右の出口へ落とす。</text><polygon points="70,754 362,754 424.57142857142856,795.7142857142857 581,795.7142857142857 695.7142857142858,764.4285714285714 935.5714285714286,764.4285714285714 977.2857142857143,681 1050.2857142857142,681 1112.857142857143,764.4285714285714 1530,764.4285714285714 1530,962.5714285714286 70,962.5714285714286" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,754 362,754 424.57142857142856,795.7142857142857 581,795.7142857142857 695.7142857142858,764.4285714285714 935.5714285714286,764.4285714285714 977.2857142857143,681 1050.2857142857142,681 1112.857142857143,764.4285714285714 1530,764.4285714285714" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,399.42857142857144 299.42857142857144,409.85714285714283 382.8571428571429,462 382.8571428571429,555.8571428571429 226.42857142857144,535 70,503.7142857142857" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="873,399.42857142857144 956.4285714285714,399.42857142857144 956.4285714285714,535 873,514.1428571428571" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="885.7142857142858" y="467.2142857142857" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="956.4285714285714,399.42857142857144 1217.142857142857,399.42857142857144 1300.5714285714287,441.1428571428571 1300.5714285714287,555.8571428571429 1154.5714285714287,535 956.4285714285714,535" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><circle cx="862.5714285714286" cy="597.5714285714286" r="198.14285714285714" fill="#be75b9" fill-opacity=".1" stroke="#d49fd0" stroke-dasharray="5 6"/><text x="866.5714285714286" y="593.5714285714286" font-size="18" fill="#e2b5de">M −</text><polyline points="581,795.7142857142857 695.7142857142858,764.4285714285714" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="508,764.4285714285714 643.5714285714286,778.6493885714285 862.5714285714286,618.4285714285714 1144.142857142857,618.4285714285714 1425.7142857142858,733.1428571428571" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="1112.857142857143,368.1428571428571 1279.7142857142858,232.57142857142856 1425.7142857142858,733.1428571428571" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="508" cy="790.7142857142857" r="5" fill="#a4e7ee"/><text x="500" y="824.7142857142857" font-size="18" fill="#a4e7ee">A</text><circle cx="1112.857142857143" cy="394.42857142857144" r="5" fill="#a4e7ee"/><text x="1104.857142857143" y="428.42857142857144" font-size="18" fill="#a4e7ee">B</text><ellipse cx="466.2857142857143" cy="772.7714285714285" rx="26.071428571428573" ry="25.02857142857143" fill="#74dec4"/><text x="456.2857142857143" y="737.7428571428571" font-size="18" fill="#74dec4">P0</text><ellipse cx="1425.7142857142858" cy="741.4857142857143" rx="32.32857142857143" ry="30.242857142857144" fill="#ff9bad"/><text x="1415.7142857142858" y="701.2428571428571" font-size="18" fill="#ff9bad">E</text><text x="38" y="1004.5714285714286" font-size="17" fill="#dae5ed">三片の全面窓を常設の縦穴と端の一片へ整理。敵を上坑道の外の低い出口に置いた。</text><text x="38" y="1041.5714285714284" font-size="17" fill="#dae5ed">同じ敵へ、鉱床の下面と上面で進入経路を変える。上下とも長い高弧にする構成を避ける。</text><text x="38" y="1078.5714285714284" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1115.5714285714284" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>