<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1392" viewBox="0 0 1600 1392" role="img"><title>下甲板の反射湾と上昇棚</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 86｜下甲板の反射湾と上昇棚</text><text x="38" y="83" font-size="19" fill="#afc2d2">作業桁の下を通した反射弾を雲へ入れるか、上昇棚からUで船外へ送る。</text><polygon points="70,960.1176470588233 173.05882352941177,942.9411764705881 336.2352941176471,942.9411764705881 439.2941176470588,960.1176470588233 671.1764705882352,960.1176470588233 825.7647058823529,857.0588235294116 825.7647058823529,1166.2352941176468 70,1166.2352941176468" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,960.1176470588233 173.05882352941177,942.9411764705881 336.2352941176471,942.9411764705881 439.2941176470588,960.1176470588233 671.1764705882352,960.1176470588233 825.7647058823529,857.0588235294116" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="963.1764705882352,908.5882352941175 1530,908.5882352941175 1530,1166.2352941176468 963.1764705882352,1166.2352941176468" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="963.1764705882352,908.5882352941175 1530,908.5882352941175" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,590.8235294117645 224.58823529411765,565.0588235294116 387.7647058823529,607.9999999999998 387.7647058823529,719.6470588235293 250.35294117647058,745.4117647058822 70,728.2352941176468" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1066.235294117647,582.2352941176468 1134.9411764705883,565.0588235294116 1134.9411764705883,719.6470588235293 1066.235294117647,728.2352941176468" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="1071.5882352941176" y="646.6470588235293" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="1134.9411764705883,427.6470588235293 1255.1764705882354,427.6470588