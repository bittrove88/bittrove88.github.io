ze="18" fill="#a4e7ee">A</text><circle cx="911.6470588235294" cy="465.58823529411745" r="5" fill="#a4e7ee"/><text x="903.6470588235294" y="499.58823529411745" font-size="18" fill="#a4e7ee">B</text><ellipse cx="516.5882352941176" cy="941.2235294117645" rx="21.470588235294116" ry="20.611764705882354" fill="#74dec4"/><text x="506.58823529411757" y="910.6117647058821" font-size="18" fill="#74dec4">P0</text><ellipse cx="1341.0588235294117" cy="546.1647058823528" rx="26.623529411764707" ry="24.905882352941177" fill="#ff9bad"/><text x="1331.0588235294117" y="511.25882352941164" font-size="18" fill="#ff9bad">E</text><text x="38" y="1208.2352941176468" font-size="17" fill="#dae5ed">大きな四片ハッチを常設の上向き通路と任意一片へ整理。床自身をWにし上段まで鏡になる重なりを避けた。</text><text x="38" y="1245.2352941176468" font-size="17" fill="#dae5ed">下甲板で一度反射してから上向きに抜く船。反射経路とUへの入射は異なる高さから始め、浮遊ボスの90面とは別にする。</text><text x="38" y="1282.2352941176468" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1319.2352941176468" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>