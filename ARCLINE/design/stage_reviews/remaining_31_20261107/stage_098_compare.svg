<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">98：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1053"><title>逆位相の橋と九つの固定島</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 98｜逆位相の橋と九つの固定島</text><text x="38" y="83" font-size="19" fill="#afc2d2">西の橋が水平な間に中継へ渡り、東の橋が下降した間の降下帯を使う。次の状態では東側の独立低島を選ぶ。</text><polygon points="70,394.0594059405941 149.5049504950495,336.23762376237624 221.78217821782178,271.18811881188117 322.970297029703,271.18811881188117 373.56435643564356,321.7821782178218 373.56435643564356,827.7227722772277 70,827.7227722772277" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,394.0594059405941 149.5049504950495,336.23762376237624 221.78217821782178,271.18811881188117 322.970297029703,271.18811881188117 373.56435643564356,321.7821782178218" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="893.960396039604,581.980198019802 995.1485148514852,596.4356435643565 1125.2475247524753,596.4356435643565 1204.7524752475247,545.8415841584159 1327.6237623762377,502.4752475247525 1327.6237623762377,827.7227722772277 893.960396039604,827.7227722772277" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="893.960396039604,581.980198019802 995.1485148514852,596.4356435643565 1125.2475247524753,596.4356435643565 1204.7524752475247,545.8415841584159 1327.6237623762377,502.4752475247525" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="330.1980198019802,314.5544554455446 395.2475247524753,256.73267326732673 481.980198019802,198.910891089109 561.4851485148515,170 640.990099009901,170 734.950495049505,206.13861386138615 828.910891089109,285.64356435643566 922