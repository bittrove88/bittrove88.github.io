138613861,292.3153084539224" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="655.4455445544554,673.5313531353136 669.90099009901,661.4851485148515" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="669.90099009901,661.4851485148515 778.3168316831683,661.4851485148515" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="778.3168316831683,661.4851485148515 836.1386138613861,697.6237623762377" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="749.4059405940594,661.4851485148515 821.6831683168317,647.0297029702971" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="655.4455445544554,509.7029702970297 836.1386138613861,509.7029702970297" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="286.83168316831683" cy="255.28712871287127" rx="18.06930693069307" ry="17.346534653465348" fill="#74dec4"/><text x="276.83168316831683" y="227.94059405940592" font-size="18" fill="#74dec4">P0</text><ellipse cx="1074.6534653465346" cy="580.5346534653465" rx="22.40594059405941" ry="20.96039603960396" fill="#ff9bad"/><text x="1064.6534653465346" y="549.5742574257426" font-size="18" fill="#ff9bad">E</text><text x="38" y="869.7227722772277" font-size="17" fill="#dae5ed">大きな固定上橋を九つの役割の異なる島に刷新し、二本のBを逆位相に配置。固定島はどちらの状態でも残る。</text><text x="38" y="906.7227722772277" font-size="17" fill="#dae5ed">橋の姿勢が中継と射撃の空間を交替させる。島を高度順に巡る97面や、二峰で転移先を選ぶ99面とは異なる。</text><text x="38" y="943.7227722772277" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="980.7227722772277" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1053"><title>逆位相の橋と九つの固定島</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44"