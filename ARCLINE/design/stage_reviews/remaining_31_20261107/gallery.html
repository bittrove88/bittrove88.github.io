<script>const maps=[{"stage": 51, "name": "風域の端を選ぶ観測丘", "core": "130pxの山肩移動と、風域を外す谷出口を比較する。", "change": "観測丘を風食された前肩と背後の敵平坦部に整理。", "distinct": "短い徒歩で風への入り方を変える面。逆勾配の往復や窓破壊を主題にしない。", "note": "", "state": "承認済み", "phases": [1], "stem": "stage_051"}, {"stage": 52, "name": "一片の横穴と開いた縦穴", "core": "横穴を壊して低く通すか、開いた縦穴から断崖上へ出る。", "change": "西張り出しを後退してP0頭上を開け、破壊窓を80pxの独立片に。", "distinct": "破壊の一手と縦の迂回を比較する断崖。二枚隔壁とは分ける。", "note": "", "state": "承認済み", "phases": [1], "stem": "stage_052"}, {"stage": 53, "name": "風の上端と結晶の入口", "core": "高棚で風を避けるか、低棚からKと風を使う。", "change": "敵側の尖った稜線をやめ、高棚自身の前縁とKの向きで退出空間を整理。", "distinct": "Kへの入射位置が主題。谷底のW反射や多島の周回ではない。", "note": "", "state": "承認済み", "phases": [1], "stem": "stage_053"}, {"stage": 54, "name": "裏斜面へ返す谷の鏡", "core": "非対称な二峰の背後へ、風の山越えか谷のW反射を送る。", "change": "Wの実体斜面を折れの少ない広い一面に整え、Uを左山腹の補助に限定。", "distinct": "逆斜面の敵へ下から返す。二峰を転移先選択に使う99面とは別。", "note": "", "state": "承認済み", "phases": [1], "stem": "stage_054"}, {"stage": 55, "name": "観測センサーを見上げる三段要塞", "core": "上段から高いセンサー、中段から装甲の縁、下段から側方の開口を狙う。", "change": "開始を山肩へ移して不要な左大庇を削除。中段観測塔の遮風板と、基盤横の射出口を分けた。", "distinct": "一つの既存観測センサーと前面装甲への角度選択。架空の複数部位を足さない。", "note": "", "state": "承認済み", "phases": [1], "stem": "stage_055"}, {"stage": 56, "name": "固定氷橋と下橋の残る足場", "core": "下橋が開いても固定桟橋に残れることを読み、横断と射撃を分ける。", "change": "画像で指定された左の接合部の下側と、右下の氷舌先端だけを削った。固定上橋・周期下橋・桟橋・敵味方位置は維持。", "distinct": "一本の周期橋と長い固定橋の関係。多数の逆位相橋を扱う98面とは異なる。", "note": "2026-11-07の画像指示による部分改訂。左接合部を薄くし、右先端はh41からh45へ切り上げた。比較図はPR #107の提示版 f174908 に対する差分。橋の既存二姿勢と行動条件は変更しない。", "state": "改訂確認待ち", "phases": [1, 2], "stem": "stage_056"}, {"stage": 57, "name": "崖肩から落とす反射洞", "core": "崖肩の落差から既存Wへ入れ、洞内の天井・床の反射板を使い分ける。", "change": "画像指定の崖肩の角と屋根左下を削り、床と天井下面の青線位置へ反射面を追加。崖肩の候補Aは削った部分の手前へ移した。", "distinct": "垂直落差による下向きの入射と床反射が核。64面の裏回りには反射を使わない。", "note": "2026-11-07の画像指示による部分改訂。床73〜97の板は既存Kを水平・固定で使用し、屋根上面までWが広がる副作用を避ける。板の4px厚は地面へ埋まり上面は床の0.6px上。天井下面88〜100は実ポリゴンの辺にreflectiveUndersideを指定。既存Wと合わせた3反射は構想で、既存の反射上限・減衰のまま詳細検証へ送る。開始と敵、入口一片、F、既存W、取得物は維持。比較図は前提示版f174908との差分。", "state": "改訂確認待ち", "phases": [1], "stem": "stage_057"}, {"stage": 61, "name": "門を狙う中継岩棚", "core": "門前へ渡る準備と、高尾根から門を越す照準を比較する。", "change": "中継棚の射点を広げ、後方の短い庇と射撃縁を離す。", "distinct": "一つの要塞門と対岸への中継。破壊順序の面にはしない。", "note": "", "state": "承認済み", "phases": [1], "stem": "stage_061"}, {"stage": 63, "name": "二枚隔壁の順序を読む", "core": "手前を開いて途中射点を作り、奥の片を狙う。高棚なら手前を迂回する。", "change": "途中射点を平坦にし、単位幅の異なる二枚を明示。", "distinct": "二枚を順に開く体験はこの面に集約し、後半で再利用しない。", "note": "", "state": "承認済み", "phases": [1], "stem": "stage_063"}, {"stage": 64, "name": "崖下盆地の裏へ回る", "core": "上から開口へ落とすか、盆地の右裏へ回って左向きに低く送る。", "change": "側棚を崖へ接続し、盆地の前稜と背面口を分ける。両射点の頭上は開放。", "distinct": "垂直崖の反対側へ回り、射撃方向を反転する盆地。62面の同側の山肩往復と区別。", "note": "", "state": "承認済み", "phases": [1], "stem": "stage_064"}, {"stage": 68, "name": "噴出の横穴と短い反射蓋", "core": "常設の下側横穴を進んで噴出口から送るか、上の一片を開いてWで短く返す。", "change": "加熱壁を常設横穴へ変更。Wを地盤自身の斜面にまとめ、反射蓋の破壊を任意の短縮にした。", "distinct": "一つの噴出周期と、準備を省く反射蓋の選択。二枚隔壁や並行トンネルの反復にしない。", "note": "元の加熱壁の破壊を主経路の進行条件から外した。噴出OFF時とON時の実入力は最後に比較し、同じ模式線で両状態の命中を保証しない。", "state": "承認済み", "phases": [1, 2], "stem": "stage_068"}, {"stage": 70, "name": "炉蓋の一片と二本の腕", "core": "炉上から奥の腕、噴出の出口から手前の腕へ入れる角度を選ぶ。", "change": "炉蓋を二片に整理し、噴出内の射点と、その外の頭上が開いた出口を分けた。", "distinct": "Vの縦の通過帯と既存の左右二腕を結ぶ炉。観測センサーや磁場発生器の面とは役割を分ける。", "note": "本体・二腕のHPと攻撃は既存定義を維持。腕の高さを架空に変更せず、接近方向と射撃空間で分ける。V射点は炉蓋の右1片のみ開ける構想で、上の弧やV外出口はその操作を必須にしない。", "state": "承認済み", "phases": [1, 2], "stem": "stage_070"}, {"stage": 73, "name": "磁場へ入る二つの向き", "core": "下段から横に入るか、高棚から折り返して同じ磁場へ入る。", "change": "開始を庇の外へ移し、磁場を避けるだけだった高棚にも異なる入射を持たせた。", "distinct": "Tを必須の通行鍵にせず、Mの入り方と極性を比較する採掘場。二枚隔壁の破壊順とは区別。", "note": "Mは速度の回転であり吸引ではない。二本の線は入射方向の構想で、旋回量・極性別の成立は最終検証。Tを撃つ操作、破壊、転移はそれぞれ行動として数える。", "state": "承認済み", "phases": [1], "stem": "stage_073"}, {"stage": 74, "name": "鉱床の下を通す鏡路", "core": "床の鏡から鉱床の下へ通すか、鉱床上から右の出口へ落とす。", "change": "三片の全面窓を常設の縦穴と端の一片へ整理。敵を上坑道の外の低い出口に置いた。", "distinct": "同じ敵へ、鉱床の下面と上面で進入経路を変える。上下とも長い高弧にする構成を避ける。", "note": "主経路は常設開口を使い必須破壊なし。端の一片は別角度を開く任意準備。Wは床斜面だけに置き、上の鉱床まで鏡にしない。既存取得物は変更せず再検証対象と
