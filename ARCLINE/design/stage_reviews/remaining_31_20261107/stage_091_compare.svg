<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">91：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1262"><title>斜め城壁の正門と側門</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 91｜斜め城壁の正門と側門</text><text x="38" y="83" font-size="19" fill="#afc2d2">右の正門だけを開いて床Wで返すか、左の側門だけを開いてKから落とす。</text><polygon points="70,726.625 179.5,662.75 289,653.625 398.5,699.25 480.625,817.875 599.25,854.375 708.75,781.375 827.375,681 973.375,772.25 1082.875,817.875 1356.625,817.875 1438.75,799.625 1511.75,799.625 1530,808.75 1530,1036.875 70,1036.875" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,726.625 179.5,662.75 289,653.625 398.5,699.25 480.625,817.875 599.25,854.375 708.75,781.375 827.375,681 973.375,772.25 1082.875,817.875 1356.625,817.875 1438.75,799.625 1511.75,799.625 1530,808.75" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="681.375,589.75 763.5,525.875 927.75,525.875 1037.25,589.75 973.375,653.625 818.25,626.25 717.875,671.875" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1064.625,810.2708333363751 1146.75,817.875 1146.75,525.875 1064.625,525.875" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="1076.6875" y="671.875" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="1064.625,525.875 1146.75,525.875 1201.5,389 1128.5,316 1055.5,398.125" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="571.875,462 663.125,434.625 663.125,270.375 571.875,306.875" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="588.5" y="366.1875" font-size="15" fill="#ffe0ac">D04 1片</text><polygon points="462.375,717.5 535.375,790.5 571.875,462 571.875,306.875 508,352.5" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="316.375,462 380.25,398.125 480.625,398.125 535.375,462 462.375,525.875 380.25,516.75" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1174.125,763.125 1274.5,817.875 1274.5,836.125 1174.125,836.125" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polyline points="706.8041445109664,329.36509683885686 783.6958554890336,393.88490316114314" fill="none" stroke="#c5e8fb" stroke-width="5" stroke-dasharray=""/><polyline points="1155.875,817.875 1338.375,817.875" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="1155.875,343.375 1201.5,389" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="1174.125,763.125 1274.5,817.875" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="1475.25" cy="779.55" rx="22.8125" ry="21.9" fill="#74dec4"/><text x="1465.25" y="747.65" font-size="18" fill="#74dec4">P0</text><ellipse cx="827.375" cy="505.8" rx="28.2875" ry="26.4625" fill="#ff9bad"/><text x="817.375" y="469.3375" font-size="18" fill="#ff9bad">E</text><text x="38" y="1078.875" font-size="17" fill="#dae5ed">床と鏡桁の重複を解消し、二門を直列の必須破壊にせず、反対側へ回る二つの入口に整理。</text><text x="38" y="1115.875" font-size="17" fill="#dae5ed">正門を開いた近い射点と、正門を残して西壁の外へ回る準備を比較。単なる長い遠回りではなく残す遮蔽が変わる。</text><text x="38" y="1152.875" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1189.875" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1262"><title>斜め城壁の正門と側門</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 91｜斜め城壁の正門と側門</text><text x="38" y="83" font-size="19" fill="#afc2d2">右の正門だけを開いて床Wで返すか、左の側門だけを開いてKから落とす。</text><polygon points="70,726.625 179.5,662.75 289,653.6