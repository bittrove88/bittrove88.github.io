4dec4"/><text x="1465.25" y="747.65" font-size="18" fill="#74dec4">P0</text><ellipse cx="827.375" cy="505.8" rx="28.2875" ry="26.4625" fill="#ff9bad"/><text x="817.375" y="469.3375" font-size="18" fill="#ff9bad">E</text><text x="38" y="1078.875" font-size="17" fill="#dae5ed">床と鏡桁の重複を解消し、二門を直列の必須破壊にせず、反対側へ回る二つの入口に整理。</text><text x="38" y="1115.875" font-size="17" fill="#dae5ed">正門を開いた近い射点と、正門を残して西壁の外へ回る準備を比較。単なる長い遠回りではなく残す遮蔽が変わる。</text><text x="38" y="1152.875" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1189.875" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg></svg>