739130434" font-size="18" fill="#ff9bad">E</text><text x="38" y="1307" font-size="17" fill="#dae5ed">船尾に広い前段と外側の開始平坦部を設け、中央射点の頭上を開放。左砲座の弧を受ける折れた隔壁を設けた。</text><text x="38" y="1344" font-size="17" fill="#dae5ed">浮遊中の空母を三方向から狙う。平地上の二腕や二発生器と同じ二層ボス構成にしない。</text><text x="38" y="1381" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1418" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1490"><title>浮遊空母を囲む三つの進入</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 90｜浮遊空母を囲む三つの進入</text><text x="38" y="83" font-size="19" fill="#afc2d2">船尾の上向き弧、中央通路の射出口、船首砲座上からの浅い弧を使い分ける。</text><polygon points="70,931.7391304347825 149.34782608695653,987.2826086956521 276.304347826087,1090.4347826086955 427.0652173913044,1138.0434782608695 585.7608695652174,1153.9130434782608 911.0869565217391,1153.9130434782608 1093.586956521739,1090.4347826086955 1284.0217391304348,971.4130434782608 1450.6521739130435,868.2608695652173 1530,836.5217391304348 1530,1265 70,1265" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,931.7391304347825 149.34782608695653,987.2826086956521 276.304347826087,1090.4347826086955 427.0652173913044,1138.0434782608695 585.7608695652174,1153.9130434782608 911.0869565217391,1153.9130434782608 1093.586956521739,1090.4347826086955 1284.0217391304348,971.4130434782608 1450.6521739130435,868.2608695652173 1530,836.5217391304348" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="181.08695652173913,804.782608695652 260.4347826086956,693.695652173913 435,693.695652173913 522.2826086956522,757.1739130434783 482.60869565217394,860.3260869565216 339.7826086956522,899.9999999999999 228.69565217391306,868.2608695652173" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" />