90243902439" y="308.7317073170732" font-size="18" fill="#7cc9db">F</text><circle cx="1058.170731707317" cy="713.048780487805" r="222.5609756097561" fill="#be75b9" fill-opacity=".1" stroke="#d49fd0" stroke-dasharray="5 6"/><text x="1062.170731707317" y="709.048780487805" font-size="18" fill="#e2b5de">M −</text><polyline points="613.0487804878048,499.39024390243907 808.9024390243902,348.04878048780495 1013.6585365853658,170 1191.7073170731708,223.41463414634154 1254.0243902439024,321.3414634146342 1255.8048780487804,380.9878048780489" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="1067.0731707317073,704.1463414634147 1040.3658536585367,561.7073170731708 1075.9756097560976,365.8536585365854 1255.8048780487804,380.9878048780489" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="613.0487804878048" cy="521.0975609756098" r="5" fill="#a4e7ee"/><text x="605.0487804878048" y="555.0975609756098" font-size="18" fill="#a4e7ee">A</text><circle cx="1067.0731707317073" cy="725.8536585365854" r="5" fill="#a4e7ee"/><text x="1059.0731707317073" y="759.8536585365854" font-size="18" fill="#a4e7ee">B</text><ellipse cx="283.6585365853658" cy="755.780487804878" rx="22.25609756097561" ry="21.365853658536587" fill="#74dec4"/><text x="273.6585365853658" y="724.4146341463414" font-size="18" fill="#74dec4">P0</text><ellipse cx="1289.6341463414633" cy="406.80487804878055" rx="31.15853658536585" ry="23.146341463414636" fill="#ff9bad"/><circle cx="1255.8048780487804" cy="380.98780487804885" r="14.24390243902439" fill="#f1c7d5" stroke="#fff0f3" stroke-width="1.5"/><text x="1279.6341463414633" y="373.65853658536594" font-size="18" fill="#ff9bad">E</text><text x="38" y="1102.2439024390244" font-size="17" fill="#dae5ed">固定根と基部を維持し、下の攻撃棚を左へ広げて小さな根片を整理。枝や庭園蓋の全破壊を主経路にしない。</text><text x="38" y="1139.2439024390244" font-size="17" fill="#dae5ed">支持根を壊さず上側Fと根先Mを使い分ける樹木施設。環状島や炉の左右発生器とは骨格を分ける。</text><text x="38" y="1176.2439024390244" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1213.2439024390244" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>