<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1286" viewBox="0 0 1600 1286" role="img"><title>固定根を残す空中樹</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 85｜固定根を残す空中樹</text><text x="38" y="83" font-size="19" fill="#afc2d2">根橋上からFを横切る弧で給水ユニットへ入れるか、根先の開口からMで撃ち上げる。</text><polygon points="70,962.3170731707318 212.4390243902439,962.3170731707318 212.4390243902439,1060.2439024390244 70,1060.2439024390244" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,962.3170731707318 212.4390243902439,962.3170731707318" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1396.4634146341464,962.3170731707318 1530,962.3170731707318 1530,1060.2439024390244 1396.4634146341464,1060.2439024390244" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1396.4634146341464,962.3170731707318 1530,962.3170731707318" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="141.21951219512195,828.780487804878 194.6341463414634,775.3658536585366 435,775.3658536585366 479.5121951219512,819.8780487804879 390.4878048780488,873.2926829268293 248.0487804878049,873.2926829268293" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="345.9756097560976,526.0975609756098 657.560975609756,526.0975609756098 764.390243902439,463.78048780487813 951.3414634146342,463.78048780487813 951.3414634146342,584.4579985365854 755.4878048780488,606.219512195122 639.7560975609756,704.1463414634147 345.9756097560976,668.5365853658536" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="764.390243902439,713.048780487805 844.5121951219512,713.048780487805 844.5121951219512,579.5121951219512 764.390243902439,606.219512195122" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="506.2195121951219,900 550.7317073170732,846.5853658536586 710.9756097560976,846.5