<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1563" viewBox="0 0 1600 1563" role="img"><title>折り返す保全棚の使い分け</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 92｜折り返す保全棚の使い分け</text><text x="38" y="83" font-size="19" fill="#afc2d2">中央下から西のM入口へ戻るか、東の風棚へ進む。必要な棚だけを選ぶ。</text><polygon points="70,1182.875 152.125,1128.125 234.25,1164.625 234.25,1338 70,1338" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,1182.875 152.125,1128.125 234.25,1164.625" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="498.875,1155.5 544.5,1137.25 663.125,1137.25 699.625,1164.625 699.625,1338 498.875,1338" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="498.875,1155.5 544.5,1137.25 663.125,1137.25 699.625,1164.625" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1146.75,462 1210.625,425.5 1438.75,425.5 1530,480.25 1530,1338 1146.75,1338" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1146.75,462 1210.625,425.5 1438.75,425.5 1530,480.25" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="252.5,918.25 325.5,845.25 435,845.25 462.375,881.75 389.375,927.375 334.625,1009.5 289,982.125" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="699.625,781.375 772.625,744.875 891.25,744.875 964.25,799.625 927.75,845.25 772.625,845.25" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="927.75,598.875 991.625,544.125 1092,544.125 1137.625,598.875 1119.375,662.75 1009.875,644.5 964.25,690.125" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1064.625,1182.875 1137.625,1210.25 1210.625,425.5 1146.75,462 1119.375,662.75 1101.125,927.375" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><circle cx="745.25" cy="763.125" r="237.25" fill="#be75b9" fill-opacity=".1" stroke="#d49fd0" stroke-dasharray="5 6"/><text x="749.25" y="759.125" font-size="18" fill="#e2b5de">M −</text><rect x="873" y="480.25" width="246.375" height="365" fill="#7cc9db" fill-opacity=".13" stroke="#7cc9db" stroke-dasharray="6 5"/><text x="879" y="503.25" font-size="18" fill="#7cc9db">F</text><polyline points="371.125,817.875 654,553.25 836.5,297.75 1073.75,170 1292.75,398.125" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="827.375,717.5 973.375,297.75 1165,206.5 1292.75,398.125" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="1055.5,516.75 1165,325.125 1292.75,398.125" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="371.125" cy="840.25" r="5" fill="#a4e7ee"/><text x="363.125" y="874.25" font-size="18" fill="#a4e7ee">A</text><circle cx="827.375" cy="739.875" r="5" fill="#a4e7ee"/><text x="819.375" y="773.875" font-size="18" fill="#a4e7ee">B</text><circle cx="1055.5" cy="539.125" r="5" fill="#a4e7ee"/><text x="1047.5" y="573.125" font-size="18" fill="#a4e7ee">C</text><ellipse cx="626.625" cy="1117.175" rx="22.8125" ry="21.9" fill="#74dec4"/><text x="616.625" y="1085.275" font-size="18" fill="#74dec4">P0</text><ellipse cx="1292.75" cy="405.425" rx="28.2875" ry="26.4625" fill="#ff9bad"/><text x="1282.75" y="368.9625" font-size="18" fill="#ff9bad">E</text><text x="38" y="1380" font-size="17" fill="#dae5ed">三つの同形棚を、左の深い保全棚・横長の風棚・断崖に寄る張り出しへ描き分けた。</text><text x="38" y="1417" font-size="17" fill="#dae5ed">中央開始から左右に準備する断崖。全棚を順番に登る階段や、同形の浮島列にしない。</text><text x="38" y="1454" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1491" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>