<ellipse cx="1262.0253164556962" cy="593.2151898734178" rx="28.645569620253163" ry="26.79746835443038" fill="#ff9bad"/><text x="1252.0253164556962" y="556.4177215189874" font-size="18" fill="#ff9bad">E</text><text x="38" y="1246.9367088607596" font-size="17" fill="#dae5ed">環状の空洞は残し、各島の輪郭と張り出し方向を変えた。上の島を通らず左右に抜ける空間を分けた。</text><text x="38" y="1283.9367088607596" font-size="17" fill="#dae5ed">中心へ入れる磁場と、環の外へ送る結晶の対比。島の高さ順に登る面ではない。</text><text x="38" y="1320.9367088607596" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1357.9367088607596" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1430"><title>環の内側と外側へ向ける庭園</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 84｜環の内側と外側へ向ける庭園</text><text x="38" y="83" font-size="19" fill="#afc2d2">下の島から中央Mへ向けるか、左の島から外向きのKへ向ける。</text><polygon points="70,1103.2911392405063 227.0886075949367,1103.2911392405063 227.0886075949367,1204.9367088607596 70,1204.9367088607596" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,1103.2911392405063 227.0886075949367,1103.2911392405063" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1437.5949367088606,1103.2911392405063 1530,1103.2911392405063 1530,1204.9367088607596 1437.5949367088606,1204.9367088607596" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1437.5949367088606,1103.2911392405063 1530,1103.2911392405063" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="143.9240506329114,1020.126582278481 199.36708860759492,964.6835443037975 328.73417721518985,964.6835443037975 421.1392405063291,983.1645569620254 467.34177215189874,1010.8860759493671 384.1772151898734,1057.0886075949368 273.2911392405063,1047.8481012658228 236.3291