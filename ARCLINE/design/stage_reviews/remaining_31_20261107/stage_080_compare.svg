<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">80：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1118"><title>実験炉を挟む発生器の両側</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 80｜実験炉を挟む発生器の両側</text><text x="38" y="83" font-size="19" fill="#afc2d2">炉と磁場の間から始め、左の制御域へ戻るか、右の点検床へ渡る。</text><polygon points="70,749.2391304347826 308.04347826086956,749.2391304347826 419.1304347826087,733.3695652173914 585.7608695652174,733.3695652173914 792.0652173913044,669.8913043478261 974.5652173913044,495.3260869565218 1268.1521739130435,495.3260869565218 1339.5652173913045,527.0652173913044 1339.5652173913045,892.0652173913044 70,892.0652173913044" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,749.2391304347826 308.04347826086956,749.2391304347826 419.1304347826087,733.3695652173914 585.7608695652174,733.3695652173914 792.0652173913044,669.8913043478261 974.5652173913044,495.3260869565218 1268.1521739130435,495.3260869565218 1339.5652173913045,527.0652173913044" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="141.41304347826087,495.3260869565218 189.02173913043478,455.65217391304355 403.2608695652174,455.65217391304355 442.9347826086957,495.3260869565218 379.45652173913044,535 204.8913043478261,535" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="609.5652173913044,384.2391304347827 665.1086956521739,344.5652173913044 760.3260869565217,344.5652173913044 807.9347826086956,384.2391304347827 744.4565217391305,431.84782608695656 680.9782608695652,431.84782608695656" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="926.9565217391305,542.9347826086957 974.5652173913044,495.3260869565218 974.5652173913044,368.36956521739137 926.9565217391305,384.2391304347827" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="921.7608695652174" y="455.65217391304355" font-size="15" fill="#ffe0ac">D03 1片</text><circle cx="720.6521739130435" cy="503.26086956521743" r="245.97826086956522" fill="#be75b9" fill-opacity=".1" stroke="#d49fd0" stroke-dasharray="5 6"/><text x="724.6521739130435" y="499.26086956521743" font-size="18" fill="#e2b5de">M +</text><rect x="448.80434782608694" y="675.7608695652175" width="20" height="20" fill="#e6bd73"/><text x="471.80434782608694" y="685.7608695652175" font-size="17" fill="#f1d398">T</text><ellipse cx="252.5" cy="731.7826086956522" rx="19.836956521739133" ry="19.043478260869566" fill="#74dec4"/><text x="242.5" y="702.7391304347826" font-size="18" fill="#74dec4">P0</text><ellipse cx="1157.0652173913043" cy="442.9565217391305" rx="38.08695652173913" ry="38.08695652173913" fill="#ff9bad"/><circle cx="1111.0434782608695" cy="471.52173913043487" r="15.869565217391306" fill="#f1c7d5" stroke="#fff0f3" stroke-width="1.5"/><circle cx="1203.086956521739" cy="471.52173913043487" r="15.869565217391306" fill="#f1c7d5" stroke="#fff0f3" stroke-width="1.5"/><text x="1147.0652173913043" y="394.86956521739137" font-size="18" fill="#ff9bad">E</text><text x="38" y="934.0652173913044" font-size="17" fill="#dae5ed">開始を中央の分岐へ移し、左右二基を同じ既存高さのまま狙い分ける点検床を設けた。</text><text x="38" y="971.0652173913044" font-size="17" fill="#dae5ed">中央から異なる側へ準備するボス戦。磁場の極性と発生器破壊の影響を比較し、70面の噴出周期とは分ける。</text><text x="38" y="1008.0652173913044" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1045.0652173913045" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1118"><title>実験炉を挟む発生器の両側</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-siz