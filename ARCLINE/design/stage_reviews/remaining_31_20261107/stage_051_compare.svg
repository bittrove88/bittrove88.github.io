<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">51：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1269"><title>風域の端を選ぶ観測丘</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 51｜風域の端を選ぶ観測丘</text><text x="38" y="83" font-size="19" fill="#afc2d2">130pxの山肩移動と、風域を外す谷出口を比較する。</text><polygon points="70,540.1408450704225 172.8169014084507,509.29577464788736 316.76056338028167,509.29577464788736 388.7323943661972,550.4225352112676 470.98591549295776,550.4225352112676 553.2394366197183,663.5211267605634 625.2112676056338,828.0281690140845 717.7464788732394,900 820.5633802816901,900 913.0985915492957,858.8732394366198 995.3521126760563,704.6478873239437 1067.323943661972,591.5492957746479 1149.5774647887324,591.5492957746479 1231.8309859154929,653.2394366197184 1355.2112676056338,663.5211267605634 1447.7464788732393,622.3943661971831 1530,684.0845070422536 1530,1043.943661971831 70,1043.943661971831" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,540.1408450704225 172.8169014084507,509.29577464788736 316.76056338028167,509.29577464788736 388.7323943661972,550.4225352112676 470.98591549295776,550.4225352112676 553.2394366197183,663.5211267605634 625.2112676056338,828.0281690140845 717.7464788732394,900 820.5633802816901,900 913.0985915492957,858.8732394366198 995.3521126760563,704.6478873239437 1067.323943661972,591.5492957746479 1149.5774647887324,591.5492957746479 1231.8309859154929,653.2394366197184 1355.2112676056338,663.5211267605634 1447.7464788732393,622.3943661971831 1530,684.0845070422536" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><rect x="512.1126760563379" y="303.661971830986" width="339.2957746478873" height="493.52112676056333" fill="#7cc9db" fill-opacity=".13" stroke="#7cc9db" stroke-dasharray="6 5"/><text x="518.1126760563379" y="326.661971830986" font-size="18" fill="#7cc9db">F</text><ellipse cx="275.6338028169014" cy="486.6760563380282" rx="25.704225352112672" ry="24.676056338028168" fill="#74dec4"/><text x="265.6338028169014" y="452.00000000000006" font-size="18" fill="#74dec4">P0</text><ellipse cx="1108.4507042253522" cy="568.9295774647887" rx="31.87323943661972" ry="29.8169014084507" fill="#ff9bad"/><text x="1098.4507042253522" y="529.112676056338" font-size="18" fill="#ff9bad">E</text><text x="38" y="1085.943661971831" font-size="17" fill="#dae5ed">観測丘を風食された前肩と背後の敵平坦部に整理。</text><text x="38" y="1122.943661971831" font-size="17" fill="#dae5ed">短い徒歩で風への入り方を変える面。逆勾配の往復や窓破壊を主題にしない。</text><text x="38" y="1159.943661971831" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1196.943661971831" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1269"><title>風域の端を選ぶ観測丘</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 51｜風域の端を選ぶ観測丘</text><text x="38" y="83" font-size="19" fill="#afc2d2">130pxの山肩移動と、風域を外す谷出口を比較する。</text><polygon points="70,540.1408450704225 172.8169014084507,509.29577464788736 316.76056338028167,509.29577464788736 388.7323943661972,550.4225352112676 470.98591549295776,550.4225352112676 553.2394366197183,663.5211267605634 625.2112676056338,828.0281690140845 717.7464788732394,900 820.5633802816901,900 913.0985915492957,858.8732394366198 995.3521126760563,704.6478873239437 1057.0422535211267,478.4507042253521 1118.7323943661972,591.5492957746479 1221.5492957746478,591.5492957746479 1355.2112676056338,663.5211267605634 1447.7464788732393,622.3943661971831 1530,684.0845070422536 1530,1043.943661971831 70