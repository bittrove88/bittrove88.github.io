<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1267" viewBox="0 0 1600 1267" role="img"><title>固定氷橋と下橋の残る足場</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 56｜固定氷橋と下橋の残る足場［周期2］</text><text x="38" y="83" font-size="19" fill="#afc2d2">下橋が開いても固定桟橋に残れることを読み、横断と射撃を分ける。</text><polygon points="70,332.2222222222222 211.94444444444446,372.7777777777777 374.1666666666667,372.7777777777777 445.1388888888889,372.7777777777777 465.4166666666667,433.6111111111111 495.83333333333337,494.4444444444444 546.5277777777778,636.3888888888889 546.5277777777778,1041.9444444444443 70,1041.9444444444443" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,332.2222222222222 211.94444444444446,372.7777777777777 374.1666666666667,372.7777777777777 445.1388888888889,372.7777777777777 465.4166666666667,433.6111111111111 495.83333333333337,494.4444444444444 546.5277777777778,636.3888888888889" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="952.0833333333334,636.3888888888889 1205.5555555555557,636.3888888888889 1286.6666666666667,514.7222222222222 1347.5,494.4444444444444 1479.3055555555557,494.4444444444444 1530,524.8611111111111 1530,1041.9444444444443 952.0833333333334,1041.9444444444443" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="952.0833333333334,636.3888888888889 1205.5555555555557,636.3888888888889 1286.6666666666667,514.7222222222222 1347.5,494.4444444444444 1479.3055555555557,494.4444444444444 1530,524.8611111111111" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="445.1388888888889,372.7777777777777 1002.7777777777778,372.7777777777777 1114.3055555555557,393.05555555555554 1165,433.6111111111111 1154.861111111111,524.8611111111111 1114.3055555555557,504.5833333333333 1023.0555555555555,453.8888888888888 658.0555555555555,423.4722222222222 526.25,413.33333333333326 465.4166666666667,403.19444444444434 445.1388888888889,393.05555555555554" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="678.3333333333334,687.0833333333333 708.75,636.3888888888889 820.2777777777778,636.3888888888889 860.8333333333334,676.9444444444443 810.1388888888889,717.5 729.0277777777778,717.5" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><rect x="617.5" y="210.55555555555554" width="334.58333333333337" height="385.27777777777777" fill="#7cc9db" fill-opacity=".13" stroke="#7cc9db" stroke-dasharray="6 5"/><text x="623.5" y="233.55555555555554" font-size="18" fill="#7cc9db">F</text><polygon points="546.5277777777778,636.3888888888889 779.144888075702,968.6005512949799 779.144888075702,980.7672179616466 546.5277777777778,648.5555555555555" fill="#8f9da9" stroke="#dce5ef" stroke-width="2" /><polyline points="779.7222222222223,342.3611111111111 1134.5833333333335,170 1408.3333333333335,464.0277777777777" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="1175.138888888889,605.9722222222222 1276.5277777777778,403.19444444444434 1408.3333333333335,464.0277777777777" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="779.7222222222223" cy="367.7777777777777" r="5" fill="#a4e7ee"/><text x="771.7222222222223" y="401.7777777777777" font-size="18" fill="#a4e7ee">A</text><circle cx="759.4444444444445" cy="631.3888888888889" r="5" fill="#a4e7ee"/><text x="751.4444444444445" y="665.3888888888889" font-size="18" fill="#a4e7ee">B</text><circle cx="1175.138888888889" cy="631.3888888888889" r="5" fill="#a4e7ee"/><text x="1167.138888888889" y="665.3888888888889" font-size="18" fill="#a4e7ee">C</text><ellipse cx="303.19444444444446" cy="350.4722222222222" rx="25.34722222222222" ry="24.333333333333336" fill="#74dec4"/><text x="293.19444444444446" y="316.1388888888888" font-size="18" fill="#74dec4">P0</text><ellipse cx="1408.3333333333335" cy="472.13888888888886" rx="31.430555555555554" ry="29.40277777777778" fill="#ff9bad"/><text x="1398.3333333333335" y="432.7361111111111" font-size="18" fill="#ff9bad">E</text><text x="38" y="1083.9444444444443" font-size="17" fill="#dae5ed">画像で指定された左の接合部の下側と、右下の氷舌先端だけを削った。固定上橋・周期下橋・桟橋・敵味方位置は維持。</text><text x="38" y="1120.9444444444443" font-size="17" fill="#dae5ed">一本の周期橋と長い固定橋の関係。多数の逆位相橋を扱う98面とは異なる。</text><text x="38" y="1157.9444444444443" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1194.9444444444443" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>