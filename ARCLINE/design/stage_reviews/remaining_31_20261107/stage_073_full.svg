<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1271" viewBox="0 0 1600 1271" role="img"><title>磁場へ入る二つの向き</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 73｜磁場へ入る二つの向き</text><text x="38" y="83" font-size="19" fill="#afc2d2">下段から横に入るか、高棚から折り返して同じ磁場へ入る。</text><polygon points="70,880.5333333333333 216,870.8 391.2,870.8 469.0666666666666,851.3333333333333 644.2666666666667,851.3333333333333 809.7333333333332,783.1999999999999 945.9999999999999,695.5999999999999 1092,598.2666666666667 1286.6666666666665,520.4 1529.9999999999998,520.4 1529.9999999999998,1046 70,1046" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,880.5333333333333 216,870.8 391.2,870.8 469.0666666666666,851.3333333333333 644.2666666666667,851.3333333333333 809.7333333333332,783.1999999999999 945.9999999999999,695.5999999999999 1092,598.2666666666667 1286.6666666666665,520.4 1529.9999999999998,520.4" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,569.0666666666666 313.3333333333333,539.8666666666666 439.8666666666666,598.2666666666667 439.8666666666666,715.0666666666666 70,705.3333333333333" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="975.1999999999999,676.1333333333332 1053.0666666666666,627.4666666666666 1053.0666666666666,267.33333333333326 1014.1333333333332,247.86666666666667 975.1999999999999,306.26666666666665" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="985.1333333333332" y="462" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="663.7333333333332,393.8666666666667 741.5999999999999,316 848.6666666666666,316 916.8,354.9333333333333 926.5333333333333,413.33333333333326 819.4666666666666,423.0666666666666 731.8666666666666,462 673.4666666666666,442.5333333333333" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><circle cx="809.7333333333332" cy="598.2666666666667" r="233.59999999999997" fill="#be75b9" fill-opacity=".1" stroke="#d49fd0" stroke-dasharray="5 6"/><text x="813.7333333333332" y="594.2666666666667" font-size="18" fill="#e2b5de">M +</text><rect x="478.5333333333333" y="782.9333333333333" width="20" height="20" fill="#e6bd73"/><text x="501.5333333333333" y="792.9333333333333" font-size="17" fill="#f1d398">T</text><polyline points="566.4,822.1333333333332 702.6666666666666,676.1333333333332 877.8666666666666,559.3333333333333 1121.1999999999998,520.4 1393.7333333333331,491.19999999999993" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="799.9999999999999,286.79999999999995 624.8,238.13333333333333 546.9333333333333,452.26666666666665 673.4666666666666,569.0666666666666 916.8,530.1333333333332 955.7333333333332,403.5999999999999 955.7333333333332,189.4666666666667 1179.6,170 1393.7333333333331,491.19999999999993" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="566.4" cy="846.3333333333333" r="5" fill="#a4e7ee"/><text x="558.4" y="880.3333333333333" font-size="18" fill="#a4e7ee">A</text><circle cx="799.9999999999999" cy="311" r="5" fill="#a4e7ee"/><text x="791.9999999999999" y="345" font-size="18" fill="#a4e7ee">B</text><ellipse cx="498.26666666666665" cy="829.92" rx="24.333333333333332" ry="23.359999999999996" fill="#74dec4"/><text x="488.26666666666665" y="796.56" font-size="18" fill="#74dec4">P0</text><ellipse cx="1393.7333333333331" cy="498.9866666666666" rx="30.17333333333333" ry="28.226666666666667" fill="#ff9bad"/><text x="1383.7333333333331" y="460.76" font-size="18" fill="#ff9bad">E</text><text x="38" y="1088" font-size="17" fill="#dae5ed">開始を庇の外へ移し、磁場を避けるだけだった高棚にも異なる入射を持たせた。</text><text x="38" y="1125" font-size="17" fill="#dae5ed">Tを必須の通行鍵にせず、Mの入り方と極性を比較する採掘場。二枚隔壁の破壊順とは区別。</text><text x="38" y="1162" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1199" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>