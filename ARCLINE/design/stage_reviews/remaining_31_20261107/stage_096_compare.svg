"/><polyline points="569.8913043478261,423.91304347826076 633.3695652173914,360.4347826086956" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="633.3695652173914,360.4347826086956 760.3260869565217,296.9565217391304" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="760.3260869565217,296.9565217391304 863.4782608695652,296.9565217391304" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="585.7608695652174,939.6739130434783 680.9782608695652,963.4782608695651" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="768.2608695652174" cy="946.0217391304348" rx="19.836956521739133" ry="19.043478260869566" fill="#74dec4"/><text x="758.2608695652174" y="916.9782608695651" font-size="18" fill="#74dec4">P0</text><ellipse cx="276.304347826087" cy="652.4347826086956" rx="24.597826086956523" ry="23.01086956521739" fill="#ff9bad"/><text x="266.304347826087" y="619.4239130434781" font-size="18" fill="#ff9bad">E</text><text x="38" y="1148.304347826087" font-size="17" fill="#dae5ed">大きな上部アーチの中央を開放。Wを二つのアーチの間の床だけに移し、内周射点の頭上と反射の実体を整理。</text><text x="38" y="1185.304347826087" font-size="17" fill="#dae5ed">開けた西門を再利用する内周と、門を残したまま外を回る経路。TはMの旋回を選ぶ操作で、必須の通行スイッチにはしない。</text><text x="38" y="1222.304347826087" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1259.304347826087" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1332"><title>環頂を開けた極性施設</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 96｜環頂を開けた極性施設</text><text x="38" y="83" font-size="19" fill="#afc2d2">環の内側から西門を一片開きW/Mをつなぐか、開いた環頂から外周棚へ出る。</text><polygon points="70,693.695652173913 165.2173913043478,669.891304347826 347.7173913043478,669.89