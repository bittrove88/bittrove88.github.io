="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="997.5294117647059,805.5294117647056 1031.8823529411766,788.3529411764705" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="1031.8823529411766,788.3529411764705 1083.4117647058824,788.3529411764705" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="1083.4117647058824,788.3529411764705 1169.2941176470588,753.9999999999998" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="301.88235294117646" cy="924.0470588235293" rx="21.470588235294116" ry="20.611764705882354" fill="#74dec4"/><text x="291.88235294117646" y="893.4352941176469" font-size="18" fill="#74dec4">P0</text><ellipse cx="1341.0588235294117" cy="546.1647058823528" rx="26.623529411764707" ry="24.905882352941177" fill="#ff9bad"/><text x="1331.0588235294117" y="511.25882352941164" font-size="18" fill="#ff9bad">E</text><text x="38" y="1208.2352941176468" font-size="17" fill="#dae5ed">大きな四片ハッチを常設の上向き通路と任意一片へ整理。床自身をWにし上段まで鏡になる重なりを避けた。</text><text x="38" y="1245.2352941176468" font-size="17" fill="#dae5ed">下甲板で一度反射してから上向きに抜く船。反射経路とUへの入射は異なる高さから始め、浮遊ボスの90面とは別にする。</text><text x="38" y="1282.2352941176468" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1319.2352941176468" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1392"><title>下甲板の反射湾と上昇棚</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 86｜下甲板の反射湾と上昇棚</text><text x="38" y="83" font-size="19" fill="#afc2d2">作業桁の下を通した反射弾を雲へ入れるか、上昇棚からUで船外へ送る。</text><polygon points="70,960.1176470588233 173.05882352941177,942.9411764705881 336.2352941176471,942.9411764705881 439.2941176470588,960.1176470588233 671.1764705882352,960.117647058823