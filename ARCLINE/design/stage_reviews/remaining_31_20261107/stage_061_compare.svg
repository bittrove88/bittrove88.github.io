<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">61：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1392"><title>門を狙う中継岩棚</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 61｜門を狙う中継岩棚</text><text x="38" y="83" font-size="19" fill="#afc2d2">門前へ渡る準備と、高尾根から門を越す照準を比較する。</text><polygon points="70,743.9310344827587 210.9655172413793,683.5172413793105 351.9310344827586,683.5172413793105 412.34482758620686,613.0344827586208 472.7586206896552,613.0344827586208 482.8275862068965,673.4482758620691 482.8275862068965,1166.8275862068967 70,1166.8275862068967" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,743.9310344827587 210.9655172413793,683.5172413793105 351.9310344827586,683.5172413793105 412.34482758620686,613.0344827586208 472.7586206896552,613.0344827586208 482.8275862068965,673.4482758620691" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1036.6206896551723,784.2068965517242 1157.4482758620688,613.0344827586208 1429.3103448275863,613.0344827586208 1530,673.4482758620691 1530,1166.8275862068967 1036.6206896551723,1166.8275862068967" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1036.6206896551723,784.2068965517242 1157.4482758620688,613.0344827586208 1429.3103448275863,613.0344827586208 1530,673.4482758620691" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="583.5172413793103,854.689655172414 654,804.344827586207 825.1724137931034,804.344827586207 875.5172413793103,844.6206896551726 805.0344827586207,894.9655172413794 654,894.9655172413794" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="583.5172413793103,633.1724137931035 654,592.896551724138 704.3448275862069,613.0344827586208 704.3448275862069,673.4482758620691 583.5172413793103,703.6551724137933" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1137.3103448275863,633.1724137931035 1197.7241379310344,613.0344827586208 1197.7241379310344,411.65517241379325 1137.3103448275863,441.8620689655173" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="1138.5172413793102" y="522.4137931034484" font-size="15" fill="#ffe0ac">D03 1片</text><ellipse cx="291.51724137931035" cy="661.3655172413794" rx="25.17241379310345" ry="24.16551724137931" fill="#74dec4"/><text x="281.51724137931035" y="627.2000000000002" font-size="18" fill="#74dec4">P0</text><ellipse cx="1298.4137931034481" cy="590.8827586206897" rx="31.213793103448275" ry="29.2" fill="#ff9bad"/><text x="1288.4137931034481" y="551.6827586206898" font-size="18" fill="#ff9bad">E</text><text x="38" y="1208.8275862068967" font-size="17" fill="#dae5ed">中継棚の射点を広げ、後方の短い庇と射撃縁を離す。</text><text x="38" y="1245.8275862068967" font-size="17" fill="#dae5ed">一つの要塞門と対岸への中継。破壊順序の面にはしない。</text><text x="38" y="1282.8275862068967" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1319.8275862068967" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1392"><title>門を狙う中継岩棚</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 61｜門を狙う中継岩棚</text><text x="38" y="83" font-size="19" fill="#afc2d2">門前へ渡る準備と、高尾根から門を越す照準を比較する。</text><polygon points="70,743.9310344827587 210.9655172413793,683.5172413793105 351.9310344827586,683.5172413793105 412.34482758620686,613.0344827586208 472.7586206896552,613.0344827586208 482.8275862068965,673.4482758620691 482.8275862068965,1166.8275862068967 70,1166.8275862068967" fill="#354e5c" stroke="none" stro