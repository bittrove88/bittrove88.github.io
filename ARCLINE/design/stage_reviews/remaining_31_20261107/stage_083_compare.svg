329" rx="28.645569620253163" ry="26.79746835443038" fill="#ff9bad"/><text x="1316.7088607594935" y="630.3417721518986" font-size="18" fill="#ff9bad">E</text><text x="38" y="1182.253164556962" font-size="17" fill="#dae5ed">開始上の二つの天井窓を撤去し、鉛直の側窓一片と常設の斜め開口に分けた。</text><text x="38" y="1219.253164556962" font-size="17" fill="#dae5ed">Cに入る長さとFへの進入を読み分ける。雲は視線遮断や防壁ではなく、一度だけ弾を減速する。</text><text x="38" y="1256.253164556962" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1293.253164556962" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1366"><title>雲の横窓と風に届く斜めの裂け目</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 83｜雲の横窓と風に届く斜めの裂け目</text><text x="38" y="83" font-size="19" fill="#afc2d2">横窓から雲を長く通すか、斜めの裂け目から雲の上端を越えて風へ入れる。</text><polygon points="70,1038.6075949367087 236.32911392405063,1038.6075949367087 236.32911392405063,1140.253164556962 70,1140.253164556962" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,1038.6075949367087 236.32911392405063,1038.6075949367087" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1419.113924050633,1038.6075949367087 1530,1038.6075949367087 1530,1140.253164556962 1419.113924050633,1140.253164556962" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1419.113924050633,1038.6075949367087 1530,1038.6075949367087" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="143.9240506329114,798.3544303797468 236.32911392405063,752.1518987341772 513.5443037974683,752.1518987341772 568.9873417721519,789.1139240506328 495.0632911392405,844.5569620253164 384.1772151898734,853.7974683544303 264.0506329113924,890.759493670886 180.88607594936707,853.7974683544303" fill="#456c7f" stroke="#b7d3d