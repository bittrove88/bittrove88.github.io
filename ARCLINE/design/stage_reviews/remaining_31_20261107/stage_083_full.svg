<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1366" viewBox="0 0 1600 1366" role="img"><title>雲の横窓と風に届く斜めの裂け目</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 83｜雲の横窓と風に届く斜めの裂け目</text><text x="38" y="83" font-size="19" fill="#afc2d2">横窓から雲を長く通すか、斜めの裂け目から雲の上端を越えて風へ入れる。</text><polygon points="70,1038.6075949367087 236.32911392405063,1038.6075949367087 236.32911392405063,1140.253164556962 70,1140.253164556962" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,1038.6075949367087 236.32911392405063,1038.6075949367087" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1419.113924050633,1038.6075949367087 1530,1038.6075949367087 1530,1140.253164556962 1419.113924050633,1140.253164556962" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1419.113924050633,1038.6075949367087 1530,1038.6075949367087" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="143.9240506329114,798.3544303797468 236.32911392405063,752.1518987341772 513.5443037974683,752.1518987341772 568.9873417721519,789.1139240506328 495.0632911392405,844.5569620253164 384.1772151898734,853.7974683544303 264.0506329113924,890.759493670886 180.88607594936707,853.7974683544303" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="568.9873417721519,779.8734177215189 661.3924050632911,779.8734177215189 661.3924050632911,613.5443037974683 568.9873417721519,613.5443037974683" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="586.1898734177215" y="696.7088607594935" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="550.506329113924,484.1772151898733 615.1898734177215,484.1772151898733 689.1139240506329,317.8481012658227 790.7594936708861,354.8101265822784 790.7594936708861,502.6582278481012 670.632911392405,539.6202531645569 550.506329113924,585.8227848101264" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1151.139240506329,742.9113924050632 1206.5822784810125,687.4683544303796 1446.8354430379745,687.4683544303796 1493.0379746835442,733.6708860759493 1400.632911392405,789.1139240506328 1252.7848101265822,789.1139240506328" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><rect x="605.9493670886076" y="511.89873417721515" width="498.98734177215186" height="286.4556962025316" fill="#a9a3d4" fill-opacity=".13" stroke="#a9a3d4" stroke-dasharray="6 5"/><text x="611.9493670886076" y="534.8987341772151" font-size="18" fill="#a9a3d4">C</text><rect x="883.1645569620252" y="354.8101265822784" width="304.9367088607595" height="249.49367088607593" fill="#7cc9db" fill-opacity=".13" stroke="#7cc9db" stroke-dasharray="6 5"/><text x="889.1645569620252" y="377.8101265822784" font-size="18" fill="#7cc9db">F</text><polyline points="476.5822784810126,724.4303797468353 624.4303797468355,678.2278481012657 855.4430379746835,613.5443037974683 1104.9367088607594,530.3797468354429 1326.7088607594935,659.7468354430379" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="587.4683544303797,456.4556962025316 624.4303797468355,280.88607594936707 772.2784810126582,169.9999999999999 1049.493670886076,336.3291139240506 1141.8987341772151,410.2531645569619 1326.7088607594935,659.7468354430379" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="476.5822784810126" cy="747.1518987341772" r="5" fill="#a4e7ee"/><text x="468.5822784810126" y="781.1518987341772" font-size="18" fill="#a4e7ee">A</text><circle cx="587.4683544303797" cy="479.1772151898733" r="5" fill="#a4e7ee"/><text x="579.4683544303797" y="513.1772151898733" font-size="18" fill="#a4e7ee">B</text><ellipse cx="310.253164556962" cy="731.8227848101266" rx="23.101265822784807" ry="22.177215189873415" fill="#74dec4"/><text x="300.253164556962" y="699.6455696202531" font-size="18" fill="#74dec4">P0</text><ellipse cx="1326.7088607594935" cy="667.139240506329" rx="28.645569620253163" ry="26.79746835443038" fill="#ff9bad"/><text x="1316.7088607594935" y="630.3417721518986" font-size="18" fill="#ff9bad">E</text><text x="38" y="1182.253164556962" font-size="17" fill="#dae5ed">開始上の二つの天井窓を撤去し、鉛直の側窓一片と常設の斜め開口に分けた。</text><text x="38" y="1219.253164556962" font-size="17" fill="#dae5ed">Cに入る長さとFへの進入を読み分ける。雲は視線遮断や防壁ではなく、一度だけ弾を減速する。</text><text x="38" y="1256.253164556962" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1293.253164556962" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>