ext x="502.43564356435644" y="445.970297029703" font-size="18" fill="#e3a276">V ON</text><polygon points="438.61386138613864,509.7029702970297 533.3054580514063,306.6361859342635 533.3054580514063,315.3094532609962 438.61386138613864,518.3762376237624" fill="#8f9da9" stroke="#dce5ef" stroke-width="2" /><polygon points="951.7821782178218,314.5544554455446 1183.069306930693,314.5544554455446 1183.069306930693,323.2277227722773 951.7821782178218,323.2277227722773" fill="#8f9da9" stroke="#dce5ef" stroke-width="2" /><polyline points="539.8019801980198,679.95599559956 597.6237623762377,654.2574257425742" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><text x="279.6039603960396" y="148.3168316831683" font-size="17" fill="#f2db9a">B1上昇：中継経路を遮る</text><text x="872.2772277227723" y="148.3168316831683" font-size="17" fill="#f2db9a">B2水平：Aを遮断。Bへ切替</text><polyline points="792.7722772277228,488.01980198019805 879.5049504950496,220.59405940594058 973.4653465346535,191.6831683168317 1096.3366336633665,263.960396039604 1392.6732673267327,574.7524752475248" fill="none" stroke="#f28c98" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M1137.5774810039145,307.5544554455446l14,14m-14,0l14,-14" stroke="#ff6d83" stroke-width="3"/><polyline points="1211.980198019802,639.8019801980198 1240.8910891089108,329.009900990099 1327.6237623762377,300.0990099009901 1392.6732673267327,574.7524752475248" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="388.01980198019805,488.01980198019805 575.940594059406,437.42574257425747 792.7722772277228,509.7029702970297" fill="none" stroke="#f28c98" stroke-width="2.5" stroke-dasharray="8 7"/><path d="M450.44023307818264,462.329685915356l14,14m-14,0l14,-14" stroke="#ff6d83" stroke-width="3"/><circle cx="792.7722772277228" cy="504.7029702970297" r="5" fill="#a4e7ee"/><text x="784.7722772277228" y="538.7029702970297" font-size="18" fill="#a4e7ee">A</text><circle cx="1211.980198019802" cy="656.4851485148515" r="5" fill="#a4e7ee"/><text x="1203.980198019802" y="690.4851485148515" font-size="18" fill="#a4e7ee">B</text><circle cx="388.01980198019805" cy="504.7029702970297" r="5" fill="#a4e7ee"/><text x="380.01980198019805" y="538.7029702970297" font-size="18" fill="#a4e7ee">C</text><ellipse cx="243.46534653465346" cy="298.6534653465347" rx="18.06930693069307" ry="17.346534653465348" fill="#74dec4"/><text x="233.46534653465346" y="271.3069306930693" font-size="18" fill="#74dec4">P0</text><ellipse cx="1392.6732673267327" cy="580.5346534653465" rx="22.40594059405941" ry="20.96039603960396" fill="#ff9bad"/><text x="1382.6732673267327" y="549.5742574257426" font-size="18" fill="#ff9bad">E</text><text x="38" y="869.7227722772277" font-size="17" fill="#dae5ed">大きな固定上橋を九つの役割の異なる島に刷新し、二本のBを逆位相に配置。固定島はどちらの状態でも残る。</text><text x="38" y="906.7227722772277" font-size="17" fill="#dae5ed">橋の姿勢が中継と射撃の空間を交替させる。島を高度順に巡る97面や、二峰で転移先を選ぶ99面とは異なる。</text><text x="38" y="943.7227722772277" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="980.7227722772277" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>