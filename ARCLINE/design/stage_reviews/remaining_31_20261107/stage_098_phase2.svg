<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1053" viewBox="0 0 1600 1053" role="img"><title>逆位相の橋と九つの固定島</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 98｜逆位相の橋と九つの固定島［周期2］</text><text x="38" y="83" font-size="19" fill="#afc2d2">西の橋が水平な間に中継へ渡り、東の橋が下降した間の降下帯を使う。次の状態では東側の独立低島を選ぶ。</text><polygon points="70,755.4455445544555 120.5940594059406,755.4455445544555 120.5940594059406,827.7227722772277 70,827.7227722772277" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,755.4455445544555 120.5940594059406,755.4455445544555" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1486.6336633663366,755.4455445544555 1530,755.4455445544555 1530,827.7227722772277 1486.6336633663366,827.7227722772277" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1486.6336633663366,755.4455445544555 1530,755.4455445544555" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="127.82178217821783,365.1485148514852 178.41584158415841,314.5544554455446 294.05940594059405,314.5544554455446 330.1980198019802,365.1485148514852 279.6039603960396,415.74257425742576 207.32673267326734,394.0594059405941 171.1881188118812,422.970297029703" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="330.1980198019802,553.0693069306931 359.1089108910891,509.7029702970297 438.61386138613864,509.7029702970297 460.2970297029703,545.8415841584159 424.15841584158414,589.2079207920792 373.56435643564356,581.980198019802" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="633.7623762376238,553.0693069306931 669.90099009901,509.7029702970297 828.910891089109,509.7029702970297 865.049504950495,545.8415841584159 800,610.8910891089109 734.950495049505,581.980198019802 691.5841584158416,618.1188118811881" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><po