4096385" ry="25.506024096385538" fill="#ff9bad"/><text x="1159.3975903614457" y="264.6626506024096" font-size="18" fill="#ff9bad">E</text><text x="38" y="906.8192771084337" font-size="17" fill="#dae5ed">上棚からの高弧だけの別解をやめ、敵砲座の反対側に開放した裏手を作った。</text><text x="38" y="943.8192771084337" font-size="17" fill="#dae5ed">反射準備を残して低所に留まるか、敵の反対側まで転移するかを比較。74面の鉱床上面へ上る別解は繰り返さない。</text><text x="38" y="980.8192771084337" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1017.8192771084337" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>