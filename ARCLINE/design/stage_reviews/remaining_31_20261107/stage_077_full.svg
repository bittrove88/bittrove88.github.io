<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1348" viewBox="0 0 1600 1348" role="img"><title>端子の磁場路と独立した鏡路</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 77｜端子の磁場路と独立した鏡路</text><text x="38" y="83" font-size="19" fill="#afc2d2">開始近くでTとMを選ぶか、横扉の先のWへ移って反射する。二経路を同じ弾の必須連鎖にしない。</text><polygon points="70,952.8985507246376 874.0579710144929,952.8985507246376 1001.0144927536232,825.9420289855072 1149.1304347826087,900 1339.5652173913045,847.1014492753623 1530,847.1014492753623 1530,1122.1739130434783 70,1122.1739130434783" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,952.8985507246376 874.0579710144929,952.8985507246376 1001.0144927536232,825.9420289855072 1149.1304347826087,900 1339.5652173913045,847.1014492753623 1530,847.1014492753623" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,561.4492753623188 196.95652173913044,550.8695652173913 228.69565217391306,603.7681159420289 228.69565217391306,709.5652173913043 70,698.9855072463768" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="567.2463768115942,952.8985507246376 651.8840579710145,952.8985507246376 651.8840579710145,635.5072463768115 567.2463768115942,635.5072463768115" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="580.5652173913044" y="794.2028985507245" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="651.8840579710145,572.0289855072463 757.6811594202899,582.6086956521738 757.6811594202899,677.8260869565217 651.8840579710145,635.5072463768115" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1032.753623188406,572.0289855072463 1106.8115942028987,593.1884057971014 1106.8115942028987,698.9855072463768 1032.753623188406,688.4057971014493" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1212.608695652174,667.2463768115941 1350.144927536232,466.2318840579709 1530,466.2318840579709 1530,540.2898550724636 1350.144927536232,614.3478260869565 1276.0869565217392,709.5652173913043" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><circle cx="747.1014492753624" cy="466.2318840579709" r="190.43478260869566" fill="#be75b9" fill-opacity=".1" stroke="#d49fd0" stroke-dasharray="5 6"/><text x="751.1014492753624" y="462.2318840579709" font-size="18" fill="#e2b5de">M +</text><rect x="462.02898550724643" y="837.1014492753623" width="20" height="20" fill="#e6bd73"/><text x="485.02898550724643" y="847.1014492753623" font-size="17" fill="#f1d398">T</text><polyline points="874.0579710144929,952.8985507246376 1001.0144927536232,825.9420289855072" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="440.2898550724638,921.159420289855 588.4057971014494,508.5507246376811 757.6811594202899,349.855072463768 990.4347826086957,244.05797101449264 1392.4637681159422,434.49275362318826" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="821.1594202898551,921.159420289855 916.376811594203,910.5797101449275 1022.1739130434784,318.1159420289854 1223.1884057971015,169.9999999999999 1392.4637681159422,434.49275362318826" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="440.2898550724638" cy="947.8985507246376" r="5" fill="#a4e7ee"/><text x="432.2898550724638" y="981.8985507246376" font-size="18" fill="#a4e7ee">A</text><circle cx="821.1594202898551" cy="947.8985507246376" r="5" fill="#a4e7ee"/><text x="813.1594202898551" y="981.8985507246376" font-size="18" fill="#a4e7ee">B</text><ellipse cx="323.9130434782609" cy="929.623188405797" rx="26.449275362318843" ry="25.391304347826086" fill="#74dec4"/><text x="313.9130434782609" y="894.231884057971" font-size="18" fill="#74dec4">P0</text><ellipse cx="1392.4637681159422" cy="442.9565217391303" rx="32.79710144927536" ry="30.681159420289855" fill="#ff9bad"/><text x="1382.4637681159422" y="402.27536231884045" font-size="18" fill="#ff9bad">E</text><text x="38" y="1164.1739130434783" font-size="17" fill="#dae5ed">Mを左上の制御域へ分離し、Wは右の一体斜面へ。二つの射点は低い同高度に保ち、上は危険・下は安全の二択を避けた。</text><text x="38" y="1201.1739130434783" font-size="17" fill="#dae5ed">近いT/Mの操作と、横扉を越えるWの準備を比較する。反射と磁場を全部つなぐ正解や、右裏への回り込み別解を繰り返さない。</text><text x="38" y="1238.1739130434783" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1275.1739130434783" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>