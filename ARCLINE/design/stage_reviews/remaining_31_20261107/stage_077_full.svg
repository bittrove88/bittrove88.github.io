<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1090" viewBox="0 0 1600 1090" role="img"><title>制御回廊と砲座の裏側</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 77｜制御回廊と砲座の裏側</text><text x="38" y="83" font-size="19" fill="#afc2d2">低い制御室でWとMを使うか、砲座の右裏へ渡って左向きに攻める。</text><polygon points="70,724.0963855421686 738.433734939759,724.0963855421686 843.9759036144578,697.7108433734938 967.1084337349397,680.1204819277108 1125.421686746988,636.144578313253 1529.9999999999998,636.144578313253 1529.9999999999998,864.8192771084337 70,864.8192771084337" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,724.0963855421686 738.433734939759,724.0963855421686 843.9759036144578,697.7108433734938 967.1084337349397,680.1204819277108 1125.421686746988,636.144578313253 1529.9999999999998,636.144578313253" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,398.6746987951807 175.5421686746988,389.8795180722891 201.9277108433735,433.8554216867469 201.9277108433735,521.8072289156626 70,513.0120481927711" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="483.37349397590356,724.0963855421686 553.734939759036,724.0963855421686 553.734939759036,460.2409638554216 483.37349397590356,460.2409638554216" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="489.5542168674699" y="592.1686746987951" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="553.734939759036,407.4698795180722 641.6867469879518,416.2650602409638 641.6867469879518,495.4216867469879 553.734939759036,460.2409638554216" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="870.3614457831325,407.4698795180722 931.9277108433735,425.06024096385534 931.9277108433735,513.0120481927711 870.3614457831325,504.21686746987945" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1019.8795180722891,486.6