<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1228" viewBox="0 0 1600 1228" role="img"><title>二峰の間で転移先を選ぶ</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 99｜二峰の間で転移先を選ぶ</text><text x="38" y="83" font-size="19" fill="#afc2d2">中央の短い中継島、谷の低い鏡島、敵側の外周高所から、弧・W/C/M・逆向き射撃を選ぶ。</text><polygon points="70,827 274.4,827 332.8,732.1 413.09999999999997,571.5 471.5,513.0999999999999 522.5999999999999,520.4 595.6,644.5 668.6,783.2 712.4,856.1999999999999 829.1999999999999,856.1999999999999 902.1999999999999,819.7 946,681 989.8,498.5 1033.6,396.29999999999995 1077.4,418.20000000000005 1143.1,571.5 1216.1,724.8 1296.3999999999999,827 1530,827 1530,1002.1999999999999 70,1002.1999999999999" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,827 274.4,827 332.8,732.1 413.09999999999997,571.5 471.5,513.0999999999999 522.5999999999999,520.4 595.6,644.5 668.6,783.2 712.4,856.1999999999999 829.1999999999999,856.1999999999999 902.1999999999999,819.7 946,681 989.8,498.5 1033.6,396.29999999999995 1077.4,418.20000000000005 1143.1,571.5 1216.1,724.8 1296.3999999999999,827 1530,827" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="632.1,549.5999999999999 668.6,505.8 719.6999999999999,505.8 741.6,542.3 705.1,578.8 661.3,571.5" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="727,827 748.9,805.1 807.3,805.1 821.9,827 792.6999999999999,841.6 748.9,841.6" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="1398.6,600.7 1435.1,564.2 1515.3999999999999,564.2 1530,608 1478.8999999999999,637.2 1427.8,622.5999999999999" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><rect x="880.3" y="608" width="102.2" height="146" fill="#a9a3d4" fill-opacity=".13" stroke="#a9a3d4" stroke-dasharray="6 5"/><text x="886.3" y="631" font-size="18" fill="#a9a3d4">C</text><circle cx="931.4" cy="491.2" r="146" fill="#be75b9" fill-opacity=".1" stroke="#d49fd0" stroke-dasharray="5 6"/><text x="935.4" y="487.2" font-size="18" fill="#e2b5de">M −</text><polyline points="829.1999999999999,856.1999999999999 902.1999999999999,819.7" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><text x="639.4" y="615.3" font-size="17" fill="#f2db9a">中継：通常の弧</text><text x="727" y="921.9" font-size="17" fill="#f2db9a">低島：W→C→M</text><text x="1369.3999999999999" y="673.7" font-size="17" fill="#f2db9a">外周：左向き</text><polyline points="690.5,483.9 851.1,206.5 1084.6999999999998,170 1340.2,805.1" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="1486.2,542.3 1405.8999999999999,381.70000000000005 1340.2,805.1" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="778.1,783.2 873,834.3 916.8,666.4 931.4,513.0999999999999 989.8,316 1143.1,286.79999999999995 1340.2,805.1" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="690.5" cy="500.8" r="5" fill="#a4e7ee"/><text x="682.5" y="534.8" font-size="18" fill="#a4e7ee">A</text><circle cx="1486.2" cy="559.2" r="5" fill="#a4e7ee"/><text x="1478.2" y="593.2" font-size="18" fill="#a4e7ee">B</text><circle cx="778.1" cy="800.1" r="5" fill="#a4e7ee"/><text x="770.1" y="834.1" font-size="18" fill="#a4e7ee">C</text><ellipse cx="186.8" cy="810.94" rx="18.25" ry="17.52" fill="#74dec4"/><text x="176.8" y="783.42" font-size="18" fill="#74dec4">P0</text><ellipse cx="1340.2" cy="810.94" rx="22.63" ry="21.169999999999998" fill="#ff9bad"/><text x="1330.2" y="779.77" font-size="18" fill="#ff9bad">E</text><text x="38" y="1044.1999999999998" font-size="17" fill="#dae5ed">中央核空洞と隔壁を、非対称の自然な二峰と三つの独立足場へ全面刷新。旧案の内側・複合反射・外周逆向きの核を引き継ぐ。</text><text x="38" y="1081.1999999999998" font-size="17" fill="#dae5ed">二峰が地上の直射を遮り、どこへ転移するかで使うギミックと入射方向が変わる最終通常面。橋周期や全面反射室にはしない。</text><text x="38" y="1118.1999999999998" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1155.1999999999998" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>