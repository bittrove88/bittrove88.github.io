#e3a276" fill-opacity=".04" stroke="#88909c" stroke-dasharray="6 5"/><text x="731.1282051282052" y="380.1794871794872" font-size="18" fill="#e3a276">V OFF</text><polyline points="699.2680513308395,490.5448717948718 788.4242563614682,542.0192307692307" fill="none" stroke="#c5e8fb" stroke-width="5" stroke-dasharray=""/><polyline points="285.2564102564103,834.4871794871794 547.3076923076924,834.4871794871794" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="547.3076923076924,834.4871794871794 556.6666666666667,830.9775641025641" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="425.64102564102564,413.33333333333337 547.3076923076924,366.53846153846155" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="1305.3846153846155" cy="149.4102564102564" rx="23.397435897435898" ry="22.461538461538463" fill="#74dec4"/><text x="1295.3846153846155" y="116.94871794871794" font-size="18" fill="#74dec4">P0</text><ellipse cx="350.7692307692308" cy="813.8974358974358" rx="29.012820512820515" ry="27.141025641025642" fill="#ff9bad"/><text x="340.7692307692308" y="776.7564102564102" font-size="18" fill="#ff9bad">E</text><text x="38" y="1044.948717948718" font-size="17" fill="#dae5ed">高所から窓を開く旧案を全面刷新。少数の床隆起と天井の下向き段差を持つ、上下全面反射の細長い室にした。</text><text x="38" y="1081.948717948718" font-size="17" fill="#dae5ed">上下反射の順序と接触位置が主題。屋外二峰の99面、多島と橋の98面とは分ける。</text><text x="38" y="1118.948717948718" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1155.948717948718" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1228"><title>床と天井を選ぶ検査反射室</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 93｜床と天井を選ぶ検査反射室</text><text x="38" y="83" font-size="19" fi