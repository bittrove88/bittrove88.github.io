床の下面と上面で進入経路を変える。上下とも長い高弧にする構成を避ける。</text><text x="38" y="1360.142857142857" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1397.142857142857" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1470"><title>鉱床の下を通す鏡路</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 74｜鉱床の下を通す鏡路</text><text x="38" y="83" font-size="19" fill="#afc2d2">床の鏡から鉱床の下へ通すか、鉱床上から右の出口へ落とす。</text><polygon points="70,1035.5714285714284 362,1035.5714285714284 424.57142857142856,1077.2857142857142 581,1077.2857142857142 695.7142857142858,1045.9999999999998 935.5714285714286,1045.9999999999998 977.2857142857143,962.5714285714284 1050.2857142857142,962.5714285714284 1112.857142857143,1045.9999999999998 1530,1045.9999999999998 1530,1244.142857142857 70,1244.142857142857" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,1035.5714285714284 362,1035.5714285714284 424.57142857142856,1077.2857142857142 581,1077.2857142857142 695.7142857142858,1045.9999999999998 935.5714285714286,1045.9999999999998 977.2857142857143,962.5714285714284 1050.2857142857142,962.5714285714284 1112.857142857143,1045.9999999999998 1530,1045.9999999999998" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,680.9999999999999 299.42857142857144,691.4285714285713 382.8571428571429,743.5714285714284 382.8571428571429,837.4285714285713 226.42857142857144,816.5714285714284 70,785.2857142857142" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="873,680.9999999999999 956.4285714285714,680.9999999999999 956.4285714285714,816.5714285714284 873,795.7142857142856" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="885.7142857142858" y="748.7857142857142" font-size="15" fill="#ffe0ac">D02 1片</t