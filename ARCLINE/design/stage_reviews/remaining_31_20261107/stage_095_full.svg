fill-opacity=".13" stroke="#7cc9db" stroke-dasharray="6 5"/><text x="419.52941176470586" y="210.17647058823525" font-size="18" fill="#7cc9db">F</text><polyline points="1203.6470588235293,711.0588235294117 1074.8235294117646,608 920.2352941176471,436.2352941176471 791.4117647058823,442.2470588235294" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="465.05882352941177,341.7647058823529 585.2941176470588,358.94117647058823 791.4117647058823,442.2470588235294" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="1203.6470588235293" cy="731.8235294117646" r="5" fill="#a4e7ee"/><text x="1195.6470588235293" y="765.8235294117646" font-size="18" fill="#a4e7ee">A</text><circle cx="465.05882352941177" cy="362.52941176470586" r="5" fill="#a4e7ee"/><text x="457.05882352941177" y="396.52941176470586" font-size="18" fill="#a4e7ee">B</text><ellipse cx="1263.764705882353" cy="717.9294117647058" rx="21.470588235294116" ry="20.611764705882354" fill="#74dec4"/><text x="1253.764705882353" y="687.3176470588235" font-size="18" fill="#74dec4">P0</text><ellipse cx="791.4117647058823" cy="467.15294117647056" rx="30.05882352941176" ry="22.32941176470588" fill="#ff9bad"/><circle cx="791.4117647058823" cy="442.2470588235294" r="16.31764705882353" fill="#f1c7d5" stroke="#fff0f3" stroke-width="1.5"/><text x="781.4117647058823" y="434.8235294117647" font-size="18" fill="#ff9bad">E</text><text x="38" y="959.1764705882352" font-size="17" fill="#dae5ed">左窓を傾いた一片と支持体に整理し、中央陣地と西砲座の輪郭を非対称にした。</text><text x="38" y="996.1764705882352" font-size="17" fill="#dae5ed">別々の架空部位を撃ち分けず、一部位の破壊前後で同じ核座標への接近を変える中ボス陣地。</text><text x="38" y="1033.1764705882351" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1070.1764705882351" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>