<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1143" viewBox="0 0 1600 1143" role="img"><title>シールドドライブから露出核へ</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 95｜シールドドライブから露出核へ</text><text x="38" y="83" font-size="19" fill="#afc2d2">右下Mで既存のシールドドライブを狙い、破壊後は左の風窓から同座標の露出核へ角度を変える。</text><polygon points="70,711.0588235294117 155.88235294117646,668.1176470588235 258.94117647058823,693.8823529411765 310.47058823529414,736.8235294117646 310.47058823529414,917.1764705882352 70,917.1764705882352" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,711.0588235294117 155.88235294117646,668.1176470588235 258.94117647058823,693.8823529411765 310.47058823529414,736.8235294117646" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="473.6470588235294,796.9411764705882 791.4117647058823,762.5882352941176 1040.4705882352941,762.5882352941176 1040.4705882352941,917.1764705882352 473.6470588235294,917.1764705882352" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="473.6470588235294,796.9411764705882 791.4117647058823,762.5882352941176 1040.4705882352941,762.5882352941176" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1152.1176470588234,736.8235294117646 1392.5882352941176,736.8235294117646 1530,668.1176470588235 1530,917.1764705882352 1152.1176470588234,917.1764705882352" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="1152.1176470588234,736.8235294117646 1392.5882352941176,736.8235294117646 1530,668.1176470588235" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="559.5294117647059,539.2941176470588 636.8235294117646,487.7647058823529 911.6470588235294,487.7647058823529 988.9411764705882,547.8823529411765 920.2352941176471,582.2352941176471 877.2941176470588,650.9411764705883 696.9411764705882,625.1