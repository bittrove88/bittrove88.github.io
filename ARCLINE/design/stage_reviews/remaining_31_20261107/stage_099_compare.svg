6" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="668.6,316 719.6999999999999,374.4" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="610.1999999999999,608 654,556.8999999999999" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="654,556.8999999999999 741.6,556.8999999999999" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="741.6,556.8999999999999 748.9,565.66" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="420.4,286.370588235294 486.09999999999997,228.39999999999998" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="486.09999999999997,228.39999999999998 529.9,279.5" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="559.0999999999999,904.8666666690999 683.1999999999999,878.0999999999999" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="610.1999999999999" cy="299.94" rx="18.25" ry="17.52" fill="#74dec4"/><text x="600.1999999999999" y="272.42" font-size="18" fill="#74dec4">P0</text><ellipse cx="938.6999999999999" cy="737.94" rx="22.63" ry="21.169999999999998" fill="#ff9bad"/><text x="928.6999999999999" y="706.77" font-size="18" fill="#ff9bad">E</text><text x="38" y="1051.5" font-size="17" fill="#dae5ed">中央核空洞と隔壁を、非対称の自然な二峰と三つの独立足場へ全面刷新。旧案の内側・複合反射・外周逆向きの核を引き継ぐ。</text><text x="38" y="1088.5" font-size="17" fill="#dae5ed">二峰が地上の直射を遮り、どこへ転移するかで使うギミックと入射方向が変わる最終通常面。橋周期や全面反射室にはしない。</text><text x="38" y="1125.5" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1162.5" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1235"><title>二峰の間で転移先を選ぶ</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><te