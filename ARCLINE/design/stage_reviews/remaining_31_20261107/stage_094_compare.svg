ill="#e2b5de">M +</text><polyline points="392.7368421052632,810.2160664819944 500.3157894736842,838.5263157894736" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="600.2105263157895,700.2105263157894 654,656.200956937799" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="408.10526315789474,800.1052631578947 446.5263157894737,746.3157894736842" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="446.5263157894737,746.3157894736842 546.421052631579,746.3157894736842" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="546.421052631579,746.3157894736842 592.5263157894736,792.421052631579" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="500.3157894736842,746.3157894736842 569.4736842105262,715.578947368421" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><polyline points="623.2631578947369,423.578947368421 654,406.8133971291866" fill="none" stroke="#f5d27d" stroke-width="5" stroke-dasharray=""/><ellipse cx="1238" cy="445.0947368421052" rx="19.210526315789473" ry="18.442105263157895" fill="#74dec4"/><text x="1228" y="416.6526315789473" font-size="18" fill="#74dec4">P0</text><ellipse cx="730.8421052631579" cy="614.1473684210525" rx="23.821052631578947" ry="22.28421052631579" fill="#ff9bad"/><text x="720.8421052631579" y="581.8631578947368" font-size="18" fill="#ff9bad">E</text><text x="38" y="980.421052631579" font-size="17" fill="#dae5ed">船首と鏡桁を一つの支持面へ統合。右の外板は二片のうち右一片だけを開く構想とした。</text><text x="38" y="1017.421052631579" font-size="17" fill="#dae5ed">右開始から左向きに落とす経路と、敵の反対側へ渡って右向きに返す経路。雲の減速とW/Mを別の位置判断に結ぶ。</text><text x="38" y="1054.421052631579" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1091.421052631579" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" he