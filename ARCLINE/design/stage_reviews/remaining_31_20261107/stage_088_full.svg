<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1331" viewBox="0 0 1600 1331" role="img"><title>格納庫の常設整備シャフト</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 88｜格納庫の常設整備シャフト</text><text x="38" y="83" font-size="19" fill="#afc2d2">開いた整備口の底からFへ入れるか、東庇の上からKの角度を使う。</text><polygon points="70,956.1538461538462 753.2051282051283,956.1538461538462 1052.6923076923076,759.6153846153848 1239.871794871795,478.8461538461539 1530,478.8461538461539 1530,1105.897435897436 70,1105.897435897436" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,956.1538461538462 753.2051282051283,956.1538461538462 1052.6923076923076,759.6153846153848 1239.871794871795,478.8461538461539 1530,478.8461538461539" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,609.8717948717949 350.7692307692308,581.7948717948718 519.2307692307693,609.8717948717949 519.2307692307693,684.7435897435898 378.84615384615387,722.1794871794873 70,703.4615384615386" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="800,591.1538461538462 874.8717948717949,609.8717948717949 874.8717948717949,694.1025641025642 800,694.1025641025642" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><text x="808.4358974358975" y="642.6282051282052" font-size="15" fill="#ffe0ac">D02 1片</text><polygon points="874.8717948717949,609.8717948717949 1052.6923076923076,609.8717948717949 1052.6923076923076,712.8205128205129 921.6666666666667,694.1025641025642 874.8717948717949,694.1025641025642" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><rect x="631.5384615384615" y="226.1538461538462" width="140.3846153846154" height="561.5384615384615" fill="#7cc9db" fill-opacity=".13" stroke="#7cc9db" stroke-dasharray="6 5"/><text x="637.5384615384615" y="249.1538461538462" font-size="18" fill="#7cc9db">F</text><polyline points="1073.6270256898138,345.4807692307693 1162.7832307204426,294.0064102564103" fill="none" stroke="#c5e8fb" stroke-width="5" stroke-dasharray=""/><polyline points="668.974358974359,928.0769230769232 697.0512820512821,460.1282051282052 884.2307692307693,170 1211.7948717948718,170 1380.2564102564104,450.76923076923083" fill="none" stroke="#b5c7ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="987.1794871794872,581.7948717948718 1118.2051282051282,319.74358974358984 1277.3076923076924,216.79487179487182 1380.2564102564104,450.76923076923083" fill="none" stroke="#8cddd1" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="668.974358974359" cy="951.1538461538462" r="5" fill="#a4e7ee"/><text x="660.974358974359" y="985.1538461538462" font-size="18" fill="#a4e7ee">A</text><circle cx="987.1794871794872" cy="604.8717948717949" r="5" fill="#a4e7ee"/><text x="979.1794871794872" y="638.8717948717949" font-size="18" fill="#a4e7ee">B</text><ellipse cx="612.8205128205128" cy="935.5641025641025" rx="23.397435897435898" ry="22.461538461538463" fill="#74dec4"/><text x="602.8205128205128" y="903.1025641025641" font-size="18" fill="#74dec4">P0</text><ellipse cx="1380.2564102564104" cy="458.25641025641033" rx="29.012820512820515" ry="27.141025641025642" fill="#ff9bad"/><text x="1370.2564102564104" y="421.1153846153847" font-size="18" fill="#ff9bad">E</text><text x="38" y="1147.897435897436" font-size="17" fill="#dae5ed">三片ハッチの全破壊をやめ、開始を頭上開放の整備口へ移動。端の一片だけを任意の拡幅にした。</text><text x="38" y="1184.897435897436" font-size="17" fill="#dae5ed">一つの常設縦シャフトと短い徒歩で風への入り方を変える格納庫。86面の反射湾・雲・上昇域を使わない。</text><text x="38" y="1221.897435897436" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1258.897435897436" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg>