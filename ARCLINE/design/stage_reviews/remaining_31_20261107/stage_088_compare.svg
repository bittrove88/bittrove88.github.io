<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="100%" height="100%" fill="#111d2a"/><text x="35" y="42" fill="#dae5ed" font-family="sans-serif" font-size="28">88：旧案と新案（同縮尺・地盤基準を統一）</text><svg x="0" y="70" width="800" height="800" viewBox="0 0 1600 1331"><title>格納庫の常設整備シャフト</title><rect width="100%" height="100%" fill="#111d2a"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="38" y="44" font-size="29" fill="#dae5ed">ARCLINE 88｜格納庫の常設整備シャフト</text><text x="38" y="83" font-size="19" fill="#afc2d2">開いた整備口の底からFへ入れるか、東庇の上からKの角度を使う。</text><polygon points="70,956.1538461538462 753.2051282051283,956.1538461538462 1052.6923076923076,759.6153846153848 1239.871794871795,478.8461538461539 1530,478.8461538461539 1530,1105.897435897436 70,1105.897435897436" fill="#354e5c" stroke="none" stroke-width="1.5" /><polyline points="70,956.1538461538462 753.2051282051283,956.1538461538462 1052.6923076923076,759.6153846153848 1239.871794871795,478.8461538461539 1530,478.8461538461539" fill="none" stroke="#a8c8d7" stroke-width="2.5" stroke-dasharray=""/><polygon points="70,609.8717948717949 388.20512820512823,581.7948717948718 575.3846153846155,609.8717948717949 575.3846153846155,684.7435897435898 378.84615384615387,722.1794871794873 70,703.4615384615386" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="575.3846153846155,609.8717948717949 809.3589743589744,591.1538461538462 809.3589743589744,694.1025641025642 575.3846153846155,684.7435897435898" fill="#a98d65" stroke="#b7d3dd" stroke-width="1.5" /><polyline points="653.3760683760685,694.1025641025642 653.3760683760685,591.1538461538462" fill="none" stroke="#dec7a2" stroke-width="1" stroke-dasharray="3 3"/><polyline points="731.3675213675215,694.1025641025642 731.3675213675215,591.1538461538462" fill="none" stroke="#dec7a2" stroke-width="1" stroke-dasharray="3 3"/><text x="663.3717948717949" y="642.6282051282052" font-size="15" fill="#ffe0ac">D02 3片</text><polygon points="809.3589743589744,591.1538461538462 921.6666666666667,609.8717948717949 1052.6923076923076,609.8717948717949 1052.6923076923076,712.8205128205129 921.6666666666667,694.1025641025642 809.3589743589744,694.1025641025642" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><polygon points="734.4871794871796,871.923076923077 781.2820512820513,815.7692307692308 893.5897435897436,815.7692307692308 931.0256410256411,862.5641025641027 856.1538461538462,909.3589743589745 790.6410256410256,909.3589743589745" fill="#456c7f" stroke="#b7d3dd" stroke-width="1.5" /><rect x="771.9230769230769" y="226.1538461538462" width="318.20512820512823" height="346.2820512820513" fill="#7cc9db" fill-opacity=".13" stroke="#7cc9db" stroke-dasharray="6 5"/><text x="777.9230769230769" y="249.1538461538462" font-size="18" fill="#7cc9db">F</text><polyline points="867.729589792378,513.9423076923077 956.8857948230067,462.46794871794873" fill="none" stroke="#c5e8fb" stroke-width="5" stroke-dasharray=""/><ellipse cx="294.61538461538464" cy="935.5641025641025" rx="23.397435897435898" ry="22.461538461538463" fill="#74dec4"/><text x="284.61538461538464" y="903.1025641025641" font-size="18" fill="#74dec4">P0</text><ellipse cx="1380.2564102564104" cy="458.25641025641033" rx="29.012820512820515" ry="27.141025641025642" fill="#ff9bad"/><text x="1370.2564102564104" y="421.1153846153847" font-size="18" fill="#ff9bad">E</text><text x="38" y="1147.897435897436" font-size="17" fill="#dae5ed">三片ハッチの全破壊をやめ、開始を頭上開放の整備口へ移動。端の一片だけを任意の拡幅にした。</text><text x="38" y="1184.897435897436" font-size="17" fill="#dae5ed">一つの常設縦シャフトと短い徒歩で風への入り方を変える格納庫。86面の反射湾・雲・上昇域を使わない。</text><text x="38" y="1221.897435897436" font-size="17" fill="#adbfd0">破線は構想空間。射撃後はその位置で反撃を受け、同じ手番の退避・無償待機は仮定しない。</text><text x="38" y="1258.897435897436" font-size="17" fill="#adbfd0">最低限の形状・支持・データ・描画確認。実歩行・転移・弾道・敵AI・勝敗は全49面承認後に一括検証。</text></g></svg><svg x="800" y="70" width="800" height="800" viewBox="0 0 1600 1331"><title>格納庫の常設整備シャフト</title><rect wid