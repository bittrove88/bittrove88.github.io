<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1700" viewBox="0 0 1600 1700" role="img" aria-labelledby="title desc">
<title id="title">ARCLINE 76面 曲面試射路と制御棟のラフ2案</title><desc id="desc">76面の方向性レビュー用ラフ。既存の磁場と端子、射点の選択を示す。破線は模式線で、実弾道・通行・勝利の検証結果ではない。</desc>
<defs><pattern id="ore" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#df9954"/><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#986739" stroke-width="1.2"/></pattern>
<marker id="mainArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#83e9c7"/></marker>
<marker id="altArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a5bcff"/></marker></defs>
<rect width="100%" height="100%" fill="#0c1424"/><g font-family='"Noto Sans CJK JP", "Noto Sans JP", sans-serif'><text x="38.00" y="44.00" font-size="29" fill="#e8eef9" font-weight="700">ARCLINE 076  /  地形と攻略が異なるラフ2案</text><text x="40.00" y="78.00" font-size="17" fill="#a6b5cf" font-weight="400">方向性レビュー用。初期Mは−1、Tで次の手番境界に極性反転。破線は構想で、実弾道ではありません。</text><rect x="24" y="101" width="1552" height="750" rx="18" fill="#121f33" stroke="#2e415d"/><text x="48.00" y="139.00" font-size="27" fill="#e8eef9" font-weight="700">A  磁場を抱く曲面試射路</text><text x="49.00" y="170.00" font-size="18" fill="#a6b5cf" font-weight="400">歩いて磁場の内側から撃つ／外側に残って極性を変える</text><polygon points="125.00,655.40 326.60,655.40 499.40,669.80 830.60,669.80 960.20,648.20 1032.20,597.80 1104.20,533.00 1176.20,461.00 1262.60,453.80 1349.00,468.20 1349.00,756.20 125.00,756.20" fill="#343e5b" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="125.00,655.40 326.60,655.40 499.40,669.80 830.60,669.80 960.20,648.20 1032.20,597.80 1104.20,533.00 1176.20,461.00 1262.60,453.80 1349.00,468.20" fill="none" stroke="#b7b7df" stroke-width="1.5"/><circle cx="686.60" cy="353.00" r="172.80" fill="#b69bea" fill-opacity=".10" stroke="#bba3ec" stroke-width="1.4" stroke-dasharray="6 5"/><text x="678.60" y="359.00" font-size="18" fill="#c7b0ef" font-weight="700">M</text><polygon points="254.60,302.60 341.00,338.60 427.40,396.20 513.80,453.80 614.60,504.20 715.40,525.80 816.20,511.40 917.00,468.20 989.00,432.20 989.00,475.40 917.00,511.40 816.20,554.60 715.40,569.00 614.60,547.40 513.80,497.00 427.40,439.40 341.00,381.80 254.60,345.80" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="269.00,655.40 312.20,655.40 312.20,369.80 269.00,351.80" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="931.40,653.00 974.60,638.12 974.60,482.60 931.40,504.20" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polyline points="384.20,360.20 427.40,389.00 513.80,446.60 614.60,497.00 686.60,512.43" fill="none" stroke="#c1cedf" stroke-width="1.6" stroke-dasharray="2 7"/><polyline points="686.60,498.03 773.00,381.80 917.00,338.60 1061.00,389.00 1205.00,437.00" fill="none" stroke="#83e9c7" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#mainArrow)" stroke-linejoin="round"/><polyline points="384.20,345.80 521.00,230.60 686.60,252.20 873.80,324.20 1053.80,389.00 1205.00,437.00" fill="none" stroke="#a5bcff" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#altArrow)" stroke-linejoin="round"/><rect x="368.36" y="342.20" width="31.68" height="19.44" rx="3" fill="#28564f" stroke="#75e0c4" stroke-width="1.7"/><polyline points="367.64,364.52 400.76,364.52" stroke="#75e0c4" stroke-width="3"/><ellipse cx="1205.00" cy="441.32" rx="25.20" ry="18.72" fill="#623c50" stroke="#ff8e94" stroke-width="2"/><circle cx="441.8" cy="266.59999999999997" r="14.4" fill="#584b2f" stroke="#f2ca7d" stroke-width="1.8"/><text x="436.80" y="271.60" font-size="15" fill="#ffe0a3" font-weight="700">T</text><polyline points="384.20,345.80 441.80,266.60" fill="none" stroke="#f2ca7d" stroke-width="2" stroke-dasharray="4 5"/><text x="361.20" y="394.40" font-size="16" fill="#75e0c4" font-weight="700">P0 / R</text><text x="1188.00" y="484.60" font-size="16" fill="#ff8e94" font-weight="700">敵</text><circle cx="686.6" cy="498.0285714285714" r="9" fill="#121f33" stroke="#83e9c7" stroke-width="2"/><text x="681.60" y="503.03" font-size="14" fill="#83e9c7" font-weight="700">C</text><text x="610.00" y="236.00" font-size="17" fill="#d3b9f7" font-weight="400">M：移動すると想定銃口が場の内側へ</text><text x="150.00" y="436.00" font-size="17" fill="#a5bcff" font-weight="400">T切替後、外側Rから入れる</text><text x="790.00" y="561.00" font-size="17" fill="#83e9c7" font-weight="400">C：初期極性のまま、内側から射撃</text><text x="480.00" y="688.00" font-size="17" fill="#e8eef9" font-weight="400">固定の曲面試射路と、地盤に接続する支持柱</text><rect x="25" y="768" width="1550" height="72" fill="#121f33"/><text x="48.00" y="792.00" font-size="17" fill="#e8eef9" font-weight="400">発見：歩いて発射位置を磁場の外から内へ移すか、外に残ってTで極性を変えるかを選ぶ。</text><text x="48.00" y="826.00" font-size="15" fill="#a6b5cf" font-weight="400">固定構造・M1個・T1個。実歩行、転移、端子操作、極性と命中、敵反撃、16行動攻略は未検証。</text><rect x="24" y="877" width="1552" height="750" rx="18" fill="#121f33" stroke="#2e415d"/><text x="48.00" y="915.00" font-size="27" fill="#e8eef9" font-weight="700">B  背中合わせの制御棟</text><text x="49.00" y="946.00" font-size="18" fill="#a6b5cf" font-weight="400">端子へ逆向きに撃って同じ台に残る／前方へ転移して磁場の外へ出る</text><polygon points="125.00,1381.00 240.20,1395.40 355.40,1417.00 485.00,1445.80 830.60,1445.80 917.00,1402.60 1025.00,1366.60 1133.00,1345.00 1226.60,1345.00 1349.00,1366.60 1349.00,1532.20 125.00,1532.20" fill="#343e5b" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="125.00,1381.00 240.20,1395.40 355.40,1417.00 485.00,1445.80 830.60,1445.80 917.00,1402.60 1025.00,1366.60 1133.00,1345.00 1226.60,1345.00 1349.00,1366.60" fill="none" stroke="#b7b7df" stroke-width="1.5"/><circle cx="931.40" cy="1143.40" r="165.60" fill="#b69bea" fill-opacity=".10" stroke="#bba3ec" stroke-width="1.4" stroke-dasharray="6 5"/><text x="923.40" y="1149.40" font-size="18" fill="#c7b0ef" font-weight="700">M</text><polygon points="499.40,1445.80 499.40,1237.00 557.00,1179.40 614.60,1143.40 665.00,1143.40 722.60,1078.60 751.40,1078.60 801.80,1186.60 816.20,1359.40 816.20,1445.80" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polyline points="636.20,1136.20 751.40,956.20 873.80,1057.00 945.80,1385.80" fill="none" stroke="#c1cedf" stroke-width="1.6" stroke-dasharray="2 7"/><polyline points="636.20,1121.80 744.20,1006.60 888.20,1006.60 1017.80,1150.60 1212.20,1316.20" fill="none" stroke="#83e9c7" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#mainArrow)" stroke-linejoin="round"/><polyline points="945.80,1371.40 1212.20,1316.20" fill="none" stroke="#a5bcff" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#altArrow)" stroke-linejoin="round"/><rect x="620.36" y="1118.20" width="31.68" height="19.44" rx="3" fill="#28564f" stroke="#75e0c4" stroke-width="1.7"/><polyline points="619.64,1140.52 652.76,1140.52" stroke="#75e0c4" stroke-width="3"/><ellipse cx="1212.20" cy="1327.72" rx="25.20" ry="18.72" fill="#623c50" stroke="#ff8e94" stroke-width="2"/><circle cx="312.20000000000005" cy="1229.8" r="14.4" fill="#584b2f" stroke="#f2ca7d" stroke-width="1.8"/><text x="307.20" y="1234.80" font-size="15" fill="#ffe0a3" font-weight="700">T</text><polyline points="636.20,1121.80 312.20,1229.80" fill="none" stroke="#f2ca7d" stroke-width="2" stroke-dasharray="4 5"/><text x="613.20" y="1170.40" font-size="16" fill="#75e0c4" font-weight="700">P0 / R</text><text x="1195.20" y="1371.00" font-size="16" fill="#ff8e94" font-weight="700">敵</text><circle cx="945.8000000000001" cy="1371.4" r="9" fill="#121f33" stroke="#83e9c7" stroke-width="2"/><text x="940.80" y="1376.40" font-size="14" fill="#83e9c7" font-weight="700">C</text><text x="170.00" y="1168.00" font-size="17" fill="#f2ca7d" font-weight="400">まず敵と逆側のTへ</text><text x="1100.00" y="1052.00" font-size="17" fill="#83e9c7" font-weight="400">T切替後、右へ向き直ってM経由</text><text x="965.00" y="1408.00" font-size="17" fill="#a5bcff" font-weight="400">Tを使わずCへ再配置し、Mの下縁の外から</text><text x="445.00" y="1495.00" font-size="17" fill="#e8eef9" font-weight="400">固定の制御台と前面防爆立ち上がり</text><rect x="25" y="1544" width="1550" height="72" fill="#121f33"/><text x="48.00" y="1568.00" font-size="17" fill="#e8eef9" font-weight="400">発見：敵と反対側のTで極性を変えて制御台に残るか、棟の前へ転移して磁場の外から攻めるかを選ぶ。</text><text x="48.00" y="1602.00" font-size="15" fill="#a6b5cf" font-weight="400">固定構造・M1個・T1個。実歩行、転移、端子操作、極性と命中、敵反撃、16行動攻略は未検証。</text><text x="40.00" y="1670.00" font-size="16" fill="#a6b5cf" font-weight="400">灰紫＝地盤　灰青＝固定実験設備　紫の円＝M　橙の円＝T　橙破線＝端子操作の構想　細点線＝再配置の構想</text></g></svg>
