<text x="1432" y="214" fill="#eef7f3" font-size="23" font-family="sans-serif" font-weight="800">SUSPENDED HOIST</text>
<text x="1433" y="249" fill="#9bb4bf" font-size="17">1540px world · Stage 075</text>
<path d="M1434 281h225" stroke="#54717c"/>
<text x="1433" y="320" fill="#a6f1d2" font-size="21" font-weight="800">A · UNDERCUT</text>
<text x="1433" y="352" fill="#d1dee1" font-size="16">Walk below hanging ore.</text>
<text x="1433" y="375" fill="#d1dee1" font-size="16">Keep D04 intact; use M.</text>
<text x="1433" y="414" fill="#f4d899" font-size="21" font-weight="800">C · OUTBOARD</text>
<text x="1433" y="445" fill="#d1dee1" font-size="16">Aim from boom tip.</text>
<text x="1433" y="467" fill="#d1dee1" font-size="16">No need to break D04.</text>
<text x="1433" y="505" fill="#f3b0a8" font-size="21" font-weight="800">B · BLOCKED</text>
<text x="1433" y="534" fill="#d1dee1" font-size="16">Inner boom sightline</text>
<text x="1433" y="556" fill="#d1dee1" font-size="16">hits F02 / F03.</text>
<path d="M1434 585h225" stroke="#54717c"/>
<text x="1433" y="618" fill="#f8c195" font-size="19" font-weight="800">BREAK OPTION</text>
<text x="1433" y="647" fill="#d1dee1" font-size="16">Remove only D04 to</text>
<text x="1433" y="669" fill="#d1dee1" font-size="16">open the P0 sightline.</text>
<text x="1433" y="709" fill="#9db6be" font-size="15">F01/F02/F03 stay fixed.</text>
<text x="1433" y="749" fill="#9db6be" font-size="15">Dashed = planned rays,</text>
<text x="1433" y="769" fill="#9db6be" font-size="15">not simulated shots.</text>
<text x="1433" y="806" fill="#9db6be" font-size="15">10 px / coordinate unit</text></g><text x="130" y="1100" font-size="16" fill="#8bb5ba">Geometry from stage_075_proposal_v2.json · A / B / C are candidate firing points · D04 is one independently breakable unit</text><text x="1674" y="1113" text-anchor="end" fill="#789ba3" font-size="14" font-family="sans-serif">COORDINATE-DERIVED DESIGN VIEW · NOT GAME RENDER · NOT BALLISTIC PROOF</text></svg>