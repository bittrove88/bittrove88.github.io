<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1645" viewBox="0 0 1600 1645" role="img" aria-labelledby="title desc">
<title id="title">ARCLINE 75面 新しい地形骨格ラフ A/B</title><desc id="desc">75面の方向性レビュー用ラフ。全景と攻略意図を示す。破線は模式線で、実弾道・通行・勝利の検証結果ではない。</desc>
