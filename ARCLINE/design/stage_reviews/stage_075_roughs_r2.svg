<rect width="100%" height="100%" fill="#0c1424"/><g font-family='"Noto Sans CJK JP", "Noto Sans JP", sans-serif'><text x="38.00" y="43.00" font-size="30" fill="#e8eef9" font-weight="700">ARCLINE 075  /  新しい地形骨格 2案</text><text x="40.00" y="76.00" font-size="17" fill="#a6b5cf" font-weight="400">方向性レビュー用ラフ　｜　既存M・固定地形・独立破壊片　｜　破線は構想であり実弾道ではありません</text><rect x="24" y="101" width="1552" height="728" rx="18" fill="#121f33" stroke="#2e415d"/><text x="48.00" y="137.00" font-size="27" fill="#e8eef9" font-weight="700">A  横穴の切羽</text><text x="49.00" y="167.00" font-size="18" fill="#a6b5cf" font-weight="400">主：坑内から横射　／　別解：坑外からMを通す</text><polygon points="125.00,509.50 215.00,517.00 290.00,524.50 365.00,539.50 455.00,554.50 552.50,569.50 642.50,584.50 725.00,592.00 852.50,592.00 1002.50,592.00 1145.00,592.00 1190.00,592.00 1220.00,562.00 1287.50,524.50 1325.00,509.50 1325.00,772.00 125.00,772.00" fill="#343e5b" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="125.00,509.50 215.00,517.00 290.00,524.50 365.00,539.50 455.00,554.50 552.50,569.50 642.50,584.50 725.00,592.00 852.50,592.00 1002.50,592.00 1145.00,592.00 1190.00,592.00 1220.00,562.00 1287.50,524.50 1325.00,509.50" fill="none" stroke="#b7b7df" stroke-width="1.5"/><circle cx="597.50" cy="374.50" r="120.00" fill="#b69bea" fill-opacity=".10" stroke="#bba3ec" stroke-width="1.4" stroke-dasharray="6 5"/><text x="589.50" y="380.50" font-size="18" fill="#c7b0ef" font-weight="700">M</text><polygon points="695.00,239.50 762.50,202.00 875.00,179.50 1017.50,187.00 1152.50,224.50 1257.50,269.50 1325.00,307.00 1325.00,509.50 1287.50,524.50 1220.00,562.00 1190.00,592.00 1175.00,464.50 1137.50,359.50 1047.50,322.00 927.50,299.50 807.50,307.00 732.50,314.50 695.00,322.00" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="867.50,592.00 927.50,592.00 927.50,479.50 905.00,449.50 875.00,464.50" fill="url(#ore)" stroke="#f7c388" stroke-width="1.5" stroke-linejoin="round"/><poly