><text x="48.00" y="777.00" font-size="17" fill="#e8eef9" font-weight="400">永久に残る天井の下へ入って開口するか、坑外に残って磁場と坑口を通すか。</text><text x="48.00" y="806.00" font-size="15" fill="#a6b5cf" font-weight="400">仮寸法・全景模式図。腕の位置は既存値を参照。移動・転移・弾道・反撃・24行動攻略は未検証。</text><rect x="24" y="852" width="1552" height="728" rx="18" fill="#121f33" stroke="#2e415d"/><text x="48.00" y="888.00" font-size="27" fill="#e8eef9" font-weight="700">B  斜桟橋と、残す鉱石遮蔽</text><text x="49.00" y="918.00" font-size="18" fill="#a6b5cf" font-weight="400">主：Dを残して先に腕　／　別解：Dを開けて先端へ</text><polygon points="125.00,1268.00 237.50,1253.00 357.50,1253.00 477.50,1253.00 537.50,1290.50 597.50,1358.00 650.00,1410.50 732.50,1425.50 845.00,1425.50 935.00,1395.50 1017.50,1350.50 1085.00,1298.00 1115.00,1043.00 1175.00,1020.50 1287.50,1013.00 1400.00,1035.50 1400.00,1523.00 125.00,1523.00" fill="#343e5b" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="125.00,1268.00 237.50,1253.00 357.50,1253.00 477.50,1253.00 537.50,1290.50 597.50,1358.00 650.00,1410.50 732.50,1425.50 845.00,1425.50 935.00,1395.50 1017.50,1350.50 1085.00,1298.00 1115.00,1043.00 1175.00,1020.50 1287.50,1013.00 1400.00,1035.50" fill="none" stroke="#b7b7df" stroke-width="1.5"/><circle cx="770.00" cy="1028.00" r="127.50" fill="#b69bea" fill-opacity=".10" stroke="#bba3ec" stroke-width="1.4" stroke-dasharray="6 5"/><text x="762.00" y="1034.00" font-size="18" fill="#c7b0ef" font-weight="700">M</text><polygon points="650.00,1268.00 1115.00,1028.00 1145.00,1028.00 1145.00,1058.00 1115.00,1065.50 650.00,1305.50" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="680.00,1415.95 725.00,1424.14 725.00,1266.79 680.00,1290.02" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="507.50,1271.75 537.50,1290.50 567.50,1324.25 567.50,1155.50 545.00,1133.00 515.00,1140.50" fill="url(#ore)" stroke="#f7c388" stroke-width="1.5" stroke-linejoin="round"/><polyline points="1272.50,1006.50 1175.00,1013.00 1115.00,1020.50 957.50,1101.79 710.00,1229.53" fill="none" stroke="#c1cedf" stroke-width="1.6" stroke-dasharray="2 7"/><polyline points="957.50,1086.79 852.50,1028.00 770.00,998.00 672.50,1013.00 575.00,1095.50 428.00,1223.00" fill="none" stroke="#83e9c7" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#mainArrow)" stroke-linejoin="round"/><polyline points="710.00,1214.53 428.00,1223.00" fill="none" stroke="#a5bcff" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#altArrow)" stroke-linejoin="round"/><rect x="1256.00" y="987.75" width="33.00" height="20.25" rx="3" fill="#28564f" stroke="#75e0c4" stroke-width="1.7"/><polyline points="1255.25,1011.00 1289.75,1011.00" stroke="#75e0c4" stroke-width="3"/><text x="1260.50" y="1039.00" font-size="16" fill="#75e0c4" font-weight="700">P0</text><ellipse cx="402.50" cy="1235.00" rx="26.25" ry="19.50" fill="#623c50" stroke="#ff8e94" stroke-width="2"/><line x1="402.5" y1="1238.0" x2="428.0" y2="1223.0" stroke="#ff8e94" stroke-width="3"/><circle cx="428.0" cy="1223.0" r="13.5" fill="#ffdb99" stroke="#f29a79" stroke-width="1.4"/><text x="360.50" y="1279.00" font-size="16" fill="#ff8e94" font-weight="700">中ボス</text><circle cx="957.5" cy="1086.790325" r="8" fill="#121f33" stroke="#83e9c7" stroke-width="2"/><text x="952.50" y="1091.79" font-size="13" fill="#83e9c7" font-weight="700">R</text><circle cx="710.0" cy="1214.53226" r="8" fill="#121f33" stroke="#a5bcff" stroke-width="2"/><text x="705.00" y="1219.53" font-size="13" fill="#a5bcff" font-weight="700">C</text><text x="650.00" y="972.00" font-size="17" fill="#83e9c7" font-weight="400">RからMへ。遮蔽を残して先に腕を狙う</text><text x="958.00" y="1196.00" font-size="17" fill="#e8eef9" font-weight="400">F01：右岸に定着した固定斜桟橋</text><text x="670.00" y="1439.00" font-size="16" fill="#e8eef9" font-weight="400">F02：坑底の橋脚</text><text x="370.00" y="1097.00" font-size="17" fill="#f3c68e" font-weight="700">D：両側の低い射線を遮る</text><text x="310.00" y="1346.00" font-size="17" fill="#a5bcff" font-weight="400">D開口後、Cから近射</text><rect x="25" y="1502" width="1550" height="67" fill="#121f33"/><text x="48.00" y="1528.00" font-size="17" fill="#e8eef9" font-weight="400">射点の高さより、腕の弱体化と遮蔽の開口をどちらから行うか。桟橋と橋脚はどちらの順でも残る。</text><text x="48.00" y="1557.00" font-size="15" fill="#a6b5cf" font-weight="400">仮寸法・全景模式図。腕の位置は既存値を参照。移動・転移・弾道・反撃・24行動攻略は未検証。</text><text x="40.00" y="1621.00" font-size="16" fill="#a6b5cf" font-weight="400">灰青＝固定地形・支持体　橙の斜線＝破壊可能な鉱石　P0＝開始　C/R＝射点候補　細い点線＝再配置の方向</text></g></svg>
