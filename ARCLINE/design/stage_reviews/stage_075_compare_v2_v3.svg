drawn on top of solid geometry.</text><text x="1680" y="828" text-anchor="end" fill="#799aa4" font-size="14" font-family="sans-serif">COORDINATE-DERIVED DESIGN · NOT ENGINE FOOTAGE · NOT BALLISTIC PROOF</text></svg>