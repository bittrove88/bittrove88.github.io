<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1160" viewBox="0 0 1460 1160" role="img" aria-labelledby="title desc"><title id="title">76面 精査版：両岸から撃ち込む磁気降下槽</title><desc id="desc">v3の地形を保持。左岸のT操作を主経路、右岸は転移を要する任意候補。全ての破線は構想で実弾道ではない。射撃後はその場で反撃を受ける。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e6d5ff"/></marker></defs><rect width="1460" height="1160" fill="#0c1424"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="48" font-size="30" fill="#dce7f7">ARCLINE 076｜両岸から撃ち込む磁気降下槽</text><text x="40" y="84" font-size="17" fill="#aabbd1">v3の地形・M/T・出現位置を保持した精査版 / 設計承認待ち・動作未検証</text><text x="100" y="138" font-size="19" fill="#a9c6ff">主経路 L：Tを一射 → 手番境界で＋1 → 右向きに入射</text><text x="100" y="173" font-size="19" fill="#83e9c7">任意候補 R：初期−1を保持 → 右岸へ転移 → 左へ歩き向き直る</text><text x="100" y="204" font-size="16" fill="#aabbd1">転移の必要回数・着地・装備残数は未確認。二経路を同手数・同安全性とは扱わない。</text><polygon points="100,365 184,372 282,386 464,386 506,442 555,575 618,596 842,596 905,554 954,442 996,386 1192,386 1290,365 1360,372 1360,736 100,736" fill="#343e5b"/><polyline points="100,365 184,372 282,386 464,386 506,442 555,575 618,596 842,596 905,554 954,442 996,386 1192,386 1290,365 1360,372" fill="none" stroke="#b9bcdb" stroke-width="2"/><circle cx="730" cy="344" r="140" fill="#b69bea" fill-opacity=".1" stroke="#c6a1ef" stroke-width="2" stroke-dasharray="6 5"/><polyline points="345,365 471,295 597,295 667,372 709,477 730,575" fill="none" stroke="#a9c6ff" stroke-width="2.5" stroke-dasharray="8 7" opacity=".85"/><polyline points="1115,365 989,295 863,295 793,372 751,477 730,575" fill="none" stroke="#83e9c7" stroke-width="2.5" stroke-dasharray="8 7" opacity=".85"/><path d="M681,323 q25,-15 40,20" fill="none" stroke="#e6d5ff" stroke-width="2" marker-end="url(#arrow)"/><text x="723" y="349" font-size="22" fill="#dcc3ff">M</text><text x="674" y="400" font-size="16" fill="#dcc3ff">＋1 ↻ / −1 ↺</text><text x="674" y="246" font-size="18" fill="#dcc3ff">入射方向 × 極性</text><line x1="282" y1="389" x2="464" y2="389" stroke="#83e9c7" stroke-width="4"/><line x1="996" y1="389" x2="1192" y2="389" stroke="#83e9c7" stroke-width="4"/><rect x="328" y="356" width="34" height="26" rx="4" fill="#28564f" stroke="#83e9c7" stroke-width="2"/><ellipse cx="730" cy="576" rx="25" ry="19" fill="#623c50" stroke="#ff8e94" stroke-width="2"/><circle cx="415" cy="295" r="14" fill="#59492c" stroke="#f3ce83" stroke-width="2"/><polyline points="345,365 415,295" stroke="#f3ce83" stroke-dasharray="3 5" fill="none"/><text x="409" y="301" font-size="16" fill="#ffe0a3">T</text><text x="310" y="420" font-size="19" fill="#83e9c7">L / P0</text><text x="1105" y="420" font-size="19" fill="#83e9c7">R</text><circle cx="303" cy="381" r="5" fill="#f3ce83"/><text x="278" y="447" font-size="15" fill="#f3ce83">L-back</text><circle cx="1171" cy="381" r="5" fill="#f3ce83"/><text x="1146" y="447" font-size="15" fill="#f3ce83">R-back</text><circle cx="1115" cy="364" r="14" fill="none" stroke="#83e9c7" stroke-dasharray="3 4"/><path d="M1136,364 H1080" stroke="#83e9c7" stroke-width="2"/><text x="667" y="624" font-size="18" fill="#ff9fa5">低い敵 / HP欄5</text><text x="618" y="474" font-size="17" fill="#dcc3ff">退出 → 下降の空間</text><text x="100" y="775" font-size="18" fill="#dce7f7">緑の線＝固定の支持面。左260px / 右280px。後方候補までL:60px、R:80px。</text><text x="100" y="807" font-size="17" fill="#ffb1ad">後方支持面は射撃前に選ぶ位置。射撃後は同じ手番に戻れず、その位置で反撃を受ける。</text><rect x="40" y="846" width="440" height="169" rx="10" fill="#152239" stroke="#34465f"/><text x="58" y="879" font-size="21" fill="#dce7f7">保持した核</text><text x="58" y="916" font-size="16" fill="#b8c9de">左右とも高さ420px・敵まで水平550px。</text><text x="58" y="944" font-size="16" fill="#b8c9de">Tで変える／入射側を変える、の判断。</text><text x="58" y="972" font-size="16" fill="#b8c9de">岸肩は代表的な直線の撃ち下ろしを遮る。</text><rect x="510" y="846" width="440" height="169" rx="10" fill="#152239" stroke="#34465f"/><text x="528" y="879" font-size="21" fill="#dce7f7">空中障害を追加しない理由</text><text x="528" y="916" font-size="16" fill="#b8c9de">Mの円全体・左右の入口・下降帯を残す。</text><text x="528" y="944" font-size="16" fill="#b8c9de">庇や浮岩を足しても新しい判断にならず、</text><text x="528" y="972" font-size="16" fill="#b8c9de">旧Aの作用空間閉塞を再発させるため。</text><rect x="980" y="846" width="440" height="169" rx="10" fill="#152239" stroke="#34465f"/><text x="998" y="879" font-size="21" fill="#dce7f7">準備と反撃の扱い</text><text x="998" y="916" font-size="16" fill="#b8c9de">Tへの一射でも敵の手番が入る。</text><text x="998" y="944" font-size="16" fill="#b8c9de">右岸は転移・向き直りが必要な任意候補。</text><text x="998" y="972" font-size="16" fill="#b8c9de">退避位置の支持確認 ≠ 安全性の確認。</text><text x="40" y="1060" font-size="17" fill="#f3ce83">破線＝想定射撃空間。命中軌道・単発転移・安全な着地・勝利の実績を示さない。</text><text x="40" y="1095" font-size="16" fill="#aabbd1">静的確認：データ一致、支持、自己交差、Mの空間、代表砲身。詳細動作は全49面の設計承認後。</text></g></svg>
