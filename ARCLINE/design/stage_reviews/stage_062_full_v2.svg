<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130" role="img" aria-label="逆勾配の退避帯と庇の入口"><title>逆勾配の退避帯と庇の入口</title><rect width="100%" height="100%" fill="#151e29"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#e4e4dc">ARCLINE 062 v2｜逆勾配の退避帯と庇の入口</text><text x="40" y="82" font-size="19" fill="#b8c2cc">長い山腹の肩を出入りする。R→Aは120px、射撃後の退避は次手番以降。</text><polygon points="60.0,309.6 180.39999999999998,344.0 300.79999999999995,344.0 421.2,412.8 533.0,490.2 653.4,567.6 705.0,567.6 773.8,524.6 825.4,524.6 928.5999999999999,593.4000000000001 1031.8,662.2 1100.6,662.2 1178.0,602.0 1212.3999999999999,602.0 1264.0,713.8 1384.3999999999999,713.8 1487.6,688.0 1487.6,885.8 60.0,885.8" fill="#4c4b43"/><polyline points="60.0,309.6 180.39999999999998,344.0 300.79999999999995,344.0 421.2,412.8 533.0,490.2 653.4,567.6 705.0,567.6 773.8,524.6 825.4,524.6 928.5999999999999,593.4000000000001 1031.8,662.2 1100.6,662.2 1178.0,602.0 1212.3999999999999,602.0 1264.0,713.8 1384.3999999999999,713.8 1487.6,688.0" fill="none" stroke="#d1ccb7" stroke-width="2.5" stroke-dasharray=""/><polygon points="1135.0,344.0 1246.8,301.0 1375.8,326.80000000000007 1487.6,369.8 1487.6,688.0 1436.0,696.6 1436.0,507.40000000000003 1358.6,490.2 1246.8,464.40000000000003 1135.0,473.0" fill="#777360" stroke="#d1ccb7" stroke-width="1.5"/><polyline points="249.2,318.20000000000005 421.2,232.20000000000005 593.1999999999999,395.6 687.8,567.6" fill="none" stroke="#bfc8d2" stroke-width="2.5" stroke-dasharray="2 7"/><polyline points="249.2,318.20000000000005 498.59999999999997,189.20000000000005 816.8,387.0 1066.1999999999998,662.2" fill="none" stroke="#bfc8d2" stroke-width="2.5" stroke-dasharray="2 7"/><polyline points="791.0,498.8 920.0,447.20000000000005 1040.4,473.0 1152.2,524.6 1221.0,593.4000000000001 1298.3999999999999,688.0" fill="none" stroke="#b2c8ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="1066.1999999999998,636.4 1117.8,567.6 1178.0,550.4000000000001 1229.6,602.0 1298.3999999999999,688.0" fill="none" stroke="#86e3db" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="687.8,560.72 705.0,560.72 773.8,517.72 791.0,517.72" fill="none" stroke="#9de0bb" stroke-width="3" stroke-dasharray="5 4"/><circle cx="687.8" cy="562.6" r="5" fill="#a2e6f0"/><circle cx="791.0" cy="519.6" r="5" fill="#a2e6f0"/><circle cx="1066.1999999999998" cy="657.2" r="5" fill="#a2e6f0"/><path d="M300.79999999999995,258.6l8,8 -8,8 -8,-8Z" fill="#eed386"/><ellipse cx="249.2" cy="332.0" rx="18.92" ry="12" fill="#76e0c4"/><ellipse cx="1298.3999999999999" cy="701.8" rx="18.92" ry="12" fill="#ff9caa"/><text x="135" y="315" font-size="18" fill="#76e0c4">P0：開始高所</text><text x="302" y="245" font-size="18" fill="#eed386">試用W02（1手番）</text><text x="545" y="615" font-size="18" fill="#9de0bb">R：逆勾配の準備・退避帯</text><text x="770" y="565" font-size="18" fill="#b2c8ff">A：肩上の射点</text><text x="665" y="650" font-size="18" fill="#b8c2cc">R↔A：120px／同手番の射撃後退避なし</text><text x="975" y="712" font-size="18" fill="#86e3db">B：麓の低い弧</text><text x="1170" y="385" font-size="18" fill="#e4e4dc">F01：右端で支える敵側の庇</text><text x="1120" y="770" font-size="18" fill="#d1ccb7">床の低い岩背：直射を遮り、弧は上へ</text><text x="1280" y="808" font-size="18" fill="#ffadbd">enemy:slate</text><text x="40" y="940" font-size="20" fill="#e4e4dc">主攻略：Rで準備し、肩上Aから庇下へ。近い肩の遮蔽と、開いた射出空間を選ぶ。</text><text x="40" y="978" font-size="19" fill="#86e3db">別の選択：麓Bへ移り、入口から床の岩背を越す低い弧を狙う。</text><text x="40" y="1016" font-size="18" fill="#ffb6aa">Aで撃った手番はAで反撃。Rへ戻る手番も通常の行動・反撃規則に従う。</text><text x="40" y="1054" font-size="18" fill="#b8c2cc">P0/R/A/Bの頭上は開放。破線は構想空間。低所や退避帯の安全性は未測定。</text><text x="40" y="1092" font-size="17" fill="#b8c2cc">必要最低限の形状・データ・描画確認のみ。実動作・16行動勝利は最後に一括検証。</text></g></svg>
