<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1120" viewBox="0 0 1460 1120" role="img" aria-labelledby="title desc"><title id="title">76面v5 磁場の出口を選ぶ浮岩峡</title><desc id="desc">対称両岸を廃止。同じ岸から極性を変え、磁場の外側の浮岩の下へ出す設計。破線は空間の構想で実弾道ではない。</desc><rect width="1460" height="1120" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="48" font-size="30" fill="#dae5f1">ARCLINE 076 v5｜磁場の出口を選ぶ浮岩峡</text><text x="40" y="82" font-size="18" fill="#adc0d7">骨格を再設計：対称両岸を廃止し、磁場の「出口」と空中実体を結び直す</text><polygon points="70,418.2 161.2,425.8 252.39999999999998,441 450,441 510.79999999999995,471.40000000000003 571.5999999999999,593 655.1999999999999,661.4 799.5999999999999,676.6 936.4,653.8 1035.1999999999998,600.6 1232.8,600.6 1324,570.2 1362,577.8 1362,783 70,783" fill="#394c5b"/><polyline points="70,418.2 161.2,425.8 252.39999999999998,441 450,441 510.79999999999995,471.40000000000003 571.5999999999999,593 655.1999999999999,661.4 799.5999999999999,676.6 936.4,653.8 1035.1999999999998,600.6 1232.8,600.6 1324,570.2 1362,577.8" fill="none" stroke="#bdd1c5" stroke-width="2"/><polygon points="913.5999999999999,486.6 898.4,357.40000000000003 928.8,258.6 974.4,228.20000000000005 1004.8,281.40000000000003 1012.4,425.8 989.5999999999999,486.6 951.5999999999999,509.4" fill="#667384" stroke="#c3cbd4" stroke-width="2"/><circle cx="708.4" cy="380.20000000000005" r="152" fill="#ad89e6" fill-opacity=".13" stroke="#c2a6ec" stroke-width="2" stroke-dasharray="6 5"/><polyline points="343.59999999999997,418.2 503.2,319.40000000000003 602,319.40000000000003 738.8,418.2 845.1999999999999,524.6 1035.1999999999998,547.4 1194.8,577.8" fill="none" stroke="#75e0c4" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="343.59999999999997,418.2 503.2,304.20000000000005 594.4,296.6 700.8,243.40000000000003 830,159.80000000000007 1020,167.39999999999998 1194.8,577.8" fill="none" stroke="#e5be7d" stroke-width="2.5" stroke-dasharray="8 7"/><rect x="326.59999999999997" y="411" width="34" height="26" rx="4" fill="#28564f" stroke="#75e0c4" stroke-width="2"/><ellipse cx="1194.8" cy="580.6" rx="25" ry="19" fill="#623c50" stroke="#ff8e94" stroke-width="2"/><circle cx="427.2" cy="311.8" r="15" fill="#59492c" stroke="#e5be7d"/><line x1="343.59999999999997" y1="418.2" x2="427.2" y2="311.8" stroke="#e5be7d" stroke-dasharray="3 5"/><text x="421.2" y="317.8" font-size="18" fill="#ffe0a3">T</text><text x="698.4" y="385.20000000000005" font-size="24" fill="#d6beff">M</text><text x="313.59999999999997" y="475" font-size="19" fill="#75e0c4">P0</text><text x="414.59999999999997" y="475" font-size="19" fill="#75e0c4">S</text><circle cx="419.59999999999997" cy="436" r="5" fill="#75e0c4"/><line x1="343.59999999999997" y1="491" x2="419.59999999999997" y2="491" stroke="#75e0c4"/><text x="248" y="546" font-size="16" fill="#75e0c4">短い歩行100px：入射角の調整</text><text x="520" y="168" font-size="17" fill="#e5be7d">初期−1：上を越す狙いは任意の仮説</text><text x="760" y="235" font-size="20" fill="#dae5f1">F01 浮岩</text><text x="1000" y="270" font-size="17" fill="#dae5f1">中高度の出口を遮る</text><text x="1000" y="300" font-size="17" fill="#adc0d7">Mの外だけに置く</text><text x="575" y="568" font-size="18" fill="#75e0c4">T切替後＋1：右下へ出し、浮岩の下を狙う</text><text x="1159.8" y="630.6" font-size="17" fill="#ff9fa5">enemy:pole</text><text x="480" y="337" font-size="17" fill="#d6beff">円内は開放</text><text x="40" y="838" font-size="22" fill="#dae5f1">発見：磁場で曲げた先を見て、浮岩の「下へ出す」か「上へ回す」かを考える。</text><text x="40" y="878" font-size="18" fill="#adc0d7">主攻略はT切替から下側へ。対岸転移・精密着地・全ギミック連鎖を必須にしない。</text><text x="40" y="915" font-size="18" fill="#adc0d7">浮岩は固定・非破壊。取り除くと中高度の出口が開き、極性と出口を合わせる課題が弱まる。</text><text x="40" y="952" font-size="18" fill="#ffb8ad">Tへの一射も手数と反撃を伴う。射撃後はその場に残り、同手番の退避はできない。</text><text x="40" y="1002" font-size="17" fill="#e5be7d">破線は空間計画。Mの曲がり幅・実命中・初期極性で上を越す成立は未検証。</text><text x="40" y="1041" font-size="17" fill="#adc0d7">静的確認：支持・自己交差・Mと実体の離隔・上下の通過帯・T操作線・代表砲身。</text><text x="40" y="1080" font-size="16" fill="#adc0d7">設計承認待ち。実歩行・弾道・転移・敵AI・反撃・16行動勝利は全49面の承認後に検証。</text></g></svg>
