d="M534.5999999999999,533.2l7,7l-7,7l-7,-7z" fill="#ffe59a"/><text x="305" y="549" font-size="16" fill="#ffe59a">SK078：既存補助（任意）</text><circle cx="963.6" cy="442.4" r="10" fill="none" stroke="#e5be7d" stroke-width="2"/><text x="560" y="185" font-size="18" fill="#76e0c4">主攻略：初期−1のMで上へ回し、D02の上を狙う</text><text x="635" y="455" font-size="25" fill="#d5c3ff">M −1</text><text x="640" y="487" font-size="16" fill="#d5c3ff">円内に実体を置かない</text><text x="400" y="663" font-size="18" fill="#76e0c4">P0：左内壁のえぐれ</text><text x="400" y="695" font-size="16" fill="#76e0c4">同じ支持面を70px歩いて調整</text><text x="925" y="505" font-size="18" fill="#dce8f5">B：右岩盤につながる監視棚</text><text x="925" y="535" font-size="17" fill="#e5be7d">Mの外でD02へ一射</text><text x="1067" y="144" font-size="18" fill="#e5be7d">D02：独立遮板1片</text><text x="1067" y="173" font-size="17" fill="#e5be7d">上方は常設の開放帯</text><text x="1210" y="407" font-size="17" fill="#ff9caa">保全室の敵</text><polyline points="534.5999999999999,616.4 589.2,616.4" fill="none" stroke="#76e0c4" stroke-width="2.5" stroke-dasharray=""/><text x="40" y="924" font-size="21" fill="#dce8f5">主攻略：遮板を残してMの曲射。開始地点から利用を探れる配置にする。</text><text x="40" y="960" font-size="18" fill="#e5be7d">任意の方針変更：Bへ転移し、D02を開いて浅い射線へ。転移回数・破壊回数は未検証。</text><text x="40" y="997" font-size="18" fill="#adc0d7">高所＝攻撃／低所＝安全ではなく、Mを使うか、移動と破壊に準備を使うかを選ぶ。</text><text x="40" y="1034" font-size="18" fill="#adc0d7">左右の支持面は岩盤に接続。D02は支持材ではなく、除去しても床・棚は残る。</text><text x="40" y="1071" font-size="16" fill="#ffb8ad">破線は想定空間。転移・M命中・敵の反撃・16行動勝利の実績ではない。射撃後はその場で反撃を受ける。</text><text x="40" y="1110" font-size="17" fill="#adc0d7">設計承認待ち・ゲーム未適用。詳細動作検証は全49面の設計承認後。</text></g></svg>
