<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1210" viewBox="0 0 1600 1210" role="img" aria-label="89面v2 船底から返す装甲の切欠き"><title>89面v2 船底から返す装甲の切欠き</title><rect width="100%" height="100%" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#dce8f5">ARCLINE 089 v2｜船底から返す装甲の切欠き</text><text x="40" y="82" font-size="19" fill="#adc0d7">外甲板のC越し弧 ／ 任意の装甲開口 ／ 船底から逆向きW反射</text><polygon points="80.0,920.0 140.0,920.0 140.0,935.0 80.0,935.0" fill="#314551"/><polyline points="80.0,920.0 140.0,920.0" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="1415.0,920.0 1430.0,920.0 1430.0,935.0 1415.0,935.0" fill="#314551"/><polyline points="1415.0,920.0 1430.0,920.0" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="200.0,620.0 245.0,582.5 455.0,582.5 507.5,635.0 417.5,687.5 252.5,680.0" fill="#536878" stroke="#b6c6ce" stroke-width="1.5"/><polygon points="695.0,785.0 785.0,806.5744827251714 875.0,853.4255172748286 905.0,770.0 1025.0,770.0 1122.5,680.0 1160.0,680.0 1160.0,815.0 1010.0,920.0 837.5,920.0 717.5,852.5" fill="#536878" stroke="#b6c6ce" stroke-width="1.5"/><polygon points="1040.0,485.0 1122.5,485.0 1197.5,545.0 1430.0,545.0 1430.0,657.5 1167.5,702.5 1055.0,657.5" fill="#536878" stroke="#b6c6ce" stroke-width="1.5"/><polygon points="1055.0,485.0 1100.0,485.0 1100.0,372.5 1055.0,357.5" fill="#b28a56" stroke="#b6c6ce" stroke-width="1.5"/><rect x="605.0" y="260.0" width="225.0" height="285.0" fill="#a5b7c9" fill-opacity=".13" stroke="#a5b7c9" stroke-dasharray="5 5"/><polyline points="785.0,806.5744827251714 875.0,853.4255172748286" fill="none" stroke="#83d9ee" stroke-width="2.5" stroke-dasharray=""/><polyline points="342.5,560.0 470.0,432.5 665.0,335.0 800.0,297.5 987.5,312.5 1160.0,372.5 1317.5,522.5" fill="none" stroke="#76e0c4" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="972.5,747.5 935.0,740.0 897.5,755.0 860.0,794.0 830.0,830.0 905.0,589.25 980.0,418.24999999999994 1055.0,318.5 1130.0,288.5 1205.0,329.75 1317.5,522.5" fill="none" stroke="#83d9ee" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="342.5,560.0 530.0,440.0 792.5,402.5 1070.0,432.5 1190.0,470.0 1317.5,522.5" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray="4 8"/><polyline points="342.5,560.0 530.0,260.0 792.5,170.0 980.0,335.0 980.0,770.0" fill="none" stroke="#aabccf" stroke-width="2.5" stroke-dasharray="2 7"/><ellipse cx="342.5" cy="570.5" rx="16.5" ry="12" fill="#76e0c4"/><ellipse cx="1317.5" cy="533.0" rx="16.5" ry="12" fill="#ff9caa"/><polyline points="1100.0,560.0 1175.0,597.5 1377.5,597.5" fill="none" stroke="#8299a5" stroke-width="2.5" stroke-dasharray=""/><text x="170" y="652" font-size="18" fill="#76e0c4">P0：外甲板／頭上は開放</text><text x="630" y="457" font-size="23" fill="#b7c8db">C：速度減衰</text><text x="630" y="486" font-size="17" fill="#b7c8db">実体遮蔽ではない</text><text x="975" y="314" font-size="18" fill="#e6ba6f">D04：装甲の独立片</text><text x="975" y="343" font-size="17" fill="#e6ba6f">橙の弧は破壊後のみ</text><text x="935" y="705" font-size="18" fill="#83d9ee">B：船底の固定足場</text><text x="905" y="735" font-size="17" fill="#83d9ee">← 10px歩いて左へ向き直る</text><text x="670" y="888" font-size="18" fill="#83d9ee">W：船底に支持された下降斜面</text><text x="670" y="916" font-size="17" fill="#83d9ee">左へ撃ち込み、右上へ返す構想</text><circle cx="980" cy="765" r="5" fill="#83d9ee"/><text x="1260" y="615" font-size="18" fill="#dce8f5">固定船首：直射遮断は残る</text><text x="1290" y="568" font-size="17" fill="#ff9caa">enemy:volt</text><path d="M327.5,508.0l7,7l-7,7l-7,-7z" fill="#ffe59a"/><text x="170" y="488" font-size="16" fill="#ffe59a">SK089（既存・任意）</text><text x="40" y="1010" font-size="21" fill="#dce8f5">外甲板はCを読む。装甲を開けば低めの弧へ。船底は転移と向き直りを使いWで返す。</text><text x="40" y="1049" font-size="19" fill="#adc0d7">三経路を同時に使わず、必須破壊・必須転移ゼロの外甲板経路も残す。</text><text x="40" y="1088" font-size="18" fill="#adc0d7">D04を除いても固定船首は残り、初期敵への代表直射は遮断。P0/Bの頭上は開放。</text><text x="40" y="1127" font-size="17" fill="#ffb8ad">図の折れ線は構想。実W反射のbounce付き命中・C命中・転移着地・20行動勝利は未検証。</text><text x="40" y="1166" font-size="17" fill="#adc0d7">船底の反射は静的な接触と方向だけを確認。実戦の成立は全49面の設計承認後に検証。</text></g></svg>
