<body><main>
<div class="kicker">ARCLINE　/　100 MAP DESIGN REVIEWS</div>
<h1 id="reviewTitle">マップ比較</h1>
<p class="intro">1面ずつ、既存と変更案を見比べて確認します。難しい数値は省き、<strong>何が変わるか、遊びがどう変わるか</strong>に絞りました。</p>
<nav class="tabs" aria-label="ステージ選択"><button id="prev" type="button">前の面</button><select id="stagePicker" aria-label="ステージを選択"></select><button id="next" type="button">次の面</button><span class="muted" id="reviewProgress"></span></nav>
<label>表示する範囲 <select id="rangePicker"><option value="all">51〜99面すべて</option><option value="51">51〜60面</option><option value="61">61〜70面</option><option value="71">71〜80面</option><option value="81">81〜90面</option><option value="91">91〜99面</option></select></label>
<section class="sheet" id="stageSheet" aria-live="polite"><noscript>この比較ページではJavaScriptを使用します。</noscript>
<div class="topline"><h2 id="stageTitle"></h2><span class="status" id="stageStatus"></span></div>
<p class="lead" id="headline"></p><p class="sublead" id="why"></p>
<p class="muted">既存マップと新しい設計案を、同じ縮尺で比較します。</p>
<div class="tabs" aria-label="比較元"><span>比較元</span><button id="compareLive" type="button" aria-pressed="true">現行ゲーム</button><button id="comparePrevious" type="button" aria-pressed="false">前回の設計</button></div>
<p id="previousChange" class="sublead"></p>
<button id="toggleScale" type="button" aria-pressed="false">図面を拡大</button>
<div class="tabs"><label>開口 <select id="openingState"><option value="intact">破壊前</option><option value="main">主経路の開口後</option><option value="alternative">別解の開口後</option></select></label><label><input id="partLabels" type="checkbox" checked> 部品ID</label><label><input id="showShots" type="checkbox" checked> 単発弾道例</label></div>
<div class="tabs"><label>弾道の射点 <select id="shotPoint"><option value="all">自動（最大2経路）</option></select></label><label>装置周期 <select id="worldRound"><option value="1">初期の周期</option><option value="2">次の周期</option></select></label><label>磁極の条件 <select id="polarityState"><option value="0">初期配置</option><option value="1">切替条件 ＋</option><option value="-1">切替条件 −</option></select></label></div>
<div class="grid" id="maps"></div>
<p id="shotStatus" class="note"></p>
<details><summary>破壊単位と部品ID</summary><div style="overflow:auto"><table style="width:100%;font-size:12px;text-align:left"><thead><tr><th>ID</th><th>区分・単位数</th><th>役割</th></tr></thead><tbody id="partRows"></tbody></table></div></details>
<div class="summary"><article><h3>主ルート</h3><p id="mainRoute"></p></article><article><h3>別解</h3><p id="alternativeRoute"></p></article></div>
<p id="tradeoff" class="sublead"></p>
<div class="summary">
<article><h3>変わるところ</h3><p id="changed"></p></article>
<article><h3>変わらないところ</h3><p id="preserved"></p></article>
</div>
<div class="goal"><h3>この面で学ぶこと</h3><p id="goal"></p></div>
<div class="links"><a id="detail" href="#">詳しい設計内容</a><a id="json" href="#">設計データ</a></div>
<div class="note">図は地形の設計断面でありゲームのスクリーンショットではありません。ゲーム本体は未変更。自動対戦シミュレーション・実機確認は行っていません。</div>
</section>
<footer id="reviewFooter">表示中の設計案を比較して確認します。</footer>

  if('CFUV'.includes(typ)&&v.length>=4){
   out+='<rect x="'+(v[0]*10)+'" y="'+yOf(v[3])+'" width="'+((v[1]-v[0])*10)+'" height="'+((v[3]-v[2])*10)+'" rx="5" fill="#a3dcd8" fill-opacity="'+(typ==='V'&&!ventOn?'.04':'.18')+'" stroke="#c3e9ce" stroke-width="3" stroke-dasharray="7 6"/>';
   out+='<text x="'+(v[0]*10+10)+'" y="'+(yOf(v[3])+30)+'" font-size="28" fill="#c3e9ce">'+({F:'風 F '+(([54,55].includes(s.stageNumber)?1:tick%2?-1:1)>0?'→':'←'),U:'上昇 U',C:'減速 C',V:'噴出 V '+(ventOn?'ON':'OFF')}[typ]||esc(typ))+'</text>';
  }else if(typ==='W'&&v.length>=2){
   const edges=[];
   for(const floor of s.floors||[s.floor])for(let i=1;i<floor.length;i++)edges.push([floor[i-1],floor[i]]);
   const inside=(q,p)=>{let yes=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>q[1])!==(b[1]>q[1])&&q[0]<(b[0]-a[0])*(q[1]-a[1])/(b[1]-a[1])+a[0])yes=!yes;}return yes;};
   for(const p of s.parts||[])if(!p.breakable)for(let i=0;i<p.poly.length;i++){const a=p.poly[i],b=p.poly[(i+1)%p.poly.length],x=(a[0]+b[0])/2,h=(a[1]+b[1])/2;if(a[0]!==b[0]&&inside([x,h-.01],p.poly)&&!inside([x,h+.01],p.poly))edges.push(a[0]<b[0]?[a,b]:[b,a]);}
   for(const edge of edges){const x1=Math.max(v[0],edge[0][0]),x2=Math.min(v[1],edge[1][0]);if(x2>x1)out+='<polyline points="'+line([[x1,floorAt(edge,x1)],[x2,floorAt(edge,x2)]])+'" fill="none" stroke="#9eddf4" stroke-width="8" stroke-dasharray="10 5"/>';}
  }else if(typ==='B'){
   const angle=((v[3]+(f.defaultPose==='lowered'?1:0)+tick)%2?f.openAngleDeg??75:v[4]||0)*Math.PI/180;
   const a=[v[0],v[1]],b=[v[0]+Math.cos(angle)*v[2],v[1]+Math.sin(angle)*v[2]];
   const other=angle===(v[4]||0)*Math.PI/180?(f.openAngleDeg??75)*Math.PI/180:(v[4]||0)*Math.PI/180,c=[v[0]+Math.cos(other)*v[2],v[1]+Math.sin(other)*v[2]];
   out+='<polygon points="'+line([a,b,[b[0],b[1]-1.2],[a[0],a[1]-1.2]])+'" fill="#d2b58f" stroke="#fff0ce" stroke-width="3"/><polyline points="'+line([a,c])+'" fill="none" stroke="#e7be8e" stroke-width="4" stroke-dasharray="8 7"/>';
   out+='<text x="'+(v[0]*10+10)+'" y="'+(yOf(v[1])-14)+'" font-size="27" fill="#ffe4be">開閉橋</text>';
  }else if(typ==='K'){
   const theta=v[2]*Math.PI/180,r=5.5*(f.sizeFactor||1),a=[v[0]-Math.cos(theta)*r,v[1]+Math.sin(theta)*r],b=[v[0]+Math.cos(theta)*r,v[1]-Math.sin(theta)*r];
   out+='<polyline points="'+line([a,b])+'" fill="none" stroke="#edc1ff" stroke-width="9"/><text x="'+(v[0]*10+15)+'" y="'+(yOf(v[1])-20)+'" font-size="25" fill="#edc1ff">K</text>';
  }else if(typ==='M'&&v.length>=3)out+='<circle cx="'+(v[0]*10)+'" cy="'+yOf(v[1])+'" r="'+(v[2]*10)+'" fill="#bcb0ec" fill-opacity=".13" stroke="#c5b6ef" stroke-width="3"/><text x="'+(v[0]*10)+'" y="'+yOf(v[1])+'" font-size="26" fill="#d8cfff">M '+((s.polarity||v[3])>0?'+':'−')+'</text>';
  else if(typ==='T')out+='<rect x="'+(v[0]*10-17)+'" y="'+(yOf(v[1])-17)+'" width="34" height="34" fill="#f3d38c"/><text x="'+(v[0]*10+22)+'" y="'+yOf(v[1])+'" font-size="26" fill="#fff0c6">端子 T</text>';
  else if(v.length>=2)out+='<circle cx="'+(v[0]*10)+'" cy="'+yOf(v[1])+'" r="13" fill="#ebcc90"/>';
 }
 return out;
}
function partDrawing(s,ghost){
 let out='';
 for(const p of s.parts||[]){
  const pts=p.poly||[];
  if(pts.length<3)continue;
  const fill=p.kind==='roof'?'#6b8195':p.kind==='island'?(s.material==='ice'?'#91bdcd':'#8cbdaf'):(s.material==='ice'?'#719eaf':'#a28670');
  const units=p.renderUnits||[{id:p.id,poly:pts,label:p.displayId||''}];
  for(const u of units){const opened=(s.openedUnits||[]).includes(u.id),shape=u.poly;
   out+='<polygon data-unit-id="'+esc(u.id)+'" data-opened="'+opened+'" points="'+line(shape)+'" fill="'+(opened?'none':fill)+'" fill-opacity="'+(ghost?.15:.94)+'" stroke="'+(opened?'#f2b974':p.breakable?'#ffd092':'#cee4dd')+'" stroke-width="'+(p.breakable?4:3)+'" '+(p.breakable||opened?'stroke-dasharray="8 5"':'')+'/>';
   if(current.ids&&u.label){const x=shape.reduce((t,p)=>t+p[0],0)/shape.length,h=shape.reduce((t,p)=>t+p[1],0)/shape.length;out+='<text class="unit-label" x="'+(x*10)+'" y="'+yOf(h)+'" text-anchor="middle" font-size="24" fill="'+(p.breakable?'#fff1c3':'#e1ecee')+'" stroke="#142b36" stroke-width="2" paint-order="stroke">'+esc(u.label)+(opened?' 開':'')+'</text>';}
  }
  if(p.reflectiveUnderside&&!ghost)out+='<polyline points="'+line(p.reflectiveUnderside)+'" fill="none" stroke="#9eddf4" stroke-width="8" stroke-dasharray="10 5"/>';
 }
 return out;
}
function routeDrawing(s){
 const shots=matchingShots(s);
 let out=shots.length?shots.map((r,i)=>'<polyline class="shot-path" points="'+line(r.path)+'" fill="none" stroke="'+(i?'#b6b6fa':'#f1ca8b')+'" stroke-width="4"/>').join(''):(s.routes||[]).map(r=>'<polyline points="'+line(r.points)+'" fill="none" stroke="'+(r.kind==='main'?'#f1ca8b':r.kind==='support'?'#94e8e0':'#b6b6fa')+'" stroke-width="4" stroke-dasharray="9 8"/>').join('');
 out+=(s.accessPaths||[]).map(r=>'<polyline class="access-path" points="'+line(r.points)+'" fill="none" stroke="#82c9ec" stroke-opacity=".65" stroke-width="3" stroke-dasharray="3 10"/>').join('');return out;
}
function matchingShots(s){return current.shots?(s.shotExamples||[]).filter(r=>(current.point==='all'||r.id===current.point)&&(r.round||1)===(s.worldRound||1)&&(r.assumedPolarity||0)===(s.polarity||0)&&JSON.stringify([...(r.destroyed||[])].sort())===JSON.stringify([...(s.openedUnits||[])].sort())).slice(0,2):[];}
function markers(s,ghost=false){
 let out='';
 for(const [key,label,color] of [['player',s.player.facing===-1?'P ◀':'P','#b5f2d0'],['enemy','E','#ecaea1']]){
  const p=s[key],x=p.x*10,y=yOf(p.h)-24;
  out+='<circle cx="'+x+'" cy="'+y+'" r="15" fill="'+color+'" fill-opacity="'+(ghost?.35:1)+'" stroke="#173643" stroke-width="3"/>';
  if(!ghost)out+='<text x="'+(x+21)+'" y="'+(y-5)+'" font-size="24" font-weight="700" fill="#f2faf9">'+label+'</text>';
 }
 for(const item of s.pickups||[]){
  if(!Number.isFinite(item.x)||!Number.isFinite(item.h))continue;
  const x=item.x*10,y=yOf(item.h);
  out+='<path d="M '+x+' '+(y-15)+' L '+(x+14)+' '+y+' L '+x+' '+(y+15)+' L '+(x-14)+' '+y+' Z" fill="#f5d28b" stroke="#3b3825" stroke-width="2"/>';
 }
 for(const p of s.firingPoints||[]){
  const x=p.x*10,y=yOf(p.h)-24;
  out+='<circle cx="'+x+'" cy="'+y+'" r="13" fill="#102c37" stroke="#d1c8ff" stroke-width="3"/><text x="'+(x+18)+'" y="'+(y-9)+'" font-size="26" fill="#ddd4ff">'+esc(p.label)+'</text>';
 }
 for(const p of s.targets||[]){
  const x=p.x*10,y=yOf(p.h);
  out+='<circle cx="'+x+'" cy="'+y+'" r="16" fill="#102c37" stroke="#ffb4bb" stroke-width="4"/><text x="'+(x+(p.labelDx??22))+'" y="'+(y-10)+'" font-size="26" fill="#ffced2">'+esc(p.label)+'</text>';
 }
 return out;
}
function drawing(m,kind){
 const f=frame(m),old=kind==='before',previous=old&&current.comparison==='previous'&&m.previous,s=old?(previous?m.previous:m.before):{...m.after,worldRound:current.round,polarity:current.polarity,openedUnits:(m.destructionPlans||{})[current.opening]||[]};
 const bg='<rect x="0" y="'+f.top+'" width="'+f.width+'" height="'+(f.bottom-f.top)+'" fill="#102c37"/>';
 let grid='';for(let x=0;x<=f.width;x+=100)grid+='<line x1="'+x+'" y1="'+f.top+'" x2="'+x+'" y2="'+f.bottom+'" stroke="#d4e9e6" stroke-opacity=".08"/>';
 const graphic=floorDrawing(s,f.bottom,false)+partDrawing(s,false)+featureDrawing(s)+routeDrawing(s)+markers(s);
 const label=old?(previous?'前回の設計案':'現行ゲーム'):'今回の設計案';
 const samples=matchingShots(s),routes=samples.length?samples.map((r,i)=>'<p class="legend">'+(i?'紫':'金')+'：固定敵への単発例 '+esc(r.id)+'／角度'+r.angle+'・出力'+r.power+(r.assumedPolarity?'／仮の極性'+r.assumedPolarity:'')+'</p>').join(''):(s.routes||[]).map(r=>'<p class="legend">'+esc(r.label)+'（概念経路）</p>').join('');
 return '<div class="map"><div class="header"><strong>'+label+'</strong><span class="tag">'+(old?(previous?'未承認の前案':'0.23.0'):'未承認・ゲーム未反映')+'</span></div><div class="chart"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 '+f.top+' '+f.width+' '+(f.bottom-f.top)+'" role="img" aria-label="'+label+'">'+bg+grid+graphic+'</svg></div><p class="legend">P＝自機 E＝敵 ◆＝アイテム 青い鏡面＝反射材 D＝個別破壊 F＝破壊不可</p>'+((s.firingPoints||[]).length?'<p class="legend">A・B・C＝候補射点。青の細点線は移動構想で、実測の転移軌道ではありません。</p>':'')+routes+(routes?'<p class="legend">単発例は固定した敵・仮の開口状態での確認です。全手順・反撃・実際の転移は未検証。</p>':'')+'</div>';
}
function selectStage(i,changeHash=true){
 current.index=Math.max(0,Math.min(STAGES.length-1,i));
 if(changeHash)history.replaceState(null,'','#stage-'+String(STAGES[current.index].stage).padStart(3,'0'));
 render();
}
function render(){
 if(!STAGES.length)return;
 const m=STAGES[current.index];
 const points=m.after.shotExamples||[];if(current.point!=='all'&&!points.some(x=>x.id===current.point))current.point='all';byId('shotPoint').innerHTML='<option value="all">自動（最大2経路）</option>'+points.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.id)+'：周期'+x.round+'／極性'+(x.assumedPolarity||0)+'／'+esc(x.plan)+'</option>').join('');byId('shotPoint').value=current.point;
 byId('openingState').value=current.opening;
 byId('worldRound').value=String(current.round);byId('polarityState').value=String(current.polarity);
 byId('partRows').innerHTML=(m.after.parts||[]).map(p=>'<tr><td>'+esc(p.displayId||p.id)+'<br>'+esc(p.id)+'</td><td>'+(p.breakable?'個別破壊 '+(p.unitCount||1)+'単位':'破壊不可')+'</td><td>'+esc(p.purpose||'')+'</td></tr>').join('');
 byId('shotStatus').textContent=m.shotProbeSummary||'単発弾道の確認結果を読み込み中。攻略全体の合格判定ではありません。';
 if(!m.previous)current.comparison='live';
 byId('comparePrevious').disabled=!m.previous;
 byId('compareLive').setAttribute('aria-pressed',String(current.comparison==='live'));
 byId('comparePrevious').setAttribute('aria-pressed',String(current.comparison==='previous'));
 byId('previousChange').textContent=m.changeFromPrevious||'';
 byId('mainRoute').textContent=m.mainRoute||'';
 byId('alternativeRoute').textContent=m.alternativeRoute||'';
 byId('tradeoff').textContent=m.tradeoff||'';
 byId('stageTitle').textContent='STAGE '+String(m.stage).padStart(2,'0')+'　'+m.title;
 const badge=byId('stageStatus');badge.textContent=m.state==='approved'?'承認済み':'確認待ち';badge.className='status '+m.state;
 byId('headline').textContent=m.headline||'';
 byId('why').textContent=m.why||'';
 byId('changed').textContent=m.headline||'';
 byId('preserved').textContent=m.preserved||'';
 byId('goal').textContent=m.goal||'';
 byId('maps').innerHTML=drawing(m,'before')+drawing(m,'after');
 byId('detail').href=m.detail||'#';
 byId('json').href=m.source||'#';
 byId('stagePicker').value=String(m.stage);
 byId('prev').disabled=current.index===0;byId('next').disabled=current.index===STAGES.length-1;
 byId('reviewProgress').textContent=(current.index+1)+' / '+STAGES.length+' 面';
}
function loadGallery(){
 try{
  // 画面データをHTML内に同梱。別ファイルの取得・CORS・file:// に依存しない。
  const element=byId('embedded-gallery-data');
  if(!element)throw Error('内蔵データがありません');
  const data=JSON.parse(element.textContent);
  if(!Array.isArray(data.stages)||!data.stages.length)throw Error('マップデータが空です。');
  byId('reviewTitle').textContent=data.reviewTitle||'マップ比較';
  byId('reviewFooter').textContent=data.reviewFooter||'承認・実装状態は進行台帳を確認してください。';
  const seen=new Set();for(const m of data.stages){validateStage(m);if(seen.has(m.stage))throw Error('ステージ番号が重複しています。');seen.add(m.stage);}
  STAGES=data.stages.filter(m=>!data.reviewScope||data.reviewScope.includes(m.stage)).sort((a,b)=>a.stage-b.stage);
  ALL_STAGES=STAGES.slice();
  if(!STAGES.length)throw Error('確認範囲のマップデータがありません。');
  const select=byId('stagePicker');select.replaceChildren();
  for(const m of STAGES){const option=document.createElement('option');option.value=String(m.stage);option.textContent='STAGE '+String(m.stage).padStart(2,'0')+'　'+m.title+(m.state==='approved'?'　✓':'　確認待ち');select.appendChild(option);}
  const inHash=STAGES.findIndex(m=>'stage-'+String(m.stage).padStart(3,'0')===location.hash.slice(1));
  const pending=STAGES.findIndex(m=>m.state==='pending');
  selectStage(inHash>=0?inHash:pending>=0?pending:STAGES.length-1,false);
 }catch(e){
  byId('stageTitle').textContent='データを読み込めませんでした';
  byId('why').textContent='このHTMLの内蔵データに問題があります。'+e.message;
  byId('reviewProgress').textContent='データ読込エラー';
 }
}
byId('prev').addEventListener('click',()=>selectStage(current.index-1));
byId('compareLive').addEventListener('click',()=>{current.comparison='live';render();});
byId('comparePrevious').addEventListener('click',()=>{current.comparison='previous';render();});
byId('toggleScale').addEventListener('click',()=>{current.zoom=!current.zoom;byId('maps').classList.toggle('zoomed',current.zoom);byId('toggleScale').setAttribute('aria-pressed',String(current.zoom));byId('toggleScale').textContent=current.zoom?'図面を全体表示':'図面を拡大';});
byId('openingState').addEventListener('change',e=>{current.opening=e.target.value;render();});
byId('partLabels').addEventListener('change',e=>{current.ids=e.target.checked;render();});
byId('showShots').addEventListener('change',e=>{current.shots=e.target.checked;render();});
byId('shotPoint').addEventListener('change',e=>{current.point=e.target.value;render();});
byId('worldRound').addEventListener('change',e=>{current.round=Number(e.target.value);render();});
byId('polarityState').addEventListener('change',e=>{current.polarity=Number(e.target.value);render();});
byId('rangePicker').addEventListener('change',e=>{const first=Number(e.target.value);STAGES=first?ALL_STAGES.filter(m=>m.stage>=first&&m.stage<=first+9):ALL_STAGES.slice();const picker=byId('stagePicker');picker.replaceChildren();for(const m of STAGES){const o=document.createElement('option');o.value=String(m.stage);o.textContent='STAGE '+m.stage+' '+m.title;picker.appendChild(o);}selectStage(0);});
byId('next').addEventListener('click',()=>selectStage(current.index+1));
byId('stagePicker').addEventListener('change',e=>{const idx=STAGES.findIndex(m=>m.stage===Number(e.target.value));if(idx>=0)selectStage(idx);});
window.addEventListener('hashchange',()=>{const i=STAGES.findIndex(m=>'stage-'+String(m.stage).padStart(3,'0')===location.hash.slice(1));if(i>=0)selectStage(i,false);});
loadGallery();

</script></body></html>
