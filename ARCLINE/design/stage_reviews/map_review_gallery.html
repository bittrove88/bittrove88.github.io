<script>

'use strict';
const byId=id=>document.getElementById(id);
const current={index:0};
let STAGES=[];
const yOf=h=>500-Number(h)*10;
const n=x=>Number(x).toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,k=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[k]));
const point=p=>(Number(p[0])*10)+','+n(yOf(p[1]));
const line=pts=>pts.map(point).join(' ');
function validateStage(m){
 if(!Number.isInteger(m.stage)||!m.title||!['approved','pending'].includes(m.state))throw Error('ステージ情報に誤りがあります。');
 for(const s of [m.before,m.after])if(!s||!Number.isFinite(s.width)||!Array.isArray(s.floor)||s.floor.length<2||!s.player||!s.enemy)throw Error('地形データに不足があります。');
}
function frame(m){
 const scenes=[m.before,m.after],maxW=Math.max(...scenes.map(s=>s.width));
 const heights=scenes.flatMap(s=>[...(s.floors||[s.floor]).flat(),...(s.parts||[]).flatMap(p=>p.poly||[]),...(s.routes||[]).flatMap(r=>r.points||[]),...(s.features||[]).filter(f=>'CFUV'.includes(f.type)).flatMap(f=>[[f.v[0],f.v[2]],[f.v[1],f.v[3]]]),[s.player.x,s.player.h],[s.enemy.x,s.enemy.h]].map(p=>Number(p[1])));
 const maxH=Math.max(30,...heights),minH=Math.min(0,...heights);
 return{width:maxW,top:Math.min(170,yOf(maxH)-70),bottom:Math.max(555,yOf(minH)+55)};
}
function floorAt(floor,x){
 for(let i=1;i<floor.length;i++){const a=floor[i-1],b=floor[i];if(x>=a[0]&&x<=b[0])return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}
 return null;
}
function floorDrawing(s,bottom,ghost){
 let out='';
 for(const floor of s.floors||[s.floor]){
  const polygon=line(floor)+' '+(floor[floor.length-1][0]*10)+','+bottom+' '+(floor[0][0]*10)+','+bottom;
  if(!ghost)out+='<polygon points="'+polygon+'" fill="#416658" fill-opacity=".86"/>';
  out+='<polyline points="'+line(floor)+'" fill="none" stroke="'+(ghost?'#c7d7dd':'#99e6c1')+'" stroke-width="'+(ghost?5:6)+'" '+(ghost?'stroke-dasharray="11 8"':'')+'/>';
 }
 return out;
}
function featureDrawing(s){
 let out='';
 for(const f of s.features||[]){
  const v=f.v||[];const typ=String(f.type||'');
  if('CFUV'.includes(typ)&&v.length>=4){
   out+='<rect x="'+(v[0]*10)+'" y="'+yOf(v[3])+'" width="'+((v[1]-v[0])*10)+'" height="'+((v[3]-v[2])*10)+'" rx="5" fill="#a3dcd8" fill-opacity=".18" stroke="#c3e9ce" stroke-width="3" stroke-dasharray="7 6"/>';
   out+='<text x="'+(v[0]*10+10)+'" y="'+(yOf(v[3])+30)+'" font-size="28" fill="#c3e9ce">'+(typ==='F'?'風 F':esc(typ))+'</text>';
  }else if(typ==='W'&&v.length>=2){
   const start=Number(v[0]),end=Number(v[1]),pts=[];
   for(let x=start;x<=end+1e-8;x+=2){let h=null;for(const floor of s.floors||[s.floor]){h=floorAt(floor,x);if(h!==null)break;}if(h!==null)pts.push([x,h]);}
   if(!pts.length||pts[pts.length-1][0]<end){let h=null;for(const floor of s.floors||[s.floor]){h=floorAt(floor,end);if(h!==null)break;}if(h!==null)pts.push([end,h]);}
   if(pts.length>=2)out+='<polyline points="'+line(pts)+'" fill="none" stroke="#9eddf4" stroke-width="8" stroke-linejoin="round" stroke-dasharray="10 5"/>';
  }else if(typ==='M'&&v.length>=3)out+='<circle cx="'+(v[0]*10)+'" cy="'+yOf(v[1])+'" r="'+(v[2]*10)+'" fill="#bcb0ec" fill-opacity=".13" stroke="#c5b6ef" stroke-width="3"/>';
  else if(v.length>=2)out+='<circle cx="'+(v[0]*10)+'" cy="'+yOf(v[1])+'" r="13" fill="#ebcc90"/>';
 }
 return out;
}
function partDrawing(s,ghost){
 let out='';
 for(const p of s.parts||[]){
  const pts=p.poly||[];
  if(pts.length<3)continue;
  const fill=p.kind==='roof'?'#6b8195':p.kind==='island'?'#8cbdaf':'#a28670';
  out+='<polygon points="'+line(pts)+'" fill="'+fill+'" fill-opacity="'+(ghost?.15:.94)+'" stroke="'+(ghost?'#c8d6da':'#cee4dd')+'" stroke-width="3" '+(ghost?'stroke-dasharray="8 5"':'')+'/>';
  if(p.breakable&&!ghost)out+='<polyline points="'+line(pts)+'" fill="none" stroke="#ffd092" stroke-width="4" stroke-dasharray="8 5"/>';
  if(p.reflectiveUnderside&&!ghost)out+='<polyline points="'+line(p.reflectiveUnderside)+'" fill="none" stroke="#9eddf4" stroke-width="8" stroke-dasharray="10 5"/>';
 }
 return out;
}
function routeDrawing(s){
 return (s.routes||[]).map(r=>'<polyline points="'+line(r.points)+'" fill="none" stroke="'+(r.kind==='main'?'#f1ca8b':'#b6b6fa')+'" stroke-width="4" stroke-dasharray="9 8" stroke-linejoin="round"/>').join('');
}
function markers(s,ghost=false){
 let out='';
 for(const [key,label,color] of [['player','P','#b5f2d0'],['enemy','E','#ecaea1']]){
  const p=s[key],x=p.x*10,y=yOf(p.h)-24;
  out+='<circle cx="'+x+'" cy="'+y+'" r="15" fill="'+color+'" fill-opacity="'+(ghost?.35:1)+'" stroke="#173643" stroke-width="3"/>';
  if(!ghost)out+='<text x="'+(x+21)+'" y="'+(y-5)+'" font-size="24" font-weight="700" fill="#f2faf9">'+label+'</text>';
 }
 for(const item of s.pickups||[]){
  if(!Number.isFinite(item.x)||!Number.isFinite(item.h))continue;
  const x=item.x*10,y=yOf(item.h);
  out+='<path d="M '+x+' '+(y-15)+' L '+(x+14)+' '+y+' L '+x+' '+(y+15)+' L '+(x-14)+' '+y+' Z" fill="#f5d28b" stroke="#3b3825" stroke-width="2"/>';
 }
 for(const p of s.firingPoints||[]){
  const x=p.x*10,y=yOf(p.h)-24;
  out+='<circle cx="'+x+'" cy="'+y+'" r="13" fill="#102c37" stroke="#d1c8ff" stroke-width="3"/><text x="'+(x+18)+'" y="'+(y-9)+'" font-size="26" fill="#ddd4ff">'+esc(p.label)+'</text>';
 }
 for(const p of s.targets||[]){
  const x=p.x*10,y=yOf(p.h);
  out+='<circle cx="'+x+'" cy="'+y+'" r="16" fill="#102c37" stroke="#ffb4bb" stroke-width="4"/><text x="'+(x+22)+'" y="'+(y-10)+'" font-size="26" fill="#ffced2">'+esc(p.label)+'</text>';
 }
 return out;
}
function drawing(m,kind){
 const f=frame(m),old=kind==='before',s=old?m.before:m.after;
 const bg='<rect x="0" y="'+f.top+'" width="'+f.width+'" height="'+(f.bottom-f.top)+'" fill="#102c37"/>';
 let grid='';for(let x=0;x<=f.width;x+=100)grid+='<line x1="'+x+'" y1="'+f.top+'" x2="'+x+'" y2="'+f.bottom+'" stroke="#d4e9e6" stroke-opacity=".08"/>';
 const graphic=floorDrawing(s,f.bottom,false)+partDrawing(s,false)+featureDrawing(s)+routeDrawing(s)+markers(s);
 const label=old?'既存マップ':'新しい設計案';
 const routes=(s.routes||[]).map(r=>'<p class="legend" style="color:'+(r.kind==='main'?'#f1ca8b':'#c7c3ff')+'">'+(r.kind==='main'?'金：':'紫：')+esc(r.label)+'</p>').join('');
 return '<div class="map"><div class="header"><strong>'+label+'</strong><span class="tag">'+(old?'現在':'未承認・ゲーム未反映')+'</span></div><div class="chart"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 '+f.top+' '+f.width+' '+(f.bottom-f.top)+'" role="img" aria-label="'+label+'">'+bg+grid+graphic+'</svg></div><p class="legend">P＝自機　E＝敵　◆＝アイテム　青点線＝反射材　橙点線＝破壊可能</p>'+((s.firingPoints||[]).length?'<p class="legend">A・B＝候補射点（移動・転移で到達する構想）</p>':'')+routes+(routes?'<p class="legend">経路線は攻略の構想です。実測弾道ではありません。</p>':'')+'</div>';
}
function selectStage(i,changeHash=true){
 current.index=Math.max(0,Math.min(STAGES.length-1,i));
 if(changeHash)history.replaceState(null,'','#stage-'+String(STAGES[current.index].stage).padStart(3,'0'));
 render();
}
function render(){
 if(!STAGES.length)return;
 const m=STAGES[current.index];
 byId('stageTitle').textContent='STAGE '+String(m.stage).padStart(2,'0')+'　'+m.title;
 const badge=byId('stageStatus');badge.textContent=m.state==='approved'?'承認済み':'確認待ち';badge.className='status '+m.state;
 byId('headline').textContent=m.headline||'';
 byId('why').textContent=m.why||'';
 byId('changed').textContent=m.headline||'';
 byId('preserved').textContent=m.preserved||'';
 byId('goal').textContent=m.goal||'';
 byId('maps').innerHTML=drawing(m,'before')+drawing(m,'after');
 byId('detail').href=m.detail||'#';
 byId('json').href=m.source||'#';
 byId('stagePicker').value=String(m.stage);
 byId('prev').disabled=current.index===0;byId('next').disabled=current.index===STAGES.length-1;
 byId('reviewProgress').textContent=(current.index+1)+' / '+STAGES.length+' 面';
}
function loadGallery(){
 try{
  // 画面データをHTML内に同梱。別ファイルの取得・CORS・file:// に依存しない。
  const element=byId('embedded-gallery-data');
  if(!element)throw Error('内蔵データがありません');
  const data=JSON.parse(element.textContent);
  if(!Array.isArray(data.stages)||!data.stages.length)throw Error('マップデータが空です。');
  byId('reviewTitle').textContent=data.reviewTitle||'マップ比較';
  byId('reviewFooter').textContent=data.reviewFooter||'承認・実装状態は進行台帳を確認してください。';
  const seen=new Set();for(const m of data.stages){validateStage(m);if(seen.has(m.stage))throw Error('ステージ番号が重複しています。');seen.add(m.stage);}
  STAGES=data.stages.filter(m=>!data.reviewScope||data.reviewScope.includes(m.stage)).sort((a,b)=>a.stage-b.stage);
  if(!STAGES.length)throw Error('確認範囲のマップデータがありません。');
  const select=byId('stagePicker');select.replaceChildren();
  for(const m of STAGES){const option=document.createElement('option');option.value=String(m.stage);option.textContent='STAGE '+String(m.stage).padStart(2,'0')+'　'+m.title+(m.state==='approved'?'　✓':'　確認待ち');select.appendChild(option);}
  const inHash=STAGES.findIndex(m=>'stage-'+String(m.stage).padStart(3,'0')===location.hash.slice(1));
  const pending=STAGES.findIndex(m=>m.state==='pending');
  selectStage(inHash>=0?inHash:pending>=0?pending:STAGES.length-1,false);
 }catch(e){
  byId('stageTitle').textContent='データを読み込めませんでした';
  byId('why').textContent='このHTMLの内蔵データに問題があります。'+e.message;
  byId('reviewProgress').textContent='データ読込エラー';
 }
}
byId('prev').addEventListener('click',()=>selectStage(current.index-1));
byId('next').addEventListener('click',()=>selectStage(current.index+1));
byId('stagePicker').addEventListener('change',e=>{const idx=STAGES.findIndex(m=>m.stage===Number(e.target.value));if(idx>=0)selectStage(idx);});
window.addEventListener('hashchange',()=>{const i=STAGES.findIndex(m=>'stage-'+String(m.stage).padStart(3,'0')===location.hash.slice(1));if(i>=0)selectStage(i,false);});
loadGallery();

</script></body></html>
