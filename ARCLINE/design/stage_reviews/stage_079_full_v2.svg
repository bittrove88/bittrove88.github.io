<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1140" viewBox="0 0 1460 1140" role="img" aria-label="79面v2 折り下げ橋と固定保守台"><title>79面v2 折り下げ橋と固定保守台</title><rect width="100%" height="100%" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#dce8f5">ARCLINE 079 v2｜折り下げ橋と固定保守台</text><text x="40" y="82" font-size="19" fill="#adc0d7">水平橋から固定Aへ渡る ／ 橋下の固定LでTを撃ち、M側へ切り替える</text><polygon points="80.0,391.09999999999997 218.6,398.8 380.3,421.9 488.1,429.59999999999997 580.5,429.59999999999997 580.5,845.4 80.0,845.4" fill="#384b5b"/><polyline points="80.0,391.09999999999997 218.6,398.8 380.3,421.9 488.1,429.59999999999997 580.5,429.59999999999997" fill="none" stroke="#bdd1cb" stroke-width="2.5" stroke-dasharray=""/><polygon points="580.5,760.7 1027.1,760.7 1027.1,845.4 580.5,845.4" fill="#384b5b"/><polyline points="580.5,760.7 1027.1,760.7" fill="none" stroke="#bdd1cb" stroke-width="2.5" stroke-dasharray=""/><polygon points="1111.8,406.5 1312.0,406.5 1312.0,845.4 1111.8,845.4" fill="#384b5b"/><polyline points="1111.8,406.5 1312.0,406.5" fill="none" stroke="#bdd1cb" stroke-width="2.5" stroke-dasharray=""/><polygon points="642.1,429.59999999999997 734.5,429.59999999999997 765.3000000000001,460.4 734.5,498.9 657.5,498.9 642.1,475.8" fill="#5c7181" stroke="#b7c9d4" stroke-width="1.5"/><polygon points="580.5,760.7 580.5,645.2 657.5,645.2 657.5,760.7" fill="#5c7181" stroke="#b7c9d4" stroke-width="1.5"/><polygon points="495.8,429.59999999999997 526.6,429.59999999999997 526.6,352.59999999999997 603.6,352.59999999999997 603.6,321.8 495.8,321.8" fill="#5c7181" stroke="#b7c9d4" stroke-width="1.5"/><polyline points="580.5,429.59999999999997 642.1,429.59999999999997" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray=""/><circle cx="927.0" cy="568.2" r="138.6" fill="#b397e8" fill-opacity=".12" stroke="#c1a8eb" stroke-dasharray="6 5"/><circle cx="626.7" cy="560.5" r="15.4" fill="#59492c" stroke="#e6ba6f"/><text x="621.7" y="565.5" font-size="15" fill="#ffe5a2">T</text><polyline points="657.5,406.5 803.8000000000001,337.2 1004.0,306.4 1227.3,383.4" fill="none" stroke="#76e0c4" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="619.0,622.1 703.7,552.8 819.2,522.0 927.0,421.9 1057.9,329.5 1227.3,383.4" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray="8 7"/><ellipse cx="565.1" cy="417.59999999999997" rx="16.94" ry="12" fill="#76e0c4"/><ellipse cx="1227.3" cy="394.5" rx="16.94" ry="12" fill="#ff9caa"/><polyline points="580.5,429.59999999999997 633.8471648731214,460.4" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray="3 4"/><circle cx="657.5" cy="423.59999999999997" r="5" fill="#76e0c4"/><circle cx="619.0" cy="639.2" r="5" fill="#76e0c4"/><text x="460" y="473" font-size="18" fill="#76e0c4">P0</text><text x="645" y="394" font-size="18" fill="#76e0c4">A：橋から降りて固定射点へ</text><text x="550" y="687" font-size="18" fill="#e6ba6f">L：谷底に接続する固定保守台</text><text x="550" y="718" font-size="17" fill="#e6ba6f">T操作 → 境界で−1 → 右向きにMへ</text><text x="865" y="578" font-size="20" fill="#d5c3ff">M：初期＋1</text><text x="865" y="608" font-size="16" fill="#d5c3ff">L側はT切替後の−1を使う構想</text><text x="90" y="329" font-size="16" fill="#dce8f5">F03 短い整備アーム（左地盤に接続）</text><text x="90" y="356" font-size="16" fill="#76e0c4">P0の高角帯を限定。Aへ出ると頭上が開く</text><text x="1160" y="456" font-size="18" fill="#ff9caa">enemy:volt</text><path d="M465.0,353.3l7,7l-7,7l-7,-7z" fill="#ffe59a"/><text x="290" y="389" font-size="16" fill="#ffe59a">SK079（任意）</text><text x="790" y="255" font-size="18" fill="#76e0c4">A側はMを外す通常の弧</text><rect x="40" y="118" width="690" height="185" rx="9" fill="#17283c" stroke="#354b62"/><text x="58" y="145" font-size="18" fill="#dce8f5">Bの姿勢比較（局所拡大）</text><polyline points="70.0,256.0 104.5,256.0" fill="none" stroke="#bdd1cb" stroke-width="2.5" stroke-dasharray=""/><polyline points="104.5,256.0 196.5,256.0" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray=""/><polyline points="196.5,256.0 334.5,256.0" fill="none" stroke="#b7c9d4" stroke-width="2.5" stroke-dasharray=""/><text x="70" y="183" font-size="16" fill="#e6ba6f">水平：右の固定岩へ接続</text><polyline points="405.0,256.0 439.5,256.0" fill="none" stroke="#bdd1cb" stroke-width="2.5" stroke-dasharray=""/><polyline points="439.5,256.0 519.1743371481684,302.0" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray=""/><polyline points="531.5,256.0 669.5,256.0" fill="none" stroke="#b7c9d4" stroke-width="2.5" stroke-dasharray=""/><text x="405" y="183" font-size="16" fill="#e6ba6f">−30°：接続を外す</text><text x="40" y="900" font-size="21" fill="#dce8f5">主攻略：P0→Aへ120px渡り、整備アームの外へ。固定Aから高角帯を使う設計。</text><text x="40" y="938" font-size="18" fill="#e6ba6f">別の選択：固定Lへ転移しTを一射、既存境界で極性反転後にMを使う。Bの上は歩かない。</text><text x="40" y="976" font-size="18" fill="#adc0d7">Bは既存の手番周期で折り下がる。TがBを操作する前提や、無償の待機手番は置かない。</text><text x="40" y="1014" font-size="18" fill="#adc0d7">A・Lとも橋の両姿勢で支持を保持。支持が残ることは、反撃に安全という意味ではない。</text><text x="40" y="1055" font-size="17" fill="#ffb8ad">破線は構想。実歩行・橋の姿勢変更時の接地・転移着地・T/M命中・16行動勝利は未検証。</text><text x="40" y="1095" font-size="17" fill="#adc0d7">設計承認待ち・ゲーム未適用。詳細動作検証は全49面の設計承認後。</text></g></svg>
