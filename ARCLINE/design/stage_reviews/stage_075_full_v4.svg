<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">75面A v4 岩肩と一時防御の役割を分けた全景</title><desc id="desc">75面A案の詳細設計図。固定地形と一時防御ブロックの役割を示す。破線は模式線で、実弾道・通行・勝利の検証結果ではない。</desc>
<defs><pattern id="ore" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#df9954"/><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#986739" stroke-width="1.2"/></pattern>
<marker id="mainArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#83e9c7"/></marker>
<marker id="altArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a5bcff"/></marker></defs>
<rect width="100%" height="100%" fill="#0c1424"/><g font-family='"Noto Sans CJK JP", "Noto Sans JP", sans-serif'><text x="38.00" y="44.00" font-size="29" fill="#e8eef9" font-weight="700">ARCLINE 075 A v4  /  岩肩を越えて入る、横穴の切羽</text><text x="40.00" y="78.00" font-size="17" fill="#a6b5cf" font-weight="400">Aの方向性を採用した詳細設計候補　｜　直射の制御＝固定岩肩　　一時防御＝D　｜　設計承認待ち・動作未検証</text><rect x="24" y="101" width="1552" height="790" rx="18" fill="#121f33" stroke="#2e415d"/><text x="48.00" y="139.00" font-size="25" fill="#e8eef9" font-weight="700">Dを残した状態で、両方の攻略を計画</text><text x="49.00" y="171.00" font-size="18" fill="#a6b5cf" font-weight="400">主：岩肩を越えてCへ入り、Dの上を越し撃ち　／　別解：坑外RからMを経て坑口へ通す</text><polygon points="125.00,562.50 215.00,570.00 290.00,577.50 380.00,562.50 470.00,532.50 567.50,495.00 657.50,465.00 740.00,510.00 830.00,570.00 920.00,630.00 972.50,645.00 1145.00,645.00 1190.00,645.00 1220.00,615.00 1287.50,577.50 1325.00,562.50 1325.00,825.00 125.00,825.00" fill="#343e5b" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="125.00,562.50 215.00,570.00 290.00,577.50 380.00,562.50 470.00,532.50 567.50,495.00 657.50,465.00 740.00,510.00 830.00,570.00 920.00,630.00 972.50,645.00 1145.00,645.00 1190.00,645.00 1220.00,615.00 1287.50,577.50 1325.00,562.50" fill="none" stroke="#b7b7df" stroke-width="1.5"/><circle cx="597.50" cy="367.50" r="120.00" fill="#b69bea" fill-opacity=".10" stroke="#bba3ec" stroke-width="1.4" stroke-dasharray="6 5"/><text x="589.50" y="373.50" font-size="18" fill="#c7b0ef" font-weight="700">M</text><polygon points="695.00,255.00 762.50,217.50 875.00,195.00 1017.50,217.50 1152.50,270.00 1257.50,322.50 1325.00,360.00 1325.00,562.50 1287.50,577.50 1220.00,615.00 1190.00,645.00 1175.00,517.50 1137.50,412.50 1047.50,375.00 927.50,337.50 807.50,330.00 732.50,330.00 695.00,337.50" fill="#546987" stroke="#a7bfd4" stroke-width="1.5" stroke-linejoin="round"/><polygon points="890.00,610.00 920.00,630.00 950.00,638.57 950.00,562.50 920.00,525.00 890.00,540.00" fill="url(#ore)" stroke="#f7c388" stroke-width="1.5" stroke-linejoin="round"/><polyline points="260.00,567.00 380.00,555.00 470.00,525.00 567.50,487.50 657.50,457.50 740.00,502.50 845.00,572.50" fill="none" stroke="#c1cedf" stroke-width="1.6" stroke-dasharray="2 7"/><polyline points="845.00,557.50 912.50,465.00 980.00,502.50 1044.50,615.00" fill="none" stroke="#83e9c7" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#mainArrow)" stroke-linejoin="round"/><polyline points="485.00,504.23 552.50,367.50 620.00,322.50 695.00,360.00 785.00,412.50 890.00,487.50 972.50,547.50 1044.50,615.00" fill="none" stroke="#a5bcff" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#altArrow)" stroke-linejoin="round"/><rect x="243.50" y="548.25" width="33.00" height="20.25" rx="3" fill="#28564f" stroke="#75e0c4" stroke-width="1.7"/><polyline points="242.75,571.50 277.25,571.50" stroke="#75e0c4" stroke-width="3"/><text x="248.00" y="599.50" font-size="16" fill="#75e0c4" font-weight="700">P0</text><ellipse cx="1070.00" cy="627.00" rx="26.25" ry="19.50" fill="#623c50" stroke="#ff8e94" stroke-width="2"/><line x1="1070.0" y1="630.0" x2="1044.5" y2="615.0" stroke="#ff8e94" stroke-width="3"/><circle cx="1044.5" cy="615.0" r="13.5" fill="#ffdb99" stroke="#f29a79" stroke-width="1.4"/><text x="1028.00" y="671.00" font-size="16" fill="#ff8e94" font-weight="700">中ボス</text><circle cx="845.0" cy="557.5" r="8" fill="#121f33" stroke="#83e9c7" stroke-width="2"/><text x="840.00" y="562.50" font-size="13" fill="#83e9c7" font-weight="700">C</text><circle cx="485.0" cy="504.2307692307693" r="8" fill="#121f33" stroke="#a5bcff" stroke-width="2"/><text x="480.00" y="509.23" font-size="13" fill="#a5bcff" font-weight="700">R</text><polyline points="260.00,552.00 1044.50,615.00" fill="none" stroke="#ee8f9c" stroke-width="1.8" stroke-dasharray="3 5" opacity=".78"/><text x="780.00" y="245.00" font-size="17" fill="#e8eef9" font-weight="400">F01：背面の岩盤に接続する固定天井</text><text x="515.00" y="681.00" font-size="20" fill="#d5dcf0" font-weight="700">固定の岩肩</text><text x="287.00" y="712.00" font-size="17" fill="#eea5b1" font-weight="400">破壊後も坑外からの直線を遮る</text><text x="880.00" y="710.00" font-size="18" fill="#f3c68e" font-weight="700">D：一時的な防御</text><text x="1040.00" y="462.00" font-size="17" fill="#83e9c7" font-weight="400">CからDを残して越し撃ち</text><text x="228.00" y="320.00" font-size="17" fill="#a5bcff" font-weight="400">R → M → 岩肩の上 → 坑口</text><rect x="25" y="839" width="1550" height="42" fill="#121f33"/><text x="48.00" y="865.00" font-size="18" fill="#e8eef9" font-weight="400">Dの破壊は攻略の前提にしない。固定の岩肩を越えるか、Mを経由するかという判断が残る。</text><text x="40.00" y="924.00" font-size="16" fill="#a6b5cf" font-weight="400">灰紫＝固定床　灰青＝固定天井　橙の斜線＝一時防御D　赤い点線＝P0から敵への比較用直線</text><text x="40.00" y="951.00" font-size="16" fill="#a6b5cf" font-weight="400">緑・青の破線は攻略の模式線。実弾道、実移動、反撃への防御効果、24行動勝利は未検証。</text></g></svg>
