<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-label="82面v2 根間の床鏡と開いた磁場台"><title>82面v2 根間の床鏡と開いた磁場台</title><rect width="100%" height="100%" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#dce8f5">ARCLINE 082 v2｜根間の床鏡と開いた磁場台</text><text x="40" y="82" font-size="19" fill="#adc0d7">固定根を残し、低い窓から床Wへ入れる ／ 開いたAからMへ入れる</text><polygon points="80,660 464,660 464,916 80,916" fill="#314551"/><polyline points="80,660 464,660" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="480,836 656,820 720,820 800,804 840,756 920,756 976,820 1136,836 1136,916 480,916" fill="#314551"/><polyline points="480,836 656,820 720,820 800,804 840,756 920,756 976,820 1136,836" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="1184,516 1480,516 1480,916 1184,916" fill="#314551"/><polyline points="1184,516 1480,516" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="480,428 544,356 640,372 696,444 696,508 632,516 560,476 496,500" fill="#4b7168" stroke="#b5ccaa" stroke-width="1.5"/><polygon points="1088,428 1144,380 1208,396 1264,460 1304,516 1304,612 1248,612 1216,516 1176,444 1128,460 1088,492" fill="#4b7168" stroke="#b5ccaa" stroke-width="1.5"/><polygon points="544,830.1818181816 576,827.2727272728 576,708 544,708" fill="#b28a56" stroke="#b5ccaa" stroke-width="1.5"/><polyline points="720,820.0 800,804.0" fill="none" stroke="#83d9ee" stroke-width="2.5" stroke-dasharray=""/><circle cx="1032" cy="644" r="112" fill="#b397e8" fill-opacity=".12" stroke="#c1a8eb" stroke-dasharray="6 5"/><polyline points="368,636 424,636 520,656.0 600,692 672,736.0 752,804 760,812 848,621.6 944,467.2 1064,352.0 1144,323.20000000000005 1200,326.4 1400,492" fill="none" stroke="#83d9ee" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="880,732 952,692 1032,588 1096,372 1184,276 1400,492" fill="none" stroke="#d4b6ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="368,636 456,292 720,196 880,324 880,756" fill="none" stroke="#b3c7d7" stroke-width="2.5" stroke-dasharray="2 7"/><ellipse cx="368" cy="648" rx="17.6" ry="12" fill="#76e0c4"/><ellipse cx="1400" cy="504" rx="17.6" ry="12" fill="#ff9caa"/><polyline points="504,452 560,412 632,428 672,476" fill="none" stroke="#789389" stroke-width="2.5" stroke-dasharray=""/><polyline points="1104,460 1152,420 1208,436 1264,532" fill="none" stroke="#789389" stroke-width="2.5" stroke-dasharray=""/><text x="360" y="296" font-size="18" fill="#dce8f5">F01 左の固定根：低い入射帯の上に張り出す</text><text x="1070" y="316" font-size="18" fill="#dce8f5">F02 右の返し根：敵側へ接続</text><text x="220" y="710" font-size="18" fill="#76e0c4">P0：左根より手前。頭上は開放</text><text x="680" y="880" font-size="18" fill="#83d9ee">W：支持された床面の一段だけ</text><text x="830" y="794" font-size="18" fill="#d4b6ff">A：頭上の開いた固定台</text><text x="986" y="655" font-size="23" fill="#d4b6ff">M −1</text><text x="425" y="758" font-size="17" fill="#e6ba6f">D03：窓の下部</text><text x="425" y="787" font-size="16" fill="#e6ba6f">上側は壊さず通す</text><text x="1260" y="563" font-size="18" fill="#ff9caa">enemy:gust</text><text x="730" y="224" font-size="18" fill="#83d9ee">W反射後はMの上を回す構想</text><circle cx="880" cy="751" r="5" fill="#d4b6ff"/><path d="M368,581l7,7l-7,7l-7,-7z" fill="#ffe59a"/><text x="190" y="582" font-size="16" fill="#ffe59a">W10（既存試用・任意）</text><text x="40" y="965" font-size="21" fill="#dce8f5">主攻略：根下の常設開口を通し、床Wへ落として一回反射。反射下面は新設しない。</text><text x="40" y="1003" font-size="19" fill="#d4b6ff">別の選択：Aへ転移し初期−1のMへ入れる。WとMの一発連鎖は必須にしない。</text><text x="40" y="1041" font-size="18" fill="#adc0d7">D03を壊すと窓の下部も開く。根・床・支持は残り、代表直射も固定地形が遮る。</text><text x="40" y="1079" font-size="18" fill="#ffb8ad">P0/Aの頭上を開き、Aへ上から進入する空間を確保。射撃後はその位置で反撃を受ける。</text><text x="40" y="1119" font-size="17" fill="#adc0d7">破線は構想空間。W反射・M命中・転移着地・敵AI・20行動勝利は未検証。設計承認待ち。</text></g></svg>
