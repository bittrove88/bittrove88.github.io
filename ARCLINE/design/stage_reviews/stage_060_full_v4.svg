<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1200" viewBox="0 0 1600 1200" role="img" aria-label="双送風機と風陰の出口"><title>双送風機と風陰の出口</title><rect width="100%" height="100%" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#dce8f5">ARCLINE 060 v4｜双送風機と風陰の出口</text><text x="40" y="82" font-size="19" fill="#adc0d7">高所はすぐに攻め、低所は氷片を残すか開いて進む。頭上の開いた出口へ整える。</text><polygon points="80.0,482.0 158.0,427.4 282.79999999999995,427.4 384.2,474.2 454.4,567.8 532.4,716.0 626.0,817.4 672.8,856.4 938.0,856.4 1062.8,794.0 1187.6,684.8 1312.3999999999999,482.0 1421.6,404.0 1484.0,435.20000000000005 1484.0,973.4 80.0,973.4" fill="#314f68"/><polyline points="80.0,482.0 158.0,427.4 282.79999999999995,427.4 384.2,474.2 454.4,567.8 532.4,716.0 626.0,817.4 672.8,856.4 938.0,856.4 1062.8,794.0 1187.6,684.8 1312.3999999999999,482.0 1421.6,404.0 1484.0,435.20000000000005" fill="none" stroke="#afdaea" stroke-width="2.5" stroke-dasharray=""/><polygon points="384.2,630.2 470.0,653.6 587.0,692.6 657.1999999999999,700.4 657.1999999999999,770.6 587.0,762.8 470.0,723.8 384.2,677.0" fill="#426f8c" stroke="#b7d7e8" stroke-width="1.5"/><polygon points="953.6,560.0 1000.4,489.8 1031.6,388.4 1062.8,388.4 1125.2,497.6 1257.8,497.6 1328.0,380.6 1437.2,341.6 1484.0,372.80000000000007 1484.0,474.2 1351.3999999999999,482.0 1211.0,599.0 1062.8,614.6 953.6,622.4000000000001" fill="#426f8c" stroke="#b7d7e8" stroke-width="1.5"/><polygon points="750.8,856.4 774.1999999999999,856.4 774.1999999999999,731.6 766.4,700.4 750.8,723.8" fill="#b39468" stroke="#b7d7e8" stroke-width="1.5"/><polygon points="1008.1999999999999,464.45 1031.6,388.4 1055.0,388.4 1055.0,326.0 1031.6,302.6 1008.1999999999999,349.4" fill="#b39468" stroke="#b7d7e8" stroke-width="1.5"/><rect x="446.59999999999997" y="263.6" width="780.0" height="413.4" fill="#7cc9db" fill-opacity=".13" stroke="#8cd9e5" stroke-dasharray="5 5"/><polyline points="236.0,404.0 407.59999999999997,263.6 587.0,443.0 672.8,684.8 704.0,856.4" fill="none" stroke="#c4cfdf" stroke-width="2.5" stroke-dasharray="2 7"/><polyline points="236.0,404.0 501.2,201.20000000000005 766.4,170.0 1000.4,240.20000000000005 1154.06,453.92" fill="none" stroke="#b2c8ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="813.1999999999999,833.0 914.6,466.40000000000003 1016.0,216.80000000000007 1094.0,263.6 1154.06,453.92" fill="none" stroke="#86e3db" stroke-width="2.5" stroke-dasharray="8 7"/><circle cx="704.0" cy="851.4" r="5" fill="#a2e6f0"/><circle cx="813.1999999999999" cy="851.4" r="5" fill="#a2e6f0"/><polyline points="704.0,926.6 813.1999999999999,926.6" fill="none" stroke="#86e3db" stroke-width="2" stroke-dasharray="5 4"/><ellipse cx="236.0" cy="415.4" rx="17.16" ry="12" fill="#76e0c4"/><ellipse cx="1187.6" cy="471.86" rx="51.48" ry="24.96" fill="#dd91a7"/><circle cx="1187.6" cy="464.06000000000006" r="17.16" fill="#f0d3df"/><circle cx="1154.06" cy="453.92" r="17.939999999999998" fill="#f4acbd" stroke="#ffdeea" stroke-width="1.5"/><circle cx="1221.14" cy="453.92" r="17.939999999999998" fill="#f4acbd" stroke="#ffdeea" stroke-width="1.5"/><text x="120" y="390" font-size="18" fill="#76e0c4">P0：開始高所</text><text x="425" y="600" font-size="18" fill="#adc0d7">F01：短くした西氷壁の返し</text><text x="530" y="898" font-size="18" fill="#86e3db">B：低い準備位置</text><text x="810" y="898" font-size="18" fill="#86e3db">C：頭上の開いた出口</text><text x="648" y="732" font-size="18" fill="#f1d097">D03：前面の独立氷片</text><text x="698" y="950" font-size="18" fill="#adc0d7">B→C：140px（D03開口後・次手番）</text><text x="940" y="340" font-size="18" fill="#f1d097">D04：任意の角度改善</text><text x="965" y="655" font-size="18" fill="#adc0d7">F02：固定氷肩とボス棚</text><text x="1155" y="535" font-size="18" fill="#ffadbd">WHITEHOWL</text><text x="1120" y="410" font-size="18" fill="#ffadbd">FAN A / FAN B</text><text x="470" y="330" font-size="18" fill="#8cd9e5">F ↔：送風機破壊で弱体化</text><text x="40" y="1010" font-size="20" fill="#dce8f5">高所：P0からすぐに氷肩を越してFANを狙う構想。風と反撃を受け入れる。</text><text x="40" y="1048" font-size="19" fill="#86e3db">低所：BでD03を残して準備。開けた場合は次手番に140px先のCへ進み、撃ち上げる。</text><text x="40" y="1086" font-size="18" fill="#ffb6aa">D03破壊直後はBで反撃。D04は任意破壊で、風を弱めるのはボスの送風機だけ。</text><text x="40" y="1124" font-size="18" fill="#adc0d7">P0/B/Cの頭上は開放。低所の安全性・命中・必要手数は未測定。既存の24行動を維持。</text><text x="40" y="1162" font-size="17" fill="#adc0d7">破線は構想空間。最低限の整合・形状・描画のみ確認。実移動・弾道・ボス戦は一括検証へ。</text></g></svg>
