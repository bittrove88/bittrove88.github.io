<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1170" viewBox="0 0 1600 1170" role="img" aria-label="58面v5 ずれた氷裂の三層洞"><title>58面v5 ずれた氷裂の三層洞</title><rect width="100%" height="100%" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#dce8f5">ARCLINE 058 v5｜ずれた氷裂の三層洞</text><text x="40" y="82" font-size="19" fill="#adc0d7">破壊を進行条件にしない。常設開口から中層へ、さらに上層へ回る選択を残す。</text><polygon points="80.0,845.4 267.2,845.4 399.8,814.2 509.0,829.8 641.6,829.8 735.1999999999999,853.2 953.6,853.2 1140.8,822.0 1312.3999999999999,822.0 1484.0,806.4 1484.0,923.4 80.0,923.4" fill="#314f68"/><polyline points="80.0,845.4 267.2,845.4 399.8,814.2 509.0,829.8 641.6,829.8 735.1999999999999,853.2 953.6,853.2 1140.8,822.0 1312.3999999999999,822.0 1484.0,806.4" fill="none" stroke="#afdaea" stroke-width="2.5" stroke-dasharray=""/><polygon points="80.0,572.4000000000001 220.4,556.8 368.59999999999997,595.8 423.2,650.4 423.2,728.4 290.6,705.0 80.0,689.4" fill="#426f8c" stroke="#b7d7e8" stroke-width="1.5"/><polygon points="672.8,627.0 743.0,595.8 883.4,595.8 977.0,627.0 1070.6,603.6 1195.3999999999999,580.2 1351.3999999999999,611.4000000000001 1484.0,595.8 1484.0,681.6 1320.2,705.0 1179.8,673.8 1070.6,697.2 938.0,720.6 743.0,712.8 672.8,681.6" fill="#426f8c" stroke="#b7d7e8" stroke-width="1.5"/><polygon points="80.0,299.4 243.79999999999998,291.6 384.2,322.80000000000007 501.2,354.0 501.2,463.2 353.0,432.0 228.2,416.40000000000003 80.0,424.2" fill="#426f8c" stroke="#b7d7e8" stroke-width="1.5"/><polygon points="1000.4,354.0 1125.2,354.0 1172.0,260.4 1218.8,260.4 1273.3999999999999,354.0 1484.0,354.0 1484.0,471.0 1273.3999999999999,478.8 1156.3999999999999,455.40000000000003 1031.6,455.40000000000003 1000.4,416.40000000000003" fill="#426f8c" stroke="#b7d7e8" stroke-width="1.5"/><polygon points="423.2,728.4 470.0,705.0 470.0,627.0 423.2,650.4" fill="#b39468" stroke="#b7d7e8" stroke-width="1.5"/><polygon points="938.0,439.8 1000.4,416.40000000000003 1000.4,354.0 938.0,369.6" fill="#b39468" stroke="#b7d7e8" stroke-width="1.5"/><rect x="867.8" y="276.0" width="163.79999999999998" height="249.6" fill="#7cc9db" fill-opacity=".13" stroke="#8cd9e5" stroke-dasharray="5 5"/><polyline points="821.0,572.4000000000001 906.8,385.20000000000005 992.6,229.20000000000005 1156.3999999999999,159.0 1343.6,330.6" fill="none" stroke="#86e3db" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="1078.4,330.6 1156.3999999999999,190.20000000000005 1242.2,198.0 1343.6,330.6" fill="none" stroke="#b2c8ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="563.5999999999999,806.4 626.0,588.0 750.8,463.2 821.0,595.8" fill="none" stroke="#c4cfdf" stroke-width="2.5" stroke-dasharray="2 7"/><polyline points="821.0,572.4000000000001 852.1999999999999,229.20000000000005 1016.0,120.0 1078.4,354.0" fill="none" stroke="#c4cfdf" stroke-width="2.5" stroke-dasharray="2 7"/><ellipse cx="563.5999999999999" cy="817.8" rx="17.16" ry="12" fill="#76e0c4"/><ellipse cx="1343.6" cy="342.0" rx="17.16" ry="12" fill="#ff9caa"/><circle cx="821.0" cy="590.8" r="5" fill="#a2e6f0"/><circle cx="1078.4" cy="349.0" r="5" fill="#a2e6f0"/><text x="510" y="872" font-size="18" fill="#76e0c4">P0：下層の開いた氷裂</text><text x="770" y="649" font-size="18" fill="#86e3db">A：中層の支持面</text><text x="1014" y="409" font-size="18" fill="#b2c8ff">B：風の外の上層</text><text x="1270" y="390" font-size="18" fill="#ff9caa">enemy:mist</text><text x="888" y="481" font-size="24" fill="#8cd9e5">F ↔</text><text x="888" y="510" font-size="16" fill="#8cd9e5">現在の風向きを読む</text><text x="420" y="721" font-size="18" fill="#dce8f5">常設の下側開口</text><text x="420" y="750" font-size="16" fill="#e6c692">温存時も260px</text><text x="590" y="342" font-size="18" fill="#dce8f5">ずれた上側開口</text><text x="590" y="371" font-size="16" fill="#e6c692">温存時も560px</text><text x="270" y="646" font-size="16" fill="#e6c692">D05：開口端の氷片</text><text x="1030" y="461" font-size="16" fill="#e6c692">D06：開口端の氷片</text><text x="90" y="530" font-size="17" fill="#dce8f5">中層西の固定氷棚</text><text x="90" y="254" font-size="17" fill="#dce8f5">上層西の固定氷盤</text><text x="40" y="971" font-size="21" fill="#dce8f5">主攻略：破壊ゼロでAへ移り、F越しに氷背を越す構想。</text><text x="40" y="1010" font-size="19" fill="#b2c8ff">別の選択：常設開口からBへ移り、Fを外す。追加の移動手数と反撃を受け入れる。</text><text x="40" y="1049" font-size="18" fill="#adc0d7">D05/D06は開口の端だけ。破壊は余白を広げる任意の選択で、支持を失わせない。</text><text x="40" y="1088" font-size="18" fill="#ffb8ad">P0/Aの頭上は開放。射撃後は同位置で反撃を受け、同手番の退避・無償の風待ちはない。</text><text x="40" y="1127" font-size="17" fill="#adc0d7">破線は構想空間。最低限の形状確認のみ実施。実転移・弾道・敵AI・16行動勝利は一括検証へ。</text></g></svg>
