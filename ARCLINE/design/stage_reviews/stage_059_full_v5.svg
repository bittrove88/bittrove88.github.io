"650" font-size="18" fill="#adc0d7">谷底から下面まで330px以上</text><text x="620" y="750" font-size="18" fill="#86e3db">B：下道からF03へ</text><text x="800" y="690" font-size="18" fill="#f5d27d">W：F03の実体斜面</text><text x="930" y="325" font-size="18" fill="#dce8f5">F01：直射を切る西の氷背</text><text x="1060" y="420" font-size="18" fill="#ff9caa">enemy:gust</text><text x="1080" y="560" font-size="18" fill="#adc0d7">F02：右岸への氷根</text><text x="345" y="395" font-size="18" fill="#8cd9e5">F ↔</text><text x="870" y="540" font-size="18" fill="#8cd9e5">F ↔</text><text x="330" y="490" font-size="18" fill="#eed386">SK059（5手番）</text><text x="40" y="1000" font-size="20" fill="#dce8f5">主攻略：F04上のAへ移り、風域の上方を主に通る弧で氷背を越す構想。</text><text x="40" y="1038" font-size="19" fill="#86e3db">別の選択：下道からBへ。Wに低く入射し、氷稜の端の外からF越しに跳ね上げる。</text><text x="40" y="1076" font-size="18" fill="#adc0d7">旧F05の高棚はF04上へ役割を統合。破壊なし。P0/Aの頭上は開放。</text><text x="40" y="1114" font-size="18" fill="#ffb6aa">両経路とも射撃位置で反撃を受ける。同手番の退避や、下道の安全を仮定しない。</text><text x="40" y="1152" font-size="17" fill="#adc0d7">破線は構想空間。実歩行・転移・W/F弾道・敵AI・16行動勝利は最後に一括検証。</text></g></svg>
