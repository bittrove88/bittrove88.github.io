<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1145" viewBox="0 0 1600 1145" role="img" aria-label="87面v2 荷役板の陰と雲外の貨物棚"><title>87面v2 荷役板の陰と雲外の貨物棚</title><rect width="100%" height="100%" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#dce8f5">ARCLINE 087 v2｜荷役板の陰と雲外の貨物棚</text><text x="40" y="82" font-size="20" fill="#adc0d7">橋の上を歩く面から、固定射点前の遮蔽状態とC内外を選ぶ面へ</text><polygon points="80,900 144,900 144,916 80,916" fill="#314551"/><polyline points="80,900 144,900" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="1504,900 1520,900 1520,916 1504,916" fill="#314551"/><polyline points="1504,900 1520,900" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="304,668 392,684 464,700 720,700 720,772 584,820 432,796 328,748" fill="#536878" stroke="#b6c6ce" stroke-width="1.5"/><polygon points="1032,644 1056,596 1152,596 1184,644 1136,716 1056,708" fill="#536878" stroke="#b6c6ce" stroke-width="1.5"/><polygon points="1184,500 1456,500 1496,548 1448,652 1240,644 1184,580" fill="#536878" stroke="#b6c6ce" stroke-width="1.5"/><polygon points="1248,500 1288,500 1288,380 1248,380" fill="#b28a56" stroke="#b6c6ce" stroke-width="1.5"/><polygon points="720,700 777.9754661029647,483.6326149112487 777.9754661029647,493.23261491124873 720,709.6" fill="#c4a66a" stroke="#e6ba6f" stroke-width="1.5" stroke-dasharray=""/><rect x="800" y="340" width="224" height="288" fill="#a5b7c9" fill-opacity=".13" stroke="#a5b7c9" stroke-dasharray="5 5"/><polyline points="576,676 688,532 784,412 912,340 1104,212 1280,228 1400,476" fill="none" stroke="#76e0c4" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="1104,572 1184,292 1288,244 1400,476" fill="none" stroke="#9dc9f6" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="576,676 704,380 976,132 1104,228 1104,596" fill="none" stroke="#aabccf" stroke-width="2.5" stroke-dasharray="2 7"/><ellipse cx="576" cy="688" rx="17.6" ry="12" fill="#76e0c4"/><ellipse cx="1400" cy="488" rx="17.6" ry="12" fill="#ff9caa"/><polygon points="720,700 944.0,700.0 944.0,709.6 720,709.6" fill="none" stroke="#e6ba6f" stroke-width="1.5" stroke-dasharray="4 5"/><polyline points="880,580 576,676" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray="4 7"/><text x="520" y="167" font-size="18" fill="#76e0c4">P0側：Bの上を越してCへ入れる構想</text><text x="1040" y="191" font-size="18" fill="#9dc9f6">A側：Cを避ける山越しの構想</text><text x="350" y="760" font-size="18" fill="#76e0c4">P0：橋手前の固定甲板</text><text x="815" y="545" font-size="23" fill="#b7c8db">C：速度減衰</text><text x="815" y="575" font-size="17" fill="#b7c8db">視界・弾を遮る壁ではない</text><text x="575" y="445" font-size="18" fill="#e6ba6f">B 起立時（実線）</text><text x="575" y="474" font-size="16" fill="#e6ba6f">水平時は点線／初期は水平</text><text x="1008" y="697" font-size="18" fill="#9dc9f6">A：Cの外の固定貨物棚</text><text x="1240" y="352" font-size="18" fill="#e6ba6f">D04：独立遮板</text><text x="1240" y="381" font-size="16" fill="#e6ba6f">破壊で低めの弧を開く</text><text x="1270" y="629" font-size="18" fill="#dce8f5">直射は固定船体が遮る</text><text x="1350" y="546" font-size="17" fill="#ff9caa">enemy:volt</text><circle cx="1104" cy="591" r="5" fill="#9dc9f6"/><path d="M552,621l7,7l-7,7l-7,-7z" fill="#ffe59a"/><text x="350" y="600" font-size="16" fill="#ffe59a">W11（既存試用・任意）</text><text x="40" y="864" font-size="18" fill="#e6ba6f">橙の低い入射線の例：起立Bで遮断／水平では開く。実際の全反撃を防ぐ保証ではない。</text><text x="40" y="938" font-size="21" fill="#dce8f5">主構想：固定P0からCを通す。橋上を必須射点にせず、姿勢変更時の接地に依存しない。</text><text x="40" y="978" font-size="19" fill="#9dc9f6">別の選択：C外のAへ転移し、速度減衰を避ける。準備手数・着地・反撃を受け入れる。</text><text x="40" y="1017" font-size="18" fill="#adc0d7">Cは物理的な遮蔽ではない。初期敵への代表直射は、BやD04がなくても固定船体が遮る。</text><text x="40" y="1056" font-size="18" fill="#ffb8ad">P0/Aの頭上は開放。射撃後は同じ位置で反撃を受け、無償の橋待ち・同手番の退避はない。</text><text x="40" y="1098" font-size="17" fill="#adc0d7">破線は構想。実射への防御・C命中・転移着地・敵AI・20行動勝利は未検証。設計承認待ち。</text></g></svg>
