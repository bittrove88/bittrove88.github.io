<svg xmlns="http://www.w3.org/2000/svg" width="1650" height="1240" viewBox="0 0 1650 1240"><style>text{font-family:"Noto Sans CJK JP","Noto Sans",sans-serif}</style><rect width="1650" height="1240" fill="#09212b"/><text x="50" y="45" font-size="32" fill="#effaf4">ARCLINE 071｜鉱石を引く二つの線｜設計承認v5</text><text x="50" y="84" font-size="23" fill="#bfd6d2">F01/F02は小型浮遊ブロック・F03は元の鉱脈外形のまま4分割</text><g transform="translate(50 505)"><rect width="1540" height="940" x="0" y="-380" fill="#112936"/><polygon points="0,50 120,40 230,10 310,20 370,70 420,130 480,240 540,380 610,460 690,490 890,490 950,460 1020,370 1100,260 1190,150 1250,110 1360,90 1470,90 1540,130 1540,560 0,560" fill="#3b5b4f"/><polyline points="0,50 120,40 230,10 310,20 370,70 420,130 480,240 540,380 610,460 690,490 890,490 950,460 1020,370 1100,260 1190,150 1250,110 1360,90 1470,90 1540,130" stroke="#9fe7c1" stroke-width="6" fill="none"/><polygon points="570,310 610,270 660,270 690,300 650,330 590,330" fill="#7f97aa" stroke="#edf8f2" stroke-width="3"/><text x="628.3333333333334" y="301.6666666666667" font-size="25" fill="white" text-anchor="middle">F01</text><polygon points="950,190 990,150 1040,140 1080,160 1060,200 990,210" fill="#7f97aa" stroke="#edf8f2" stroke-width="3"/><text x="1018.3333333333333" y="175" font-size="25" fill="white" text-anchor="middle">F02</text><polygon points="1110,-30 1160,-160 1220,-150 1170,-70 1130,0" fill="#b3926a" stroke="#f0e9db" stroke-width="3"/><text x="1158" y="-82" fill="#fff4df" font-size="19" text-anchor="middle">D01</text><polygon points="1160,-160 1220,-280 1260,-300 1300,-260 1320,-210 1260,-190 1220,-150" fill="#b3926a" stroke="#f0e9db" stroke-width="3"/><text x="1248.5714285714287" y="-221.42857142857133" fill="#fff4df" font-size="19" text-anchor="middle">D02</text><polygon points="1260,-190 1320,-210 1350,-200 1380,-200 1400,-80 1400,0 1300,-130" fill="#b3926a" stroke="#f0e9db" stroke-width="3"/><text x="1344.2857142857142" y="-144.28571428571433" fill="#fff4df" font-size="19" text-anchor="middle">D03</text><polygon points="1300,-130 1400,0 1400,70 1390,100 1350,90 1340,-30" fill="#b3926a" stroke="#f0e9db" stroke-width="3"/><text x="1363.3333333333335" y="16.66666666666663" fill="#fff4df" font-size="19" text-anchor="middle">D04</text><line x1="690" y1="490" x2="890" y2="490" stroke="#96dfff" stroke-width="9" stroke-dasharray="14 7"/><text x="690" y="471" font-size="23" fill="#c9ebff">W</text><circle cx="910" cy="270" r="22" stroke="#efd1fb" stroke-width="4" fill="#efd1fb" fill-opacity=".17"/><text x="940" y="280" fill="#efd1fb" font-size="25">M</text><polyline points="720,470 790,460 890,380 910,270" fill="none" stroke="#ffd18c" stroke-width="4" stroke-dasharray="11 8"/><polyline points="1010,110 1110,-20 1230,-180 1370,-260 1470,50" fill="none" stroke="#bdd7ff" stroke-width="4" stroke-dasharray="11 8"/><polyline points="1370,-230 1410,-150 1470,50" fill="none" stroke="#deb9ff" stroke-width="4" stroke-dasharray="11 8"/><circle cx="230" cy="-12" r="13" fill="#aef0d3" stroke="#203842" stroke-width="2"/><text x="250" y="-23" font-size="25" fill="#aef0d3">P</text><circle cx="1470" cy="68" r="13" fill="#f5aaa4" stroke="#203842" stroke-width="2"/><text x="1490" y="57" font-size="25" fill="#f5aaa4">E</text><circle cx="720" cy="468" r="13" fill="#e5caff" stroke="#203842" stroke-width="2"/><text x="740" y="457" font-size="25" fill="#e5caff">A</text><circle cx="1010" cy="124" r="13" fill="#e5caff" stroke="#203842" stroke-width="2"/><text x="1030" y="113" font-size="25" fill="#e5caff">C</text><circle cx="1370" cy="-222" r="13" fill="#e5caff" stroke="#203842" stroke-width="2"/><text x="1390" y="-233" font-size="25" fill="#e5caff">B</text></g><text x="50" y="1150" fill="#ffd18c" font-size="22">A：WとMを使う谷底　　C：中段浮遊棚　　B：鉱脈の右肩</text><text x="50" y="1190" fill="#bed2d1" font-size="19">破線は構想線で実弾道ではない／D01〜D04は個別破壊の設計単位</text></svg>