<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-label="79面v3 屋根撤去と岩脊による直射遮断"><title>79面v3 屋根撤去と岩脊による直射遮断</title><rect width="100%" height="100%" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#dce8f5">ARCLINE 079 v3｜開放保守台と岩脊越しの接続橋</text><text x="40" y="82" font-size="20" fill="#adc0d7">P0の屋根を撤去。Lの頭上も開き、敵前の岩脊で直射を遮る。</text><polygon points="90,394 234,402 402,426 514,434 610,434 610,866 90,866" fill="#384b5b"/><polyline points="90,394 234,402 402,426 514,434 610,434" fill="none" stroke="#bdd1cb" stroke-width="2.5" stroke-dasharray=""/><polygon points="610,778 1186,778 1186,866 610,866" fill="#384b5b"/><polyline points="610,778 1186,778" fill="none" stroke="#bdd1cb" stroke-width="2.5" stroke-dasharray=""/><polygon points="1234,410 1258,242 1298,234 1330,410 1530,410 1530,866 1234,866" fill="#384b5b"/><polyline points="1234,410 1258,242 1298,234 1330,410 1530,410" fill="none" stroke="#bdd1cb" stroke-width="2.5" stroke-dasharray=""/><polygon points="674,434 770,434 802,466 770,506 690,506 674,482" fill="#5c7181" stroke="#b7c9d4" stroke-width="1.5"/><polygon points="818,778 818,658 898,658 898,778" fill="#5c7181" stroke="#b7c9d4" stroke-width="1.5"/><polyline points="610,434 674.0,434.0" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray=""/><circle cx="1042" cy="546" r="144" fill="#b397e8" fill-opacity=".12" stroke="#c1a8eb" stroke-dasharray="6 5"/><circle cx="874" cy="570" r="16" fill="#59492c" stroke="#e6ba6f"/><text x="869" y="575" font-size="15" fill="#ffe5a2">T</text><ellipse cx="594" cy="422" rx="17.6" ry="12" fill="#76e0c4"/><ellipse cx="1410" cy="398" rx="17.6" ry="12" fill="#ff9caa"/><polyline points="610,434 665.4256258422041,466.0" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray="3 4"/><polyline points="690,410 914,274 1130,170 1274,178 1410,386" fill="none" stroke="#76e0c4" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="858,634 930,578 1042,450 1146,282 1266,170 1410,386" fill="none" stroke="#e6ba6f" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="594,410 642,338 690,434" fill="none" stroke="#93b9df" stroke-width="2.5" stroke-dasharray="2 6"/><polyline points="594,410 746,314 858,370 858,658" fill="none" stroke="#93b9df" stroke-width="2.5" stroke-dasharray="2 6"/><circle cx="690" cy="429" r="5" fill="#76e0c4"/><circle cx="858" cy="653" r="5" fill="#76e0c4"/><text x="490" y="472" font-size="18" fill="#93b9df">P0：頭上に実体なし</text><text x="680" y="475" font-size="18" fill="#76e0c4">A：固定浮岩</text><text x="750" y="715" font-size="18" fill="#e6ba6f">新L：橋・浮岩の真下から移す</text><text x="750" y="746" font-size="17" fill="#93b9df">上方からの着地を狙う空間を開く</text><text x="1000" y="570" font-size="21" fill="#d5c3ff">M 初期＋1</text><text x="1000" y="600" font-size="17" fill="#d5c3ff">L側はT切替後の−1</text><text x="1245" y="212" font-size="18" fill="#dce8f5">敵前の固定岩脊</text><text x="1350" y="451" font-size="18" fill="#ff9caa">enemy:volt</text><text x="835" y="132" font-size="18" fill="#76e0c4">岩脊の上は開放：M曲射／通常の山越し弧を探る</text><polyline points="594,410 1242,394" fill="none" stroke="#e68e93" stroke-width="2.5" stroke-dasharray="5 7"/><path d="M1236,388l12,12m-12,0l12,-12" stroke="#ff9caa" stroke-width="3"/><polyline points="858,634 1234,466" fill="none" stroke="#e68e93" stroke-width="2.5" stroke-dasharray="5 7"/><path d="M1228,460l12,12m-12,0l12,-12" stroke="#ff9caa" stroke-width="3"/><text x="1200" y="518" font-size="17" fill="#ff9caa">代表直射を岩盤で遮断</text><path d="M490,355l7,7l-7,7l-7,-7z" fill="#ffe59a"/><text x="310" y="352" font-size="16" fill="#ffe59a">SK079（任意）</text><text x="40" y="942" font-size="21" fill="#dce8f5">修正① 整備アームを全撤去。P0から上向きに出す帯と、A/Lへの転移構想空間を残す。</text><text x="40" y="980" font-size="19" fill="#93b9df">修正② Lを右へ移し、橋と浮岩の下を避ける。固定支持面の幅は100px。</text><text x="40" y="1018" font-size="18" fill="#ffb8ad">修正③ 敵を岩脊の裏へ。初期敵位置へのP0/A/Lの代表直射は、両橋姿勢とも岩盤で遮断。</text><text x="40" y="1056" font-size="18" fill="#adc0d7">橋からAへ渡る／Aへ転移する／LでT/Mを使う選択を残す。P0からの山越しも禁止しない。</text><text x="40" y="1097" font-size="17" fill="#adc0d7">青点線＝転移の構想空間、緑・橙破線＝射撃の構想。実弾道・実着地の記録ではない。</text><text x="40" y="1138" font-size="17" fill="#adc0d7">静的確認のみ。転移・実歩行・T/M命中・敵AI・反撃・16行動勝利は未検証。設計承認待ち。</text></g></svg>
