<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="935" viewBox="0 0 1600 935" role="img" aria-labelledby="title desc">
<title id="title">76面v3 両岸から撃ち込む磁気降下槽</title><desc id="desc">76面の完成設計候補。左右の入射方向と磁場の極性の組合せを示す。破線は模式線で、実弾道・通行・勝利の検証結果ではない。</desc>
<defs><pattern id="ore" width="9" height="9" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="#df9954"/><path d="M-2 2L2 -2M0 9L9 0M7 11L11 7" stroke="#986739" stroke-width="1.2"/></pattern>
<marker id="mainArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#83e9c7"/></marker>
<marker id="altArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a5bcff"/></marker></defs>
<rect width="100%" height="100%" fill="#0c1424"/><g font-family='"Noto Sans CJK JP", "Noto Sans JP", sans-serif'><text x="38.00" y="44.00" font-size="29" fill="#e8eef9" font-weight="700">ARCLINE 076 v3  /  両岸から撃ち込む磁気降下槽</text><text x="40.00" y="78.00" font-size="17" fill="#a6b5cf" font-weight="400">完成設計案・承認待ち。Mの速度回転と入射方向を組み合わせ、中央の敵へ弾を落とす。</text><polygon points="100.00,383.00 191.20,390.60 297.60,405.80 495.20,405.80 540.80,466.60 594.00,611.00 662.40,633.80 905.60,633.80 974.00,588.20 1027.20,466.60 1072.80,405.80 1285.60,405.80 1392.00,383.00 1468.00,390.60 1468.00,770.60 100.00,770.60" fill="#343e5b" stroke="none" stroke-width="1.5" stroke-linejoin="round"/><polyline points="100.00,383.00 191.20,390.60 297.60,405.80 495.20,405.80 540.80,466.60 594.00,611.00 662.40,633.80 905.60,633.80 974.00,588.20 1027.20,466.60 1072.80,405.80 1285.60,405.80 1392.00,383.00 1468.00,390.60" fill="none" stroke="#b7b7df" stroke-width="1.5"/><circle cx="784.00" cy="360.20" r="152.00" fill="#b69bea" fill-opacity=".10" stroke="#bba3ec" stroke-width="1.4" stroke-dasharray="6 5"/><text x="776.00" y="366.20" font-size="18" fill="#c7b0ef" font-weight="700">M</text><polyline points="366.00,398.20 540.80,139.80 951.20,139.80 1202.00,398.20" fill="none" stroke="#c1cedf" stroke-width="1.6" stroke-dasharray="2 7"/><polyline points="366.00,383.00 502.80,307.00 639.60,307.00 715.60,390.60 761.20,504.60 784.00,611.00" fill="none" stroke="#a5bcff" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#altArrow)" stroke-linejoin="round"/><polyline points="1202.00,383.00 1065.20,307.00 928.40,307.00 852.40,390.60 806.80,504.60 784.00,611.00" fill="none" stroke="#83e9c7" stroke-width="2.5" stroke-dasharray="10 6" marker-end="url(#mainArrow)" stroke-linejoin="round"/><rect x="349.28" y="379.20" width="33.44" height="20.52" rx="3" fill="#28564f" stroke="#75e0c4" stroke-width="1.7"/><polyline points="348.52,402.76 383.48,402.76" stroke="#75e0c4" stroke-width="3"/><ellipse cx="784.00" cy="615.56" rx="26.60" ry="19.76" fill="#623c50" stroke="#ff8e94" stroke-width="2"/><circle cx="442.0" cy="307.0" r="15.2" fill="#59492c" stroke="#f3ce83"/><text x="437.00" y="312.00" font-size="15" fill="#ffe0a3" font-weight="400">T</text><text x="245.00" y="457.00" font-size="20" fill="#75e0c4" font-weight="700">L / P0</text><text x="1170.00" y="457.00" font-size="20" fill="#75e0c4" font-weight="700">R</text><text x="440.00" y="230.00" font-size="18" fill="#a5bcff" font-weight="400">左岸：T切替後 +1 ／ 右向きに入射</text><text x="855.00" y="230.00" font-size="18" fill="#83e9c7" font-weight="400">右岸：初期 −1 ／ 左向きに入射</text><text x="670.00" y="390.00" font-size="18" fill="#dab9ef" font-weight="400">M：円内を固定物で塞がない</text><text x="725.00" y="666.00" font-size="18" fill="#ff8e94" font-weight="400">低い敵</text><text x="155.00" y="790.00" font-size="18" fill="#e8eef9" font-weight="400">初期配置で両岸は同高度42、敵までの水平距離55。違いは距離ではなく、入射方向と必要な操作。</text><text x="155.00" y="824.00" font-size="17" fill="#a6b5cf" font-weight="400">Tへの操作射撃は左岸から。Tは次の手番境界でMの極性だけを反転する。</text><text x="40.00" y="900.00" font-size="16" fill="#a6b5cf" font-weight="400">緑・青の破線＝射撃の構想　白の点線＝右岸への再配置構想。実弾道・転移着地・16行動勝利は未検証。</text><polyline points="366.00,383.00 442.00,307.00" stroke="#f3ce83" stroke-width="2" stroke-dasharray="3 5"/></g></svg>
