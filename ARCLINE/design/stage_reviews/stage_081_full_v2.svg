<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="1155" viewBox="0 0 1460 1155" role="img" aria-label="81面v2 割れた根輪の内と外"><title>81面v2 割れた根輪の内と外</title><rect width="100%" height="100%" fill="#101b2b"/><g font-family="Noto Sans CJK JP, sans-serif"><text x="40" y="46" font-size="30" fill="#dce8f5">ARCLINE 081 v2｜割れた根輪の内と外</text><text x="40" y="82" font-size="19" fill="#adc0d7">同形島3段を廃止。外からK／内側でFを使う。開始点と内側の頭上は開放。</text><polygon points="100,855 156,855 156,904 100,904" fill="#314551"/><polyline points="100,855 156,855" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="1220,855 1290,855 1290,904 1220,904" fill="#314551"/><polyline points="1220,855 1290,855" fill="none" stroke="#b9cfc5" stroke-width="2.5" stroke-dasharray=""/><polygon points="170,694 219,659 366,659 401,701 338,750 226,736" fill="#4d6865" stroke="#b5ccaa" stroke-width="1.5"/><polygon points="527,316 555,407 583,526 639,624 702,652 807,652 863,575 898,463 926,365 1052,365 1094,414 1115,526 1073,645 975,764 814,820 674,806 548,729 478,589 464,456 485,358" fill="#4b7168" stroke="#b5ccaa" stroke-width="1.5"/><polygon points="352,659 366,659 394,692.6 394,575 352,582" fill="#b28a56" stroke="#b5ccaa" stroke-width="1.5"/><rect x="709" y="274" width="189" height="217" fill="#7cc9db" fill-opacity=".14" stroke="#8cd9e5" stroke-dasharray="5 5"/><polyline points="427.91730720048474,389.5373537051262 472.08269279951526,326.4626462948738" fill="none" stroke="#d4b6ff" stroke-width="2.5" stroke-dasharray=""/><polyline points="275,638 450,358 548,232 765,106 912,148 1003,344" fill="none" stroke="#d4b6ff" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="765,631 807,484 856,351 933,253 1003,344" fill="none" stroke="#8cd9e5" stroke-width="2.5" stroke-dasharray="8 7"/><polyline points="275,638 415,400 555,176 765,253 765,652" fill="none" stroke="#b3c7d7" stroke-width="2.5" stroke-dasharray="2 7"/><ellipse cx="275" cy="647" rx="15.400000000000002" ry="12" fill="#76e0c4"/><ellipse cx="1003" cy="353" rx="15.400000000000002" ry="12" fill="#ff9caa"/><text x="640" y="137" font-size="18" fill="#d4b6ff">外の主攻略：Kで一回反射し、根の上を回す構想</text><text x="280" y="412" font-size="21" fill="#d4b6ff">K −55°</text><text x="280" y="443" font-size="17" fill="#d4b6ff">入射方向で右上へ反射を狙う</text><text x="100" y="711" font-size="18" fill="#76e0c4">P0：外庭園／頭上は開放</text><text x="700" y="697" font-size="18" fill="#8cd9e5">A：輪の内側の固定足場</text><text x="700" y="726" font-size="16" fill="#adc0d7">着地候補の頭上に屋根を置かない</text><text x="705" y="423" font-size="24" fill="#8cd9e5">F ↔</text><text x="720" y="451" font-size="17" fill="#8cd9e5">手番周期の左右風</text><text x="910" y="262" font-size="18" fill="#dce8f5">上が割れた根輪</text><text x="1000" y="404" font-size="18" fill="#ff9caa">enemy:hang</text><text x="150" y="580" font-size="17" fill="#e6ba6f">D03：側面だけの枯れ枝</text><text x="150" y="609" font-size="16" fill="#e6ba6f">残してKへ。破壊は必須にしない</text><circle cx="765" cy="645" r="5" fill="#8cd9e5"/><text x="40" y="959" font-size="21" fill="#dce8f5">主攻略：外のP0からKへ入れ、Fの上側を回す。一発にKとFを両方使わせない。</text><text x="40" y="997" font-size="19" fill="#8cd9e5">別の選択：輪の内側のAへ転移し、今の風向きを読んでFの窓を通す。</text><text x="40" y="1035" font-size="18" fill="#adc0d7">直射は固定根で遮る。D03を除いても、P0/Aから初期敵位置への代表直射は開かない。</text><text x="40" y="1073" font-size="18" fill="#ffb8ad">屋根で移動を強制しない。射撃後はその位置で反撃を受け、同手番の退避はできない。</text><text x="40" y="1113" font-size="17" fill="#adc0d7">破線は構想空間。K反射・F弾道・転移着地・敵AI・20行動勝利は未検証。設計承認待ち。</text></g></svg>
